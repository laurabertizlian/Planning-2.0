function allTasksBlankFilters(){ return { multi:{}, from:'', to:'', q:'' }; }
function atClientName(id){ return id===INTERNAL_ID ? 'Internal / Non-client' : ((state.clients.find(c=>c.id===id)||{}).name||'—'); }
const AT_BLANK = '__blank__';

// Every filterable field. values(t) → the task's value(s); options(tasks) → [[value,label]].
function atFilterFields(){
  const distinct = (tasks, get) => { const set = new Set(); tasks.forEach(t=>[].concat(get(t)).forEach(v=>set.add(v))); return [...set]; };
  const withBlank = arr => arr.length ? arr : [AT_BLANK];
  const blankLabel = v => v===AT_BLANK ? '(blank)' : v;
  const fields = [
    { key:'client', label:'Client', values:t=>[t.clientId],
      options:()=>[...state.clients].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>[c.id,c.name]).concat([[INTERNAL_ID,'Internal / Non-client']]) },
    { key:'taskType', label:'Task Type', values:t=>[t.taskType], options:()=>[...new Set([...CORE_TYPES,...state.additionalTypes])].map(x=>[x,x]) },
    { key:'stylist', label:'Stylist', values:t=>[t.assignedStylist||'__unassigned__'],
      options:()=>[['__unassigned__','⚠ Unassigned']].concat([...state.stylists].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>[s.id,s.name])) },
    { key:'status', label:'Status', values:t=>[t.status], options:()=>STATUS_OPTIONS.map(x=>[x,x]) },
    { key:'opsLead', label:'Ops Lead', values:t=>[t.opsLead||AT_BLANK],
      options:()=>[[AT_BLANK,'(none)']].concat([...state.opsLeads].sort((a,b)=>a.name.localeCompare(b.name)).map(o=>[o.id,o.name])) },
    { key:'dayOfWeek', label:'Day', values:t=>[t.dayOfWeek||AT_BLANK], options:()=>['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>[x,x]) },
    { key:'primaryMethod', label:'Primary Method', values:t=>[t.primaryMethod||AT_BLANK],
      options:tasks=>distinct(tasks,t=>t.primaryMethod||AT_BLANK).sort().map(v=>[v,blankLabel(v)]) },
    { key:'methodUsed', label:'Method Used', values:t=>withBlank(t.methodUsed||[]),
      options:tasks=>distinct(tasks,t=>withBlank(t.methodUsed||[])).sort().map(v=>[v,blankLabel(v)]) },
    { key:'tags', label:'Tags', values:t=>withBlank(t.tags||[]),
      options:tasks=>distinct(tasks,t=>withBlank(t.tags||[])).sort().map(v=>[v,blankLabel(v)]) },
  ];
  (state.customFields||[]).forEach(f=>{
    const get = t=>{ const v = t.custom && t.custom[f.id]; return (v===undefined||v===null||String(v).trim()==='') ? AT_BLANK : String(v); };
    fields.push({ key:'cf:'+f.id, label:f.name, custom:true, values:t=>[get(t)],
      options:tasks=>distinct(tasks,get).sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true})).map(v=>[v,blankLabel(v)]) });
  });
  return fields;
}

function filteredAllTasks(){
  let tasks = allTasksFlat();
  const f = state.allTasksFilters;
  const multi = f.multi || {};
  atFilterFields().forEach(field=>{
    const sel = multi[field.key];
    if(sel && sel.length){ const set = new Set(sel); tasks = tasks.filter(t=>field.values(t).some(v=>set.has(v))); }
  });
  if(f.from) tasks = tasks.filter(t=>t.dueDate && t.dueDate>=f.from);
  if(f.to) tasks = tasks.filter(t=>t.dueDate && t.dueDate<=f.to);
  if(f.q){
    const q = f.q.toLowerCase();
    tasks = tasks.filter(t=>[t.comments, atClientName(t.clientId), t.taskType, (t.tags||[]).join(' '), t.primaryMethod, ...Object.values(t.custom||{})]
      .some(v=>String(v||'').toLowerCase().includes(q)));
  }
  const allSort = state.allTasksSort || {key:'dueDate', dir:'asc'};
  const byDue = compareTasksBy('dueDate','asc');
  const bySel = compareTasksBy(allSort.key, allSort.dir);
  return tasks.sort((a,b)=>bySel(a,b) || byDue(a,b));
}

// Columns — every field shown by default; each person can hide/reorder (saved in this browser).
function atColumnDefs(){
  const txt = v => `<td>${escapeHtml(v===''||v===undefined||v===null ? '—' : String(v))}</td>`;
  const defs = [
    { key:'client', label:'Client', cell:t=>txt(atClientName(t.clientId)) },
    { key:'taskType', label:'Task Type', cell:t=>`<td>${escapeHtml(t.taskType)}${t.autoSplitGroup?' <span class="chip tag-chip">split</span>':''}${t.pinned?' 📌':''}</td>` },
    { key:'stylist', label:'Stylist', cell:t=>txt(t.assignedStylist ? stylistName(t.assignedStylist) : 'Unassigned') },
    { key:'dueDate', label:'Due Date', cell:t=>txt(t.dueDate) },
    { key:'day', label:'Day', cell:t=>txt(t.dayOfWeek) },
    { key:'status', label:'Status', cell:t=>`<td><span class="status-pill status-${String(t.status).replace(/ /g,'\\ ')}">${escapeHtml(t.status)}</span></td>` },
    { key:'startingTarget', label:'Starting Target', cell:t=>txt(t.startingTarget) },
    { key:'remaining', label:'Remaining', cell:t=>txt(t.remaining) },
    { key:'totalCompleted', label:'Total Completed', cell:t=>txt(t.totalCompleted) },
    { key:'rate', label:'Rate', cell:t=>txt(t.rate) },
    { key:'estimatedHours', label:'Est. Hrs', cell:t=>`<td>${formatHoursAsTime(t.estimatedHours)}</td>` },
    { key:'actualTimeSpent', label:'Actual', cell:t=>txt(t.actualTimeSpent) },
    { key:'primaryMethod', label:'Primary Method', cell:t=>txt(t.primaryMethod) },
    { key:'methodUsed', label:'Method Used', cell:t=>txt((t.methodUsed||[]).join(', ')) },
    { key:'opsLead', label:'Ops Lead', cell:t=>txt(t.opsLead ? opsLeadName(t.opsLead) : '') },
    { key:'tags', label:'Tags', cell:t=>`<td>${(t.tags||[]).length ? t.tags.map(g=>`<span class="chip tag-chip">${escapeHtml(g)}</span>`).join('') : '—'}</td>` },
    { key:'comments', label:'Comments', cell:t=>`<td><span class="comment-preview">${escapeHtml(t.comments||'—')}</span></td>` },
  ];
  (state.customFields||[]).forEach(f=>defs.push({ key:'cf:'+f.id, label:f.name, custom:true,
    cell:t=>txt(t.custom && t.custom[f.id]!==undefined ? t.custom[f.id] : '') }));
  return defs;
}
const AT_COLS_KEY = 'studio_ops_alltasks_columns';
function atGetLayout(){
  const defs = atColumnDefs();
  let saved = null; try{ saved = JSON.parse(localStorage.getItem(AT_COLS_KEY)||'null'); }catch(e){}
  const layout = Array.isArray(saved) ? saved.filter(c=>defs.some(d=>d.key===c.key)) : [];
  defs.forEach(d=>{ if(!layout.some(c=>c.key===d.key)) layout.push({key:d.key, visible:true}); }); // new fields show by default
  return layout;
}
function atSetLayout(l){ try{ localStorage.setItem(AT_COLS_KEY, JSON.stringify(l)); }catch(e){} }
function atVisibleCols(){ const defs = atColumnDefs(); return atGetLayout().filter(c=>c.visible).map(c=>defs.find(d=>d.key===c.key)).filter(Boolean); }

// Group by
function atGroupOptions(){
  const opts = [['','No grouping'],['client','Client'],['taskType','Task Type'],['stylist','Stylist'],['status','Status'],['dueDate','Due Date'],
    ['week','Week'],['month','Month'],['opsLead','Ops Lead'],['primaryMethod','Primary Method'],['dayOfWeek','Day']];
  (state.customFields||[]).forEach(f=>opts.push(['cf:'+f.id, f.name]));
  return opts;
}
function atGroupOf(key, t){
  switch(key){
    case 'client': return [atClientName(t.clientId), atClientName(t.clientId)];
    case 'taskType': return [t.taskType, t.taskType];
    case 'stylist': return t.assignedStylist ? [stylistName(t.assignedStylist), stylistName(t.assignedStylist)] : ['~','⚠ Unassigned'];
    case 'status': return [String(STATUS_OPTIONS.indexOf(t.status)).padStart(2,'0'), t.status];
    case 'dueDate': return t.dueDate ? [t.dueDate, `${t.dueDate} (${t.dayOfWeek||''})`] : ['~','No date'];
    case 'week': { if(!t.dueDate) return ['~','No date']; const w = fmtDate(startOfWeek(parseDate(t.dueDate))); return [w, `Week of ${w}`]; }
    case 'month': return t.dueDate ? [t.dueDate.slice(0,7), monthLabel(t.dueDate.slice(0,7))] : ['~','No date'];
    case 'opsLead': return t.opsLead ? [opsLeadName(t.opsLead), opsLeadName(t.opsLead)] : ['~','(no ops lead)'];
    case 'primaryMethod': return t.primaryMethod ? [t.primaryMethod, t.primaryMethod] : ['~','(no primary method)'];
    case 'dayOfWeek': { const i = t.dueDate ? (parseDate(t.dueDate).getDay()+6)%7 : 9; return [String(i), t.dayOfWeek||'No date']; }
    default: if(key.startsWith('cf:')){ const v = t.custom && t.custom[key.slice(3)]; return (v===undefined||v===null||String(v).trim()==='') ? ['~','(blank)'] : [String(v), String(v)]; }
  }
  return ['',''];
}

function atFilterBarHtml(){
  const f = state.allTasksFilters, multi = f.multi || {};
  const pool = allTasksFlat();
  const fields = atFilterFields();
  const shown = fields; // every field, custom fields included
  const chip = fl=>{
    const sel = multi[fl.key] || [];
    const open = state.atOpenFilter===fl.key;
    const opts = fl.options(pool);
    const labelFor = v => (opts.find(o=>o[0]===v)||[v, v===AT_BLANK?'(blank)':v])[1];
    const summary = !sel.length ? 'All' : sel.length===1 ? labelFor(sel[0]) : `${sel.length} selected`;
    let pop = '';
    if(open){
      const q = (state.atFilterSearch||'').toLowerCase();
      const list = opts.filter(o=>!q || String(o[1]).toLowerCase().includes(q));
      pop = `<div class="at-pop" data-stop="1">
        <input type="text" class="at-pop-search" data-at-filter-search="${fl.key}" value="${escapeHtml(state.atFilterSearch||'')}" placeholder="Search ${escapeHtml(fl.label.toLowerCase())}…">
        <div class="at-pop-actions"><button class="btn ghost small" data-at-filter-all="${fl.key}">Select shown</button><button class="btn ghost small" data-at-filter-none="${fl.key}">Clear</button></div>
        <div class="at-pop-list">${list.length ? list.map(([v,l])=>`<label class="at-opt"><input type="checkbox" data-at-filter-opt="${escapeHtml(fl.key)}" value="${escapeHtml(String(v))}" ${sel.includes(v)?'checked':''}> <span>${escapeHtml(String(l))}</span></label>`).join('') : '<div class="hint">No matches.</div>'}</div>
      </div>`;
    }
    return `<div class="at-filter ${sel.length?'active':''}">
      <button class="at-filter-btn" data-at-filter-open="${escapeHtml(fl.key)}"><span class="at-filter-label">${escapeHtml(fl.label)}</span> ${escapeHtml(String(summary))} ▾</button>${pop}</div>`;
  };
  const customCount = fields.filter(x=>x.custom).length;
  return `<div class="card" style="padding:14px 16px;margin-bottom:12px;">
    <div class="at-filters">
      ${shown.map(chip).join('')}
    </div>
    <div class="filters-row" style="margin-top:12px;">
      <div class="field"><span class="field-label">From</span><input type="date" data-filter="from" value="${f.from||''}"></div>
      <div class="field"><span class="field-label">To</span><input type="date" data-filter="to" value="${f.to||''}"></div>
      <div class="field" style="flex:1;min-width:180px;"><span class="field-label">Search</span><input type="text" data-filter="q" value="${escapeHtml(f.q||'')}" placeholder="Comments, client, tags, custom fields…"></div>
      <div class="field"><span class="field-label">Group by</span><select data-at-groupby>${atGroupOptions().map(([k,l])=>`<option value="${k}" ${(state.atGroupBy||'')===k?'selected':''}>${escapeHtml(l)}</option>`).join('')}</select></div>
      <button class="btn secondary small" data-action="at-customize-toggle">Columns</button>
      <button class="btn secondary small" data-action="clear-filters">Clear all</button>
    </div>
  </div>`;
}

function atColumnsPanelHtml(){
  if(!state.atCustomizeOpen) return '';
  const defs = atColumnDefs(), layout = atGetLayout();
  return `<div class="card" style="padding:16px 18px;margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;">
      <div><h3 style="font-size:16px;">Columns</h3><div class="view-sub">Tick to show or hide, arrows to reorder. Saved for you on this browser. Add custom fields from My Dashboard → Customize columns.</div></div>
      <div style="display:flex;gap:8px;"><button class="btn secondary small" data-action="at-cols-showall">Show all</button><button class="btn secondary small" data-action="at-cols-reset">Reset</button><button class="btn small" data-action="at-customize-toggle">Done</button></div>
    </div>
    <div class="at-cols-grid">${layout.map((c,i)=>{ const d = defs.find(x=>x.key===c.key); return `<div class="dash-col-row">
      <label style="display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;"><input type="checkbox" data-at-col-toggle="${c.key}" ${c.visible?'checked':''}> ${escapeHtml(d.label)}${d.custom?' <span class="hint" style="margin:0;">custom</span>':''}</label>
      <button class="btn secondary small" data-at-col-move="${c.key}|-1" ${i===0?'disabled':''}>↑</button><button class="btn secondary small" data-at-col-move="${c.key}|1" ${i===layout.length-1?'disabled':''}>↓</button></div>`; }).join('')}</div>
  </div>`;
}

function atTableHtml(tasks, cols, sortTh){
  const allChecked = tasks.length>0 && tasks.every(t=>state.selectedTaskIds.has(t.id));
  return `<table class="at-table"><thead><tr><th style="width:34px;"><input type="checkbox" data-select-all-page="1" ${allChecked?'checked':''}></th>${cols.map(c=>sortTh(c.key,c.label)).join('')}</tr></thead>
    <tbody>${tasks.map(t=>`<tr class="taskrow" data-edit-task="${t.id}" data-edit-client="${t.clientId}"><td style="width:34px;" data-stop="1"><input type="checkbox" data-select-row="${t.id}" ${state.selectedTaskIds.has(t.id)?'checked':''}></td>${cols.map(c=>c.cell(t)).join('')}</tr>`).join('')
      || `<tr><td colspan="${cols.length+1}" class="empty">No tasks match these filters.</td></tr>`}</tbody></table>`;
}

async function renderAllTasks(){
  await ensureAllTasksLoaded();
  if(!state.allTasksFilters || !state.allTasksFilters.multi) state.allTasksFilters = allTasksBlankFilters();
  const tasks = filteredAllTasks();
  const allSort = state.allTasksSort || {key:'dueDate', dir:'asc'};
  const sortTh = (key,label)=>`<th class="sortable" data-all-sort="${key}" title="Sort by ${escapeHtml(label)}">${escapeHtml(label)}${allSort.key===key?(allSort.dir==='desc'?' ▼':' ▲'):''}</th>`;
  const cols = atVisibleCols();
  const selCount = state.selectedTaskIds.size;
  const groupBy = state.atGroupBy || '';

  let body = '';
  if(!groupBy){
    const pageSize = 50;
    const totalPages = Math.max(1, Math.ceil(tasks.length/pageSize));
    if(state.allTasksPage>totalPages) state.allTasksPage = totalPages;
    const pageTasks = tasks.slice((state.allTasksPage-1)*pageSize, state.allTasksPage*pageSize);
    body = `<div class="card" style="overflow-x:auto;">${atTableHtml(pageTasks, cols, sortTh)}</div>
      <div class="pagination">
        <button data-action="page-prev" ${state.allTasksPage<=1?'disabled':''}>Prev</button>
        <span>Page ${state.allTasksPage} of ${totalPages}</span>
        <button data-action="page-next" ${state.allTasksPage>=totalPages?'disabled':''}>Next</button>
      </div>`;
  } else {
    const groups = new Map();
    tasks.forEach(t=>{ const [k,l] = atGroupOf(groupBy, t); if(!groups.has(k)) groups.set(k,{label:l, tasks:[]}); groups.get(k).tasks.push(t); });
    const keys = [...groups.keys()].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'}));
    const openSet = state.atGroupOpen || (state.atGroupOpen = {});
    const defaultOpen = tasks.length <= 300;
    body = keys.length ? keys.map(k=>{
      const g = groups.get(k), gid = groupBy+'::'+k;
      const isOpen = openSet[gid]!==undefined ? openSet[gid] : defaultOpen;
      const hrs = round2(g.tasks.reduce((s,t)=>s+(parseFloat(t.estimatedHours)||0),0));
      const done = g.tasks.filter(t=>t.status==='Done').length;
      const limit = state.atGroupShowAll && state.atGroupShowAll[gid] ? Infinity : 200;
      return `<div class="card at-group">
        <button class="at-group-head" data-at-group-toggle="${escapeHtml(gid)}">
          <span class="at-caret">${isOpen?'▾':'▸'}</span><strong>${escapeHtml(g.label)}</strong>
          <span class="at-group-meta">${g.tasks.length} task${g.tasks.length===1?'':'s'} · ${formatHoursAsTime(hrs)||'0h'} est · ${done} done</span>
        </button>
        ${isOpen ? `<div style="overflow-x:auto;">${atTableHtml(g.tasks.slice(0,limit), cols, sortTh)}</div>
          ${g.tasks.length>limit?`<div style="padding:8px 12px;"><button class="btn secondary small" data-at-group-more="${escapeHtml(gid)}">Show all ${g.tasks.length}</button></div>`:''}` : ''}
      </div>`;
    }).join('') : `<div class="card"><div class="empty">No tasks match these filters.</div></div>`;
    body = `<div style="display:flex;gap:8px;margin-bottom:10px;"><button class="btn secondary small" data-action="at-groups-expand">Expand all</button><button class="btn secondary small" data-action="at-groups-collapse">Collapse all</button><span class="hint" style="align-self:center;">${keys.length} group${keys.length===1?'':'s'}</span></div>${body}`;
  }

  return `
    <div class="view-header">
      <div>
        <div class="view-title">All Tasks</div>
        <div class="view-sub">${tasks.length} tasks match current filters. Pick several values in any filter, click a column header to sort, and group by any field.</div>
      </div>
      <div style="display:flex;gap:8px;"><button class="btn secondary" data-action="export-alltasks">⤓ Export to Excel</button><button class="btn" data-action="open-add-task">+ Add Task</button></div>
    </div>
    ${atFilterBarHtml()}
    ${atColumnsPanelHtml()}
    ${selCount>0 ? `<div class="card" style="padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;background:var(--plum-dim);border-color:var(--plum-light);">
      <strong style="font-size:12.5px;">${selCount} task${selCount>1?'s':''} selected</strong>
      <button class="btn small" data-action="open-bulk-edit">Bulk Edit…</button>
      <button class="btn secondary small" data-action="clear-selection">Clear selection</button>
    </div>` : ''}
    ${body}
  `;
}

function attachAllTasksHandlers(root){
  const multi = ()=> (state.allTasksFilters.multi = state.allTasksFilters.multi || {});
  root.querySelectorAll('[data-at-filter-open]').forEach(b=>b.onclick = e=>{
    e.stopPropagation();
    const k = b.dataset.atFilterOpen;
    state.atOpenFilter = state.atOpenFilter===k ? null : k; state.atFilterSearch = ''; render();
  });
  root.querySelectorAll('[data-at-filter-opt]').forEach(cb=>cb.onchange = ()=>{
    const k = cb.dataset.atFilterOpt, m = multi(); const cur = new Set(m[k]||[]);
    if(cb.checked) cur.add(cb.value); else cur.delete(cb.value);
    m[k] = [...cur]; state.allTasksPage = 1; render();
  });
  root.querySelectorAll('[data-at-filter-all]').forEach(b=>b.onclick = ()=>{
    const k = b.dataset.atFilterAll, m = multi(); const cur = new Set(m[k]||[]);
    root.querySelectorAll(`[data-at-filter-opt="${CSS.escape(k)}"]`).forEach(cb=>cur.add(cb.value));
    m[k] = [...cur]; state.allTasksPage = 1; render();
  });
  root.querySelectorAll('[data-at-filter-none]').forEach(b=>b.onclick = ()=>{ multi()[b.dataset.atFilterNone] = []; state.allTasksPage = 1; render(); });
  const search = root.querySelector('[data-at-filter-search]');
  if(search){
    search.focus(); search.setSelectionRange(search.value.length, search.value.length);
    search.oninput = debounce(()=>{ state.atFilterSearch = search.value; render(); }, 200);
  }
  if(!window.__atOutsideClick){
    window.__atOutsideClick = true;
    document.addEventListener('click', e=>{
      if(state.view==='all' && state.atOpenFilter && !e.target.closest('.at-filter')){ state.atOpenFilter = null; render(); }
    });
  }
  const tgl = root.querySelector('[data-action="at-toggle-custom-filters"]'); if(tgl) tgl.onclick = ()=>{ state.atShowCustomFilters = !state.atShowCustomFilters; render(); };
  const gb = root.querySelector('[data-at-groupby]'); if(gb) gb.onchange = ()=>{
    state.atGroupBy = gb.value; state.allTasksPage = 1;
    try{ localStorage.setItem('studio_ops_alltasks_groupby', gb.value); }catch(e){}
    render();
  };
  root.querySelectorAll('[data-at-group-toggle]').forEach(b=>b.onclick = ()=>{
    const gid = b.dataset.atGroupToggle; state.atGroupOpen = state.atGroupOpen || {};
    const cur = state.atGroupOpen[gid]!==undefined ? state.atGroupOpen[gid] : (filteredAllTasks().length<=300);
    state.atGroupOpen[gid] = !cur; render();
  });
  root.querySelectorAll('[data-at-group-more]').forEach(b=>b.onclick = ()=>{ state.atGroupShowAll = state.atGroupShowAll || {}; state.atGroupShowAll[b.dataset.atGroupMore] = true; render(); });
  const gx = root.querySelector('[data-action="at-groups-expand"]'); if(gx) gx.onclick = ()=>{ state.atGroupOpen = {}; root.querySelectorAll('[data-at-group-toggle]').forEach(b=>state.atGroupOpen[b.dataset.atGroupToggle]=true); render(); };
  const gc = root.querySelector('[data-action="at-groups-collapse"]'); if(gc) gc.onclick = ()=>{ state.atGroupOpen = {}; root.querySelectorAll('[data-at-group-toggle]').forEach(b=>state.atGroupOpen[b.dataset.atGroupToggle]=false); render(); };
  root.querySelectorAll('[data-action="at-customize-toggle"]').forEach(b=>b.onclick = ()=>{ state.atCustomizeOpen = !state.atCustomizeOpen; render(); });
  root.querySelectorAll('[data-at-col-toggle]').forEach(cb=>cb.onchange = ()=>{ const l = atGetLayout(); const c = l.find(x=>x.key===cb.dataset.atColToggle); if(c) c.visible = cb.checked; atSetLayout(l); render(); });
  root.querySelectorAll('[data-at-col-move]').forEach(b=>b.onclick = ()=>{ const [k,d] = b.dataset.atColMove.split('|'); const l = atGetLayout(); const i = l.findIndex(x=>x.key===k), j = i+parseInt(d); if(i<0||j<0||j>=l.length) return; [l[i],l[j]] = [l[j],l[i]]; atSetLayout(l); render(); });
  const showAll = root.querySelector('[data-action="at-cols-showall"]'); if(showAll) showAll.onclick = ()=>{ const l = atGetLayout(); l.forEach(c=>c.visible=true); atSetLayout(l); render(); };
  const rst = root.querySelector('[data-action="at-cols-reset"]'); if(rst) rst.onclick = ()=>{ try{ localStorage.removeItem(AT_COLS_KEY); }catch(e){} render(); };
}

/* ============================= REPORTS VIEW ============================= */
function monthLabel(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return `${MONTH_NAMES[m-1]} ${y}`;
}

async function reportSectionForType(taskType, monthKey){
  const cutoff = archiveCutoffDate(); // 'YYYY-MM-01'
  const isArchived = monthKey < cutoff.slice(0,7);
  let sourceTasks;
  if(isArchived){
    await ensureArchiveLoaded();
    sourceTasks = archiveTasksFlat();
  } else {
    sourceTasks = allTasksFlat();
  }
  const tasks = sourceTasks.filter(t=>t.taskType===taskType && t.dueDate && t.dueDate.slice(0,7)===monthKey);
  const byClient = {};
  tasks.forEach(t=>{
    const cid = t.clientId;
    if(cid===INTERNAL_ID) return; // goals are per real client only
    if(!byClient[cid]) byClient[cid] = { startingTarget:0, remaining:0, completed:0, taskCount:0 };
    byClient[cid].startingTarget += parseFloat(t.startingTarget)||0;
    byClient[cid].remaining += parseFloat(t.remaining)||0;
    byClient[cid].completed += parseFloat(t.totalCompleted)||0;
    byClient[cid].taskCount += 1;
  });

  const goalsForMonth = (state.monthlyGoals[monthKey] && state.monthlyGoals[monthKey][taskType]) || {};

  // list every real client, not just ones with tasks this month, so goals can be set ahead of time
  const rows = state.clients.map(c=>{
    const agg = byClient[c.id] || { startingTarget:0, remaining:0, completed:0, taskCount:0 };
    const goal = goalsForMonth[c.id] !== undefined ? goalsForMonth[c.id] : '';
    return { clientId:c.id, name:c.name, opsLead:c.opsLead||'', goal, ...agg };
  }).sort((a,b)=>a.name.localeCompare(b.name));

  const totalStartingTarget = rows.reduce((s,r)=>s+r.startingTarget,0);
  const totalRemaining = rows.reduce((s,r)=>s+r.remaining,0);
  const totalCompleted = rows.reduce((s,r)=>s+r.completed,0);
  const totalGoal = rows.reduce((s,r)=>s+(parseFloat(r.goal)||0),0);
  return { rows, totalStartingTarget, totalRemaining, totalCompleted, totalGoal, isArchived };
}

function anDefaults(){
  const now = new Date();
  return { from: fmtDate(new Date(now.getFullYear(), now.getMonth(), 1)), to: fmtDate(new Date(now.getFullYear(), now.getMonth()+1, 0)), opsLead:'', types:['Styling','STM'] };
}
function anBarRows(rows, valueKey, fmt){
  const max = Math.max(0, ...rows.map(r=>r[valueKey]));
  return rows.map(r=>{ const pct = max>0 ? (r[valueKey]/max)*100 : 0;
    return `<div class="an-bar" title="${escapeHtml(r.label)}: ${escapeHtml(fmt(r[valueKey]))}"><div class="an-bar-fill" style="width:${pct}%"></div></div>`; });
}
async function anData(){
  const a = state.an || (state.an = anDefaults());
  await ensureAllTasksLoaded();
  let pool = allTasksFlat();
  if(a.from && a.from < archiveCutoffDate()){ await ensureArchiveLoaded(); pool = pool.concat(archiveTasksFlat()); }
  const inRange = pool.filter(t=>t.dueDate && (!a.from || t.dueDate>=a.from) && (!a.to || t.dueDate<=a.to));
  const clientOk = cid => !a.opsLead || ((state.clients.find(c=>c.id===cid)||{}).opsLead===a.opsLead);
  const tasks = inRange.filter(t=>t.clientId===INTERNAL_ID ? !a.opsLead : clientOk(t.clientId));
  const agg = (keyFn, labelFn) => {
    const m = new Map();
    tasks.forEach(t=>{ const k = keyFn(t); if(!m.has(k)) m.set(k,{key:k, label:labelFn(t), actual:0, est:0, count:0, logged:0});
      const r = m.get(k); const act = parseFloat(t.actualTimeSpent); if(!isNaN(act)){ r.actual += act; r.logged++; } r.est += parseFloat(t.estimatedHours)||0; r.count++; });
    return [...m.values()].map(r=>({...r, actual:round2(r.actual), est:round2(r.est)})).sort((x,y)=>y.actual-x.actual || y.est-x.est || x.label.localeCompare(y.label));
  };
  const byType = agg(t=>t.taskType, t=>t.taskType);
  const byClient = agg(t=>t.clientId, t=>atClientName(t.clientId));

  // Goals: every monthly goal (Styling / STM) whose month overlaps the range
  const months = [];
  if(a.from && a.to){ let d = new Date(parseDate(a.from).getFullYear(), parseDate(a.from).getMonth(), 1); const end = parseDate(a.to); while(d<=end){ months.push(fmtDate(d).slice(0,7)); d = new Date(d.getFullYear(), d.getMonth()+1, 1); } }
  const goalRows = new Map();
  months.forEach(mk=>(a.types||[]).forEach(tt=>{
    const goals = (state.monthlyGoals[mk]||{})[tt] || {};
    Object.keys(goals).forEach(cid=>{
      const g = parseFloat(goals[cid]); if(!(g>0) || !state.clients.some(c=>c.id===cid) || !clientOk(cid)) return;
      const done = pool.filter(t=>t.clientId===cid && t.taskType===tt && t.dueDate && t.dueDate.slice(0,7)===mk).reduce((s,t)=>s+(parseFloat(t.totalCompleted)||0),0);
      if(!goalRows.has(cid)) goalRows.set(cid,{clientId:cid, label:atClientName(cid), goal:0, done:0, goalsSet:0, goalsMissed:0, detail:[]});
      const r = goalRows.get(cid); r.goal += g; r.done += done; r.goalsSet++; if(done < g) r.goalsMissed++;
      r.detail.push(`${monthLabel(mk)} ${tt}: ${round2(done)} / ${round2(g)}`);
    });
  }));
  const goals = [...goalRows.values()].map(r=>({...r, goal:round2(r.goal), done:round2(r.done),
    remaining: round2(Math.max(0, r.goal-r.done)), pctIncomplete: r.goal>0 ? round2(Math.max(0, (r.goal-r.done)/r.goal)*100) : 0 }))
    .sort((x,y)=>y.pctIncomplete-x.pctIncomplete || x.label.localeCompare(y.label));
  return { a, tasks, byType, byClient, goals, months };
}

/* ============================= TRAINING & AUTO-ASSIGN ============================= */
function dateRangeArray(fromStr, toStr){
  const out = [];
  let d = parseDate(fromStr), end = parseDate(toStr);
  while(d<=end){ out.push(fmtDate(d)); d = addDays(d,1); }
  return out;
}

function parseTrainingImport(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const allTypes = [...CORE_TYPES, ...state.additionalTypes];
  let added = 0;
  const skipped = [];
  lines.forEach(line=>{
    let parts;
    if(line.includes('\t')) parts = line.split('\t');
    else if(line.includes('|')) parts = line.split('|');
    else parts = line.split(',');
    parts = parts.map(p=>p.trim()).filter(p=>p!=='');
    if(parts.length<3){ skipped.push({line, reason:'Expected 3 values (stylist, client, task type)'}); return; }
    const [stylistPart, clientPart, typePart] = parts;
    const stylist = state.stylists.find(s=>s.name.toLowerCase()===stylistPart.toLowerCase());
    if(!stylist){ skipped.push({line, reason:`No stylist named "${stylistPart}"`}); return; }
    const client = state.clients.find(c=>c.name.toLowerCase()===clientPart.toLowerCase());
    if(!client){ skipped.push({line, reason:`No client named "${clientPart}"`}); return; }
    const type = allTypes.find(t=>t.toLowerCase()===typePart.toLowerCase());
    if(!type){ skipped.push({line, reason:`No task type named "${typePart}"`}); return; }
    if(isTrained(stylist.id, client.id, type)){ skipped.push({line, reason:'Already in the training matrix'}); return; }
    state.trainingMatrix.push({id:uid(), stylistId:stylist.id, clientId:client.id, taskType:type});
    added++;
  });
  return { added, skipped };
}

function cloneTaskForSplit(original, overrides){
  const clone = Object.assign({}, original, {
    id: uid(), status:'Not Started', comments:'', actualTimeSpent:'',
  }, overrides);
  return clone;
}

// Splits one day's task across multiple trained, available stylists, proportional
// to each one's remaining capacity that day, so nobody gets a share bigger than
// their room allows. Only splits when at least 2 trained stylists have capacity
// left; otherwise leaves the task for normal single-assignment handling.
function splitTaskAcrossStylists(clientId, task, options, loadMap, splitsCreated){
  const hrs = parseFloat(task.estimatedHours)||0;
  const target = parseFloat(task.startingTarget);
  const hasTarget = !isNaN(target);

  const withRoom = options
    .map(s=>{ const key=s.id+'|'+task.dueDate; return { s, remaining: s.capacity-(loadMap[key]||0) }; })
    .filter(o=>o.remaining>0)
    .sort((a,b)=>b.remaining-a.remaining);

  if(withRoom.length<2) return false; // not enough people with room to split across

  // pull in just enough of the top-capacity people to (ideally) cover the hours
  const chosen = [];
  let cumulative = 0;
  for(const o of withRoom){
    chosen.push(o);
    cumulative += o.remaining;
    if(chosen.length>=2 && cumulative>=hrs) break;
  }
  if(chosen.length<2) return false;

  const totalRemaining = chosen.reduce((s,o)=>s+o.remaining,0);
  const groupId = task.autoSplitGroup || task.id;

  let hrsLeft = hrs, targetLeft = hasTarget ? target : 0;
  const pieces = chosen.map((o,idx)=>{
    const isLast = idx===chosen.length-1;
    const ratio = o.remaining/totalRemaining;
    const pieceHrs = isLast ? round2(hrsLeft) : round2(hrs*ratio);
    const pieceTarget = hasTarget ? (isLast ? round2(targetLeft) : round2(target*ratio)) : '';
    hrsLeft = round2(hrsLeft-pieceHrs);
    targetLeft = hasTarget ? round2(targetLeft-pieceTarget) : 0;
    return { stylist:o.s, hrs:pieceHrs, target:pieceTarget };
  });

  // first piece reuses the original task; the rest are new sibling tasks
  task.autoSplitGroup = groupId;
  task.assignedStylist = pieces[0].stylist.id;
  task.estimatedHours = pieces[0].hrs;
  if(hasTarget) task.startingTarget = pieces[0].target;
  loadMap[pieces[0].stylist.id+'|'+task.dueDate] = (loadMap[pieces[0].stylist.id+'|'+task.dueDate]||0) + pieces[0].hrs;

  const newTasks = [];
  for(let i=1;i<pieces.length;i++){
    const p = pieces[i];
    const clone = cloneTaskForSplit(task, {
      autoSplitGroup: groupId,
      assignedStylist: p.stylist.id,
      estimatedHours: p.hrs,
      startingTarget: hasTarget ? p.target : task.startingTarget,
    });
    newTasks.push(clone);
    const key = p.stylist.id+'|'+task.dueDate;
    loadMap[key] = (loadMap[key]||0) + p.hrs;
  }
  state.taskCache[clientId].push(...newTasks);
  splitsCreated.push({ client:(state.clients.find(c=>c.id===clientId)||{}).name||'—', taskType:task.taskType, date:task.dueDate, pieces:pieces.length, stylists:pieces.map(p=>p.stylist.name) });
  return true;
}

async function runAutoAssign(fromStr, toStr){
  await ensureAllTasksLoaded();
  const inRange = allTasksFlat().filter(t=>t.dueDate && t.dueDate>=fromStr && t.dueDate<=toStr);
  // pinned tasks (moved by hand on the Workload board) keep their stylist and count as fixed load
  const isPinned = t=>t.pinned && t.assignedStylist;
  const fixedTasks = inRange.filter(t=>t.clientId===INTERNAL_ID || isPinned(t));
  const weekendSkipped = inRange.filter(t=>t.clientId!==INTERNAL_ID && !isPinned(t) && (t.dayOfWeek==='Sat' || t.dayOfWeek==='Sun'));
  const candidateTasks = inRange.filter(t=>t.clientId!==INTERNAL_ID && !isPinned(t) && t.dayOfWeek!=='Sat' && t.dayOfWeek!=='Sun');

  const loadMap = {}; // 'stylistId|date' -> hours
  fixedTasks.forEach(t=>{
    if(!t.assignedStylist) return;
    const key = t.assignedStylist+'|'+t.dueDate;
    loadMap[key] = (loadMap[key]||0) + (parseFloat(t.estimatedHours)||0);
  });

  const eligible = [];
  const unassignable = [];
  candidateTasks.forEach(t=>{
    const opts = eligibleStylistsFor(t.clientId, t.taskType);
    if(opts.length===0){
      unassignable.push(t);
      // keep existing assignment's hours as fixed load since we won't touch it
      if(t.assignedStylist){
        const key = t.assignedStylist+'|'+t.dueDate;
        loadMap[key] = (loadMap[key]||0) + (parseFloat(t.estimatedHours)||0);
      }
    } else {
      eligible.push({ task:t, options:opts });
    }
  });

  eligible.sort((a,b)=>{
    if(a.options.length !== b.options.length) return a.options.length - b.options.length;
    if(a.task.dueDate !== b.task.dueDate) return a.task.dueDate.localeCompare(b.task.dueDate);
    return (parseFloat(b.task.estimatedHours)||0) - (parseFloat(a.task.estimatedHours)||0);
  });

  let assignedCount=0, reassignedCount=0, unchangedCount=0;
  const overCapacity = [];
  const touchedClients = new Set();
  const splitsCreated = [];
  const couldNotSplit = [];
  const cap = parseFloat(state.autoSplitThresholdHours)||0;

  for(const {task, options} of eligible){
    touchedClients.add(task.clientId);
    const hrs = parseFloat(task.estimatedHours)||0;

    if(cap>0 && hrs>cap){
      const split = splitTaskAcrossStylists(task.clientId, task, options, loadMap, splitsCreated);
      if(split){
        assignedCount++; // the reshaped task + its new siblings count as newly assigned this run
        continue;
      }
      couldNotSplit.push({ client:(state.clients.find(c=>c.id===task.clientId)||{}).name||'—', taskType:task.taskType, date:task.dueDate, hours:hrs });
      // fall through to normal single-assignment below
    }

    let best = null, bestRemaining = -Infinity;
    options.forEach(s=>{
      const key = s.id+'|'+task.dueDate;
      const used = loadMap[key]||0;
      const remaining = s.capacity - used;
      if(remaining > bestRemaining){ bestRemaining = remaining; best = s; }
    });
    const key = best.id+'|'+task.dueDate;
    loadMap[key] = (loadMap[key]||0) + hrs;
    if(bestRemaining < hrs){ overCapacity.push({task, stylist:best}); }

    const prevStylist = task.assignedStylist;
    task.assignedStylist = best.id;
    if(!prevStylist) assignedCount++;
    else if(prevStylist!==best.id) reassignedCount++;
    else unchangedCount++;
  }

  for(const cid of touchedClients){ await saveClientTasks(cid); }

  return {
    totalConsidered: candidateTasks.length,
    assignedCount, reassignedCount, unchangedCount,
    weekendSkipped: weekendSkipped.length,
    splitsCreated,
    couldNotSplit,
    unassignable: unassignable.map(t=>({ client:(state.clients.find(c=>c.id===t.clientId)||{}).name||'—', taskType:t.taskType, date:t.dueDate })),
    overCapacity: overCapacity.map(o=>({ client:(state.clients.find(c=>c.id===o.task.clientId)||{}).name||'—', taskType:o.task.taskType, date:o.task.dueDate, stylist:o.stylist.name })),
  };
}

async function runRecommendation(fromStr, toStr){
  await ensureAllTasksLoaded();
  const days = dateRangeArray(fromStr, toStr);
  const inRange = allTasksFlat().filter(t=>t.dueDate && t.dueDate>=fromStr && t.dueDate<=toStr);

  // total committed hours per stylist across ALL their tasks in range (any client/type)
  const committedByStylist = {};
  inRange.forEach(t=>{
    if(!t.assignedStylist) return;
    committedByStylist[t.assignedStylist] = (committedByStylist[t.assignedStylist]||0) + (parseFloat(t.estimatedHours)||0);
  });
  const spareByStylist = {};
  state.stylists.forEach(s=>{
    const totalCap = s.capacity * days.length;
    spareByStylist[s.id] = Math.max(0, totalCap - (committedByStylist[s.id]||0));
  });

  // demand per (client, taskType) combo, non-internal only
  const demand = {};
  inRange.forEach(t=>{
    if(t.clientId===INTERNAL_ID) return;
    const key = t.clientId+'|'+t.taskType;
    demand[key] = (demand[key]||0) + (parseFloat(t.estimatedHours)||0);
  });

  const rows = Object.keys(demand).map(key=>{
    const [clientId, taskType] = key.split('|');
    const trained = eligibleStylistsFor(clientId, taskType);
    const coverable = trained.reduce((s,st)=>s+spareByStylist[st.id], 0);
    const demandHours = demand[key];
    const gap = round2(demandHours - coverable);
    const untrainedWithSpare = state.stylists
      .filter(s=>!trained.some(t2=>t2.id===s.id) && spareByStylist[s.id]>0)
      .sort((a,b)=>spareByStylist[b.id]-spareByStylist[a.id])
      .slice(0,3)
      .map(s=>({ name:s.name, spare:round2(spareByStylist[s.id]) }));
    return {
      clientName:(state.clients.find(c=>c.id===clientId)||{}).name||'—',
      taskType, demandHours:round2(demandHours), coverable:round2(coverable), gap,
      suggestions:untrainedWithSpare,
    };
  }).filter(r=>r.gap>0).sort((a,b)=>b.gap-a.gap);

  return rows;
}

function percentile(sortedAsc, p){
  if(sortedAsc.length===0) return 0;
  const idx = Math.min(sortedAsc.length-1, Math.floor(p*(sortedAsc.length-1)));
  return sortedAsc[idx];
}

// For each client+task type, walks every weekday in the range and checks whether
// that day's total volume would need more trained-and-available stylists than the
// account currently has, in order to split it under the cap. The recommended
// headcount is based on the 80th percentile of shortfall across the whole trend —
// not the single worst day — so one outlier spike doesn't drive over-hiring.
async function runSplitCapacityRecommendation(fromStr, toStr){
  await ensureAllTasksLoaded();
  const cap = parseFloat(state.autoSplitThresholdHours)||0;
  const days = dateRangeArray(fromStr, toStr).filter(d=>{
    const dow = parseDate(d).getDay();
    return dow!==0 && dow!==6; // Auto-Assign never touches weekends, so they never need a split
  });
  const inRange = allTasksFlat().filter(t=>t.clientId!==INTERNAL_ID && t.dueDate && t.dueDate>=fromStr && t.dueDate<=toStr);

  // day-by-day total hours per (client, taskType) — summed across split pieces too,
  // so an already-split day still reflects its true original volume
  const hoursByKeyDate = {};
  inRange.forEach(t=>{
    const key = t.clientId+'|'+t.taskType;
    const byDate = (hoursByKeyDate[key] = hoursByKeyDate[key] || {});
    byDate[t.dueDate] = (byDate[t.dueDate]||0) + (parseFloat(t.estimatedHours)||0);
  });

  // spare capacity per stylist across the whole range, for candidate suggestions
  const committedByStylist = {};
  inRange.forEach(t=>{
    if(!t.assignedStylist) return;
    committedByStylist[t.assignedStylist] = (committedByStylist[t.assignedStylist]||0) + (parseFloat(t.estimatedHours)||0);
  });
  const spareByStylist = {};
  state.stylists.forEach(s=>{
    const totalCap = s.capacity * days.length;
    spareByStylist[s.id] = Math.max(0, totalCap - (committedByStylist[s.id]||0));
  });

  const rows = [];
  if(cap>0){
    Object.keys(hoursByKeyDate).forEach(key=>{
      const [clientId, taskType] = key.split('|');
      const trained = eligibleStylistsFor(clientId, taskType);
      const trainedCount = trained.length;
      const byDate = hoursByKeyDate[key];

      let daysNeedingSplit = 0;
      const shortfalls = [];
      days.forEach(d=>{
        const hrs = byDate[d]||0;
        if(hrs<=cap) return;
        daysNeedingSplit++;
        const required = Math.ceil(hrs/cap);
        const shortfall = Math.max(0, required-trainedCount);
        if(shortfall>0) shortfalls.push(shortfall);
      });
      if(shortfalls.length===0) return;

      shortfalls.sort((a,b)=>a-b);
      const recommended = Math.ceil(percentile(shortfalls, 0.8));
      const worst = shortfalls[shortfalls.length-1];

      const candidates = state.stylists
        .filter(s=>!trained.some(t2=>t2.id===s.id))
        .sort((a,b)=>spareByStylist[b.id]-spareByStylist[a.id])
        .slice(0, Math.max(recommended,1))
        .map(s=>({ name:s.name, spare:round2(spareByStylist[s.id]) }));

      rows.push({
        clientName:(state.clients.find(c=>c.id===clientId)||{}).name||'—',
        taskType, daysAnalyzed:days.length, daysNeedingSplit, daysShortStaffed:shortfalls.length,
        trainedCount, recommended, worst, candidates,
      });
    });
  }

  return rows.sort((a,b)=>b.recommended-a.recommended);
}

// Marks a stylist as fully booked (PTO) for every weekday in the range, then
// re-runs Auto-Assign across that same range. Auto-Assign already reassigns
// existing tasks to a better-fit trained stylist when one has more room — a
// PTO'd stylist shows 0 remaining capacity that day, so their other tasks
// naturally move to the next best trained, available person. No separate
// reassignment logic needed; this reuses the exact same machinery.
async function addPTO(stylistId, fromDate, toDate, isHalfDay){
  const stylist = state.stylists.find(s=>s.id===stylistId);
  if(!stylist) return null;

  await ensureClientTasksLoaded(INTERNAL_ID);
  const days = dateRangeArray(fromDate, toDate).filter(d=>{
    const dow = parseDate(d).getDay();
    return dow!==0 && dow!==6; // PTO only matters on days work would otherwise happen
  });
  const hours = isHalfDay ? round2(stylist.capacity/2) : stylist.capacity;

  let created = 0, updated = 0;
  days.forEach(date=>{
    const existing = state.taskCache[INTERNAL_ID].find(t=>t.taskType==='PTO' && t.assignedStylist===stylistId && t.dueDate===date);
    if(existing){
      // already has a PTO entry that day — update it in place rather than duplicate
      existing.estimatedHours = hours;
      existing.ptoHalfDay = !!isHalfDay;
      existing.comments = isHalfDay ? 'PTO (Half Day)' : 'PTO';
      updated++;
      return;
    }
    state.taskCache[INTERNAL_ID].push(makeTask({
      clientId: INTERNAL_ID, taskType:'PTO', assignedStylist:stylistId, dueDate:date,
      estimatedHours: hours, status:'Not Started', comments: isHalfDay ? 'PTO (Half Day)' : 'PTO',
      ptoHalfDay: !!isHalfDay,
    }));
    created++;
  });
  await saveClientTasks(INTERNAL_ID);

  const autoAssignResult = days.length>0 ? await runAutoAssign(days[0], days[days.length-1]) : null;
  return { stylistName: stylist.name, daysCreated: created, daysUpdated: updated, days, isHalfDay: !!isHalfDay, autoAssignResult };
}

async function removePTO(taskId){
  await ensureClientTasksLoaded(INTERNAL_ID);
  const task = state.taskCache[INTERNAL_ID].find(t=>t.id===taskId);
  if(!task) return null;
  state.taskCache[INTERNAL_ID] = state.taskCache[INTERNAL_ID].filter(t=>t.id!==taskId);
  await saveClientTasks(INTERNAL_ID);
  // capacity just opened back up — re-optimize that single day in case it helps
  const autoAssignResult = await runAutoAssign(task.dueDate, task.dueDate);
  return { stylistName: stylistName(task.assignedStylist), date: task.dueDate, autoAssignResult };
}

// For each client + task type that has trained coverage, checks every weekday
// in range for days where NO trained stylist has any capacity left at all —
// a true coverage gap, not just a busy day. Uses actual remaining capacity
// (factoring in half-day PTO, other assignments, everything) rather than a
// simple "on PTO or not" flag, so a half-day person correctly still counts as
// partial coverage rather than being treated as fully unavailable.
async function checkPTOCoverage(fromStr, toStr){
  await ensureAllTasksLoaded();
  const days = dateRangeArray(fromStr, toStr).filter(d=>{
    const dow = parseDate(d).getDay();
    return dow!==0 && dow!==6;
  });
  const daySet = new Set(days);

  const loadByStylistDate = {}; // 'stylistId|date' -> committed hours (PTO + everything else)
  allTasksFlat().forEach(t=>{
    if(!t.assignedStylist || !daySet.has(t.dueDate)) return;
    const key = t.assignedStylist+'|'+t.dueDate;
    loadByStylistDate[key] = (loadByStylistDate[key]||0) + (parseFloat(t.estimatedHours)||0);
  });

  const combos = new Set();
  state.trainingMatrix.forEach(e=>combos.add(e.clientId+'|'+e.taskType));

  const flags = [];
  combos.forEach(key=>{
    const [clientId, taskType] = key.split('|');
    const trained = eligibleStylistsFor(clientId, taskType);
    if(trained.length===0) return;
    days.forEach(date=>{
      const noRoomAnywhere = trained.every(s=>{
        const used = loadByStylistDate[s.id+'|'+date] || 0;
        return (s.capacity - used) <= 0;
      });
      if(noRoomAnywhere){
        flags.push({
          clientName:(state.clients.find(c=>c.id===clientId)||{}).name||'—',
          taskType, date, trainedNames: trained.map(s=>s.name),
        });
      }
    });
  });

  return flags.sort((a,b)=> a.date.localeCompare(b.date) || a.clientName.localeCompare(b.clientName));
}

// Same idea as PTO — blocks off a chunk of a stylist's capacity for one day —
// just a shorter, named duration instead of a full/half day off. Reuses the
// same Auto-Assign re-run so anything that no longer fits moves to someone
// else with room, exactly like PTO does.
async function addMeeting(stylistId, date, meetingName, minutes){
  const stylist = state.stylists.find(s=>s.id===stylistId);
  if(!stylist) return null;

  await ensureClientTasksLoaded(INTERNAL_ID);
  const hours = round2(minutes/60);
  state.taskCache[INTERNAL_ID].push(makeTask({
    clientId: INTERNAL_ID, taskType:'Meeting', assignedStylist:stylistId, dueDate:date,
    estimatedHours: hours, status:'Not Started', comments: meetingName,
  }));
  await saveClientTasks(INTERNAL_ID);

  const autoAssignResult = await runAutoAssign(date, date);
  return { stylistName: stylist.name, meetingName, hours, minutes, date, autoAssignResult };
}

/* ============================= GOAL PLANNING ============================= */
function daysInMonth(year, monthIndex){ return new Date(year, monthIndex+1, 0).getDate(); }

function holidaysForTaskType(taskType){
  const region = HOLIDAY_REGION_BY_TASKTYPE[taskType] || 'US';
  return region==='Macedonia' ? state.holidaysMacedonia : state.holidaysUS;
}
function isHoliday(dateStr, taskType){
  return holidaysForTaskType(taskType).some(h=>h.date===dateStr);
}

function weekdayDatesInMonth(monthKey, taskType){
  const [y,m] = monthKey.split('-').map(Number);
  const total = daysInMonth(y, m-1);
  const out = [];
  for(let d=1; d<=total; d++){
    const dt = new Date(y, m-1, d);
    const dow = dt.getDay();
    const ds = fmtDate(dt);
    if(dow!==0 && dow!==6 && !isHoliday(ds, taskType)) out.push(ds);
  }
  return out;
}

function monthKeysAhead(n){
  const out = [];
  const now = new Date();
  for(let i=0;i<n;i++){
    const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  return out;
}

// The ceiling a "Capped to Monthly Goal" client's Starting Target should never
// exceed for a given day: that month's goal (if one's been set on Goal Planning)
// divided evenly across the type's weekdays, same math Goal Planning itself uses.
// Returns null when there's nothing to cap against (no goal set that month, or
// the date isn't a working day for that type), meaning no cap applies.
function goalCapForDate(clientId, taskType, dateStr){
  const monthKey = dateStr.slice(0,7);
  const goal = state.monthlyGoals[monthKey] && state.monthlyGoals[monthKey][taskType] && state.monthlyGoals[monthKey][taskType][clientId];
  if(goal===undefined || goal==='' || goal===null) return null;
  const weekdayDates = weekdayDatesInMonth(monthKey, taskType);
  if(!weekdayDates.includes(dateStr)) return 0; // not a working day per that type's calendar
  return weekdayDates.length>0 ? Math.ceil((parseFloat(goal)||0)/weekdayDates.length) : null;
}

// Clamps a task's Starting Target down to that day's goal cap if its client is
// set to "Capped to Monthly Goal". Full Coverage clients pass through untouched.
// Returns the cap that was applied, or null if no clamping happened.
function applyStartingTargetCap(task){
  const client = state.clients.find(c=>c.id===task.clientId);
  if(!client || !client.capToMonthlyGoal) return null;
  const cap = goalCapForDate(task.clientId, task.taskType, task.dueDate);
  if(cap===null) return null;
  const current = parseFloat(task.startingTarget);
  if(isNaN(current) || current<=cap) return null;
  task.startingTarget = cap;
  const rate = parseFloat(task.rate);
  if(!isNaN(rate) && rate!==0) task.estimatedHours = round2(cap/rate);
  return cap;
}

// Splits a monthly goal evenly across every weekday (Mon–Fri) task of the given
// type for a client that month, setting each task's Target field. Also stores the
// goal itself in state.monthlyGoals so the Reports page reflects the same number.
// Applies a day's total Starting Target across however many task pieces exist for
// that day (1 if not split, several if already auto-split), keeping each piece's
// existing relative share. Shared by Goal Planning and the manual Metabase import.
function applyDayStartingTarget(pieces, dayTotal){
  if(pieces.length===1){
    const t = pieces[0];
    t.startingTarget = dayTotal;
    const rate = parseFloat(t.rate);
    if(!isNaN(rate) && rate!==0) t.estimatedHours = round2(dayTotal/rate);
    return;
  }
  const oldTotal = pieces.reduce((s,t)=>s+(parseFloat(t.startingTarget)||0),0);
  let remaining = dayTotal;
  pieces.forEach((t,idx)=>{
    const isLast = idx===pieces.length-1;
    const ratio = oldTotal>0 ? (parseFloat(t.startingTarget)||0)/oldTotal : 1/pieces.length;
    const piece = isLast ? remaining : Math.round(dayTotal*ratio);
    remaining -= piece;
    t.startingTarget = piece;
    const rate = parseFloat(t.rate);
    if(!isNaN(rate) && rate!==0) t.estimatedHours = round2(piece/rate);
  });
}

// Recomputes future days' Starting Target based on progress so far this month:
// (monthly goal − everything completed so far) ÷ (working days still ahead).
// Today and past days are never touched — only days strictly after today. Runs
// automatically whenever Total Completed changes for a client + task type that
// has a monthly goal set, then re-runs Auto-Assign across the affected future
// days so assignments stay optimized against the new pace.
async function rebalanceFutureDays(clientId, taskType, monthKey){
  const goal = state.monthlyGoals[monthKey] && state.monthlyGoals[monthKey][taskType] && state.monthlyGoals[monthKey][taskType][clientId];
  if(goal===undefined || goal==='' || goal===null) return null; // no monthly goal set — nothing to rebalance against

  await ensureClientTasksLoaded(clientId);
  const monthTasks = state.taskCache[clientId].filter(t=>t.taskType===taskType && t.dueDate && t.dueDate.slice(0,7)===monthKey);
  const totalCompleted = monthTasks.reduce((s,t)=>s+(parseFloat(t.totalCompleted)||0),0);
  const monthlyRemaining = Math.max(0, round2((parseFloat(goal)||0) - totalCompleted));

  const today = fmtDate(new Date());
  const weekdayDates = weekdayDatesInMonth(monthKey, taskType);
  const futureDates = weekdayDates.filter(d=>d>today);
  if(futureDates.length===0) return { monthlyRemaining, futureDaysCount:0, newDailyTarget:0, autoAssignResult:null };

  const newDailyTarget = Math.ceil(monthlyRemaining/futureDates.length);

  // Goal met: remove the rest of the month's tasks for this client + type (unless
  // someone already worked on one, or it was added by hand) instead of leaving
  // zero-target tasks on people's lists.
  if(monthlyRemaining<=0){
    const futureSet = new Set(futureDates);
    const removed = removeUntouchedTasks(clientId, t=>t.taskType===taskType && futureSet.has(t.dueDate) && !t.manual && !t.recurringRuleId);
    await saveClientTasks(clientId);
    const autoAssignResult = removed ? await runAutoAssign(futureDates[0], futureDates[futureDates.length-1]) : null;
    return { monthlyRemaining, futureDaysCount:futureDates.length, newDailyTarget:0, goalMet:true, removed, autoAssignResult };
  }

  // Still work left: make sure every remaining workday has a task again (e.g. if a
  // Total Completed was corrected downward after the goal had been marked met).
  const recreated = ensureTasksForDates(clientId, taskType, futureDates, { generatedBy:'goal' });
  const monthTasksNow = state.taskCache[clientId].filter(t=>t.taskType===taskType && t.dueDate && t.dueDate.slice(0,7)===monthKey);

  const byDate = {};
  monthTasksNow.forEach(t=>{ if(futureDates.includes(t.dueDate)) (byDate[t.dueDate]=byDate[t.dueDate]||[]).push(t); });
  Object.keys(byDate).forEach(date=>{
    applyDayStartingTarget(byDate[date], newDailyTarget);
    byDate[date].forEach(t=>applyStartingTargetCap(t));
  });
  await saveClientTasks(clientId);

  const autoAssignResult = await runAutoAssign(futureDates[0], futureDates[futureDates.length-1]);

  return { monthlyRemaining, futureDaysCount:futureDates.length, newDailyTarget, recreated: recreated.length, autoAssignResult };
}

async function distributeMonthlyGoal(clientId, taskType, monthKey, goalValue){
  // Creates this month's workday tasks the first time a goal is entered (tasks are
  // no longer pre-generated), or removes untouched ones when the goal is cleared.
  const { weekdayCount, dailyTarget, created, removed } = await applyMonthlyGoalTasks(clientId, taskType, monthKey, goalValue);

  if(!state.monthlyGoals[monthKey]) state.monthlyGoals[monthKey] = {};
  if(!state.monthlyGoals[monthKey][taskType]) state.monthlyGoals[monthKey][taskType] = {};
  if(goalValue===''||goalValue===null||!(parseFloat(goalValue)>0)) delete state.monthlyGoals[monthKey][taskType][clientId];
  else state.monthlyGoals[monthKey][taskType][clientId] = goalValue;
  await saveMonthlyGoals();

  // Auto-assign the whole month right after the goal changes — capacity is shared
  // across every client a stylist works on that day, so this re-optimizes across
  // all clients for the month, not just the one whose goal was just edited. This
  // both fills newly-targeted tasks and can reassign existing ones for a better fit.
  const [gy, gm] = monthKey.split('-').map(Number);
  const monthFrom = `${monthKey}-01`;
  const monthTo = `${monthKey}-${String(daysInMonth(gy, gm-1)).padStart(2,'0')}`;
  const autoAssignResult = await runAutoAssign(monthFrom, monthTo);

  return { weekdayCount, dailyTarget, created, removed, cleared: !(parseFloat(goalValue)>0), autoAssignResult };
}

      </div>

function blankRecurringForm(){
  return { id:'', clientId:'', taskType: RECURRING_DEFAULT_TYPES[0], frequency:'weekly', weekdays:[1],
    dayOfMonth:1, nth:1, nthWeekday:1, startDate: fmtDate(new Date()), endDate:'', target:'', hours:'' };
}

function readRecurringForm(root){
  const f = Object.assign({}, state.recurringForm || blankRecurringForm());
  const val = id => { const el = root.querySelector('#'+id); return el ? el.value : undefined; };
  ['clientId','taskType','frequency','dayOfMonth','nth','nthWeekday','startDate','endDate','target','hours'].forEach(k=>{
    const v = val('rec-'+k); if(v!==undefined) f[k] = v;
  });
  const boxes = root.querySelectorAll('[data-rec-weekday]');
  if(boxes.length) f.weekdays = [...boxes].filter(b=>b.checked).map(b=>parseInt(b.dataset.recWeekday));
  return f;
}

          <td class="hint">${escapeHtml(r.startDate||'')}${r.endDate?` → ${escapeHtml(r.endDate)}`:' onward'}</td>
          <td class="hint">${next.length?next.join(', '):'none in the next '+(ROLLING_HORIZON_DAYS/7)+' weeks'}</td>
          <td style="white-space:nowrap;"><button class="btn secondary small" data-rec-edit="${r.id}">Edit</button> <button class="btn ghost small" data-rec-delete="${r.id}">Delete</button></td>

      }).join('')}</tbody></table>`
    : `<div class="empty">No recurring schedules yet. Add one above.</div>`;

function attachRecurringHandlers(root){
  const rerenderWithForm = ()=>{ state.recurringForm = readRecurringForm(root); render(); };
  ['rec-clientId','rec-taskType','rec-frequency','rec-dayOfMonth','rec-nth','rec-nthWeekday','rec-startDate','rec-endDate'].forEach(id=>{
    const el = root.querySelector('#'+id); if(el) el.onchange = rerenderWithForm;
  });
  root.querySelectorAll('[data-rec-weekday]').forEach(el=>el.onchange = rerenderWithForm);
  ['rec-target','rec-hours'].forEach(id=>{ const el = root.querySelector('#'+id); if(el) el.onchange = ()=>{ state.recurringForm = readRecurringForm(root); }; });

  const saveBtn = root.querySelector('[data-action="save-recurring"]');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const f = readRecurringForm(root);
    if(!f.clientId){ alert('Pick a client.'); return; }
    if((f.frequency==='weekly'||f.frequency==='biweekly') && !(f.weekdays||[]).length){ alert('Pick at least one day.'); return; }
    if(f.endDate && f.startDate && f.endDate<f.startDate){ alert('End date is before the start date.'); return; }
    state.recurringSaving = true; state.recurringForm = f; render();
    const rule = { id: f.id || uid(), clientId:f.clientId, taskType:f.taskType, frequency:f.frequency,
      weekdays:(f.weekdays||[]).map(Number), dayOfMonth:parseInt(f.dayOfMonth)||1, nth:parseInt(f.nth)||1, nthWeekday:parseInt(f.nthWeekday)||1,
      startDate:f.startDate || fmtDate(new Date()), endDate:f.endDate||'', target:f.target===''?'':parseFloat(f.target), hours:f.hours===''?'':parseFloat(f.hours) };
    let removed = 0;
    const existing = state.recurringRules.find(r=>r.id===rule.id);
    if(existing){
      removed = await removeRecurringRuleFutureTasks(existing); // regenerate from the new settings
      state.recurringRules = state.recurringRules.map(r=>r.id===rule.id?rule:r);
    } else {
      state.recurringRules.push(rule);
    }
    await saveRecurringRules();
    const created = await syncRecurringRuleTasks(rule);
    const autoAssignResult = created.length ? await runAutoAssign(created[0], created[created.length-1]) : null;
    const client = state.clients.find(c=>c.id===rule.clientId);
    state.recurringResult = { message: `${client?client.name:''} — ${rule.taskType}: ${created.length} task(s) scheduled through ${rollingHorizonEnd()}.`, autoAssignResult };
    state.recurringSaving = false;
    state.recurringForm = blankRecurringForm();
    render();
  };
  const cancelBtn = root.querySelector('[data-action="cancel-recurring-edit"]');
  if(cancelBtn) cancelBtn.onclick = ()=>{ state.recurringForm = blankRecurringForm(); render(); };
  root.querySelectorAll('[data-rec-edit]').forEach(el=>el.onclick = ()=>{
    const r = state.recurringRules.find(x=>x.id===el.dataset.recEdit); if(!r) return;
    state.recurringForm = Object.assign(blankRecurringForm(), JSON.parse(JSON.stringify(r)));
    render(); window.scrollTo(0,0);
  });
  root.querySelectorAll('[data-rec-delete]').forEach(el=>el.onclick = async ()=>{
    const r = state.recurringRules.find(x=>x.id===el.dataset.recDelete); if(!r) return;
    if(!confirm('Delete this schedule? Upcoming tasks from it are removed unless someone has already worked on them.')) return;
    const removed = await removeRecurringRuleFutureTasks(r);
    state.recurringRules = state.recurringRules.filter(x=>x.id!==r.id);
    await saveRecurringRules();
    state.recurringResult = { message:`Schedule deleted — ${removed} upcoming task(s) removed.` };
    render();
  });
  const dismiss = root.querySelector('[data-action="dismiss-recurring-result"]');
  if(dismiss) dismiss.onclick = ()=>{ state.recurringResult = null; render(); };
}

const DASH_DEFAULT_COLUMNS = {
  stylist: ['client','taskType','status','startingTarget','remaining','totalCompleted','estimatedHours','actualTimeSpent','comments'],
  opslead: ['client','taskType','stylist','status','startingTarget','remaining','totalCompleted','estimatedHours','comments'],
};
function dashLayoutKey(){ return 'studio_ops_dash_columns:'+(state.myRole||'')+':'+(state.myPersonId||''); }
function getDashLayout(){
  const defs = dashColumnDefs();
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(dashLayoutKey()) || 'null'); }catch(e){}
  if(!Array.isArray(saved)){
    const vis = DASH_DEFAULT_COLUMNS[state.myRole] || DASH_DEFAULT_COLUMNS.stylist;
    saved = [...vis.map(k=>({key:k, visible:true})), ...defs.filter(d=>!vis.includes(d.key)).map(d=>({key:d.key, visible:false}))];
  }
  const known = new Set(defs.map(d=>d.key));
  const layout = saved.filter(c=>known.has(c.key));
  defs.forEach(d=>{ if(!layout.some(c=>c.key===d.key)) layout.push({key:d.key, visible:!!d.custom}); }); // new team fields show by default
  return layout;
}
function setDashLayout(layout){ try{ localStorage.setItem(dashLayoutKey(), JSON.stringify(layout)); }catch(e){} }
function dashVisibleColumns(exclude){
  const defs = dashColumnDefs();
  return getDashLayout().filter(c=>c.visible && !(exclude||[]).includes(c.key)).map(c=>defs.find(d=>d.key===c.key)).filter(Boolean);
}
/* ---------- sorting & drag-to-reorder (personal, saved in this browser) ---------- */
function taskSortValue(key, t){
  const cn = id => id===INTERNAL_ID ? 'Internal' : ((state.clients.find(c=>c.id===id)||{}).name||'');
  switch(key){
    case 'client': return cn(t.clientId);
    case 'taskType': return t.taskType||'';
    case 'stylist': return t.assignedStylist ? stylistName(t.assignedStylist) : '';
    case 'opsLead': return ((state.opsLeads.find(o=>o.id===t.opsLead)||{}).name||'');
    case 'dueDate': return t.dueDate||'';
    case 'day': return t.dueDate ? ((parseDate(t.dueDate).getDay()+6)%7) : '';
    case 'status': return STATUS_OPTIONS.indexOf(t.status);
    case 'methodUsed': return (t.methodUsed||[]).join(', ');
    case 'tags': return (t.tags||[]).join(', ');
    case 'comments': return t.comments||'';
    case 'primaryMethod': return t.primaryMethod||'';
    default:
      if(key.startsWith('cf:')){ const v = t.custom && t.custom[key.slice(3)]; return v===undefined||v===null ? '' : v; }
      return t[key];
  }
}
function compareTasksBy(key, dir){
  const d = dir==='desc' ? -1 : 1;
  return (a,b)=>{
    let va = taskSortValue(key,a), vb = taskSortValue(key,b);
    const ea = va===''||va===undefined||va===null, eb = vb===''||vb===undefined||vb===null;
    if(ea && eb) return 0; if(ea) return 1; if(eb) return -1; // blanks always last
    const na = parseFloat(va), nb = parseFloat(vb);
    if(!isNaN(na) && !isNaN(nb) && String(na)===String(va).trim() && String(nb)===String(vb).trim()) return (na-nb)*d;
    return String(va).localeCompare(String(vb), undefined, {numeric:true, sensitivity:'base'})*d;
  };
}
function dashPrefKey(kind){ return 'studio_ops_dash_'+kind+':'+(state.myRole||'')+':'+(state.myPersonId||''); }
function getDashSort(){ try{ return JSON.parse(localStorage.getItem(dashPrefKey('sort'))||'null'); }catch(e){ return null; } }
function setDashSort(v){ try{ if(v) localStorage.setItem(dashPrefKey('sort'), JSON.stringify(v)); else localStorage.removeItem(dashPrefKey('sort')); }catch(e){} }
function getDashOrder(){ try{ return JSON.parse(localStorage.getItem(dashPrefKey('order'))||'[]'); }catch(e){ return []; } }
function setDashOrder(v){ try{ if(v && v.length) localStorage.setItem(dashPrefKey('order'), JSON.stringify(v.slice(-3000))); else localStorage.removeItem(dashPrefKey('order')); }catch(e){} }
function orderDashTasks(tasks){
  const sort = getDashSort();
  if(sort && sort.key) return [...tasks].sort(compareTasksBy(sort.key, sort.dir));
  const order = getDashOrder();
  if(!order.length) return tasks;
  const rank = new Map(order.map((id,i)=>[id,i]));
  return tasks.map((t,i)=>({t,i})).sort((a,b)=>{
    const ra = rank.has(a.t.id) ? rank.get(a.t.id) : Infinity, rb = rank.has(b.t.id) ? rank.get(b.t.id) : Infinity;
    return ra!==rb ? (ra<rb?-1:1) : a.i-b.i;
  }).map(x=>x.t);
}
function dashOrderStatusHtml(){
  const sort = getDashSort();
  if(sort && sort.key){
    const d = dashColumnDefs().find(c=>c.key===sort.key);
    return `<div class="dash-order-status">Sorted by <strong>${escapeHtml(d?d.label:sort.key)}</strong> (${sort.dir==='desc'?'Z→A / high→low':'A→Z / low→high'}) · <button class="btn ghost small" data-action="dash-sort-clear">Clear sort</button></div>`;
  }
  if(getDashOrder().length) return `<div class="dash-order-status">Showing your custom order · <button class="btn ghost small" data-action="dash-order-reset">Reset order</button></div>`;
  return `<div class="dash-order-status">Click a column header to sort, or drag rows by the ⋮⋮ handle to reorder.</div>`;
}

function attachDashboardOrderHandlers(root){
  root.querySelectorAll('[data-dash-sort]').forEach(th=>th.onclick = ()=>{
    const key = th.dataset.dashSort, cur = getDashSort();
    let next = {key, dir:'asc'};
    if(cur && cur.key===key) next = cur.dir==='asc' ? {key, dir:'desc'} : null; // asc → desc → off
    setDashSort(next); render();
  });
  const clr = root.querySelector('[data-action="dash-sort-clear"]'); if(clr) clr.onclick = ()=>{ setDashSort(null); render(); };
  const rst = root.querySelector('[data-action="dash-order-reset"]'); if(rst) rst.onclick = ()=>{ setDashOrder([]); render(); };

  // Pointer-based drag (works with mouse, trackpad and touch): grab the ⋮⋮ handle,
  // move within the same table, release to save your order.
  root.querySelectorAll('td.dash-drag').forEach(h=>{
    h.onpointerdown = e=>{
      if(e.button!==undefined && e.button!==0) return;
      e.preventDefault();
      const row = h.closest('tr'), tbody = row.parentNode;
      row.classList.add('dragging');
      document.body.classList.add('is-dragging');
      // listen on the document: the row moves in the DOM while dragging, which would drop element-level pointer capture
      const move = ev=>{
        const el = document.elementFromPoint(ev.clientX, ev.clientY);
        const over = el && el.closest ? el.closest('tr') : null;
        if(!over || over===row || over.parentNode!==tbody) return;
        const r = over.getBoundingClientRect();
        tbody.insertBefore(row, (ev.clientY - r.top) > r.height/2 ? over.nextSibling : over);
      };
      const finish = ()=>{
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', finish);
        document.removeEventListener('pointercancel', finish);
        row.classList.remove('dragging'); document.body.classList.remove('is-dragging');
        const ids = [...tbody.querySelectorAll('tr')].map(r=>r.dataset.editTask).filter(Boolean);
        const idSet = new Set(ids);
        setDashOrder([...getDashOrder().filter(id=>!idSet.has(id)), ...ids]); // other tables keep their order
        setDashSort(null); // a manual order replaces any column sort
        render();
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', finish);
      document.addEventListener('pointercancel', finish);
    };
  });
}

function dashTableHtml(tasks, exclude){
  const cols = dashVisibleColumns(exclude);
  if(!cols.length) return `<div class="hint">All columns are hidden — use Customize columns to show some.</div>`;
  const sort = getDashSort();
  const arrow = k => sort && sort.key===k ? (sort.dir==='desc' ? ' ▼' : ' ▲') : '';
  return `<div class="dash-table-wrap"><table class="dash-table">
    <thead><tr><th class="dash-drag-col"></th>${cols.map(c=>`<th class="sortable" data-dash-sort="${c.key}" title="Sort by ${escapeHtml(c.label)}">${escapeHtml(c.label)}${arrow(c.key)}</th>`).join('')}</tr></thead>
    <tbody>${orderDashTasks(tasks).map(t=>`<tr class="taskrow" data-edit-task="${t.id}" data-edit-client="${t.clientId}"><td class="dash-drag" data-stop="1" title="Drag to reorder">⋮⋮</td>${cols.map(c=>c.cell(t)).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function attachDashboardColumnHandlers(root){
  root.querySelectorAll('[data-action="dash-customize-toggle"]').forEach(b=>b.onclick = ()=>{ state.dashCustomizeOpen = !state.dashCustomizeOpen; render(); });
  root.querySelectorAll('[data-dash-col-toggle]').forEach(el=>el.onchange = ()=>{
    const layout = getDashLayout(); const c = layout.find(x=>x.key===el.dataset.dashColToggle); if(c) c.visible = el.checked; setDashLayout(layout); render();
  });
  root.querySelectorAll('[data-dash-col-move]').forEach(el=>el.onclick = ()=>{
    const [key, dir] = el.dataset.dashColMove.split('|'); const layout = getDashLayout();
    const i = layout.findIndex(x=>x.key===key), j = i + parseInt(dir);
    if(i<0 || j<0 || j>=layout.length) return;
    [layout[i], layout[j]] = [layout[j], layout[i]]; setDashLayout(layout); render();
  });
  const reset = root.querySelector('[data-action="dash-cols-reset"]');
  if(reset) reset.onclick = ()=>{ try{ localStorage.removeItem(dashLayoutKey()); }catch(e){} render(); };
  const add = root.querySelector('[data-action="dash-field-add"]');
  if(add) add.onclick = async ()=>{
    const name = (root.querySelector('#dash-new-field-name').value||'').trim();
    const type = root.querySelector('#dash-new-field-type').value;
    if(!name){ alert('Give the field a name.'); return; }
    if((state.customFields||[]).some(f=>f.name.toLowerCase()===name.toLowerCase())){ alert('A field with that name already exists.'); return; }
    state.customFields = [...(state.customFields||[]), { id:uid(), name, type }];
    await saveCustomFields(); render();
  };
  root.querySelectorAll('[data-dash-field-delete]').forEach(el=>el.onclick = async ()=>{
    const f = state.customFields.find(x=>x.id===el.dataset.dashFieldDelete); if(!f) return;
    if(!confirm(`Remove the "${f.name}" field for everyone? It disappears from all dashboards and task forms. Values already entered stay saved on the tasks but won't be shown.`)) return;
    state.customFields = state.customFields.filter(x=>x.id!==f.id);
    await saveCustomFields(); render();
  });
  root.querySelectorAll('[data-inline-custom]').forEach(el=>el.onchange = async ()=>{
    const [fid, taskId, clientId] = el.dataset.inlineCustom.split('|');
    const task = (state.taskCache[clientId]||[]).find(x=>x.id===taskId); if(!task) return;
    await updateTask(clientId, taskId, { custom: Object.assign({}, task.custom||{}, { [fid]: el.value }) });
    render();
  });
  root.querySelectorAll('[data-inline-field]').forEach(el=>el.onchange = async ()=>{
    const [field, taskId, clientId] = el.dataset.inlineField.split('|');
    await updateTask(clientId, taskId, { [field]: el.value });
    render();
  });
}

  } else {
    const byMonth = {};
    ptoEntries.forEach(t=>{
      const mk = t.dueDate.slice(0,7);
      (byMonth[mk] = byMonth[mk] || []).push(t);
    });
    const monthKeys = Object.keys(byMonth).sort();
    bodyHtml = monthKeys.map((mk,idx)=>{
      const [y,m] = mk.split('-').map(Number);
      const rows = byMonth[mk].map(t=>`
        <tr>
          <td>${t.dueDate}</td><td>${t.dayOfWeek||dayOfWeekFromDate(t.dueDate)}</td>
          <td>${escapeHtml(stylistName(t.assignedStylist))}</td>
          <td>${t.ptoHalfDay ? '<span class="chip tag-chip">Half Day</span>' : 'Full Day'}</td>
          <td style="width:90px;"><button class="btn ghost" data-remove-pto="${t.id}">Remove</button></td>
        </tr>`).join('');
      return `<details class="month-accordion" ${idx===0?'open':''}>
        <summary>${MONTH_NAMES[m-1]} ${y}<span>${byMonth[mk].length} entr${byMonth[mk].length===1?'y':'ies'}</span></summary>
        <table><thead><tr><th>Date</th><th>Day</th><th>Stylist</th><th>Type</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      </details>`;
    }).join('');
  }

  return `
    <div class="view-header">
      <div>
        <div class="view-title">PTO and Meetings</div>
        <div class="view-sub">Submit PTO or request meeting time below, and see everyone's upcoming time off from today forward.</div>
      </div>
    </div>

    <div class="card" style="padding:20px 22px;margin-bottom:22px;border-color:var(--plum-light);">
      <h3 style="font-size:16px;margin-bottom:2px;">Submit PTO</h3>
      <div class="view-sub" style="margin-bottom:14px;">Pick your name and dates below. Submitting automatically moves your other tasks to another trained stylist with room — no need to tell anyone separately.</div>
      <div class="grid3" style="margin-bottom:12px;max-width:600px;">
        <div class="field"><span class="field-label">Your name</span><select id="pto-stylist"><option value="">Select…</option>${[...state.stylists].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${s.id}" ${state.ptoStylist===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select></div>
        <div class="field"><span class="field-label">From</span><input type="date" id="pto-from" value="${state.ptoFrom}"></div>
        <div class="field"><span class="field-label">To</span><input type="date" id="pto-to" value="${state.ptoTo}"></div>
      </div>
      <div class="field" style="max-width:300px;margin-bottom:14px;">
        <span class="field-label">Day Type</span>
        <select id="pto-half-day">
          <option value="">Full Day</option>
          <option value="half">Half Day <span class="hint">(half your daily capacity freed up, not all of it)</span></option>
        </select>
      </div>
      <button class="btn" data-action="submit-pto" ${state.ptoSubmitting?'disabled':''}>${state.ptoSubmitting?'Submitting…':'Submit PTO'}</button>
      ${ptoResultBannerHtml(state.ptoResult)}
    </div>

    <div class="card" style="padding:20px 22px;margin-bottom:22px;border-color:var(--plum-light);">
      <h3 style="font-size:16px;margin-bottom:2px;">Request Meeting Time</h3>
      <div class="view-sub" style="margin-bottom:14px;">Blocks off time from your regular work for a meeting. If it pushes something you're assigned that day over your capacity, it automatically moves to another trained stylist with room.</div>
      <div class="grid3" style="margin-bottom:12px;max-width:600px;">
        <div class="field"><span class="field-label">Your name</span><select id="meeting-stylist"><option value="">Select…</option>${[...state.stylists].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${s.id}" ${state.meetingStylist===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select></div>
        <div class="field"><span class="field-label">Date</span><input type="date" id="meeting-date" value="${state.meetingDate}"></div>
        <div class="field"><span class="field-label">Time Estimate</span><select id="meeting-minutes"><option value="">Select…</option>${MEETING_DURATION_OPTIONS.map(([label,mins])=>`<option value="${mins}" ${String(state.meetingMinutes)===String(mins)?'selected':''}>${label}</option>`).join('')}</select></div>
      </div>
      <div class="field" style="max-width:400px;margin-bottom:14px;">
        <span class="field-label">Meeting Name</span>
        <input type="text" id="meeting-name" value="${escapeHtml(state.meetingName||'')}" placeholder="e.g. 1:1 with manager">
      </div>
      <button class="btn" data-action="submit-meeting" ${state.meetingSubmitting?'disabled':''}>${state.meetingSubmitting?'Submitting…':'Request Meeting Time'}</button>
      ${meetingResultBannerHtml(state.meetingResult)}
    </div>

    <div class="view-header">
      <div>
        <div class="view-title" style="font-size:18px;">Upcoming PTO</div>
      </div>
      <div class="field" style="width:200px;">
        <span class="field-label">Filter by stylist</span>
        <select id="ptocal-stylist">${stylistOptions}</select>
      </div>
    </div>
    <div class="card" style="padding:18px 20px;">
      ${bodyHtml}
    </div>
  `;
}

function fieldsFormHtml(t, prefillClientId){

  const typeOptions = [...CORE_TYPES, ...state.additionalTypes].map(tt=>`<option ${t&&t.taskType===tt?'selected':''}>${escapeHtml(tt)}</option>`).join('');
  const stylistOptions = `<option value="">—</option>` + state.stylists.map(s=>`<option value="${s.id}" ${t&&t.assignedStylist===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('');
  const opsLeadOptions = `<option value="">—</option>` + state.opsLeads.map(o=>`<option value="${o.id}" ${t&&t.opsLead===o.id?'selected':''}>${escapeHtml(o.name)}</option>`).join('');
  const statusOptions = STATUS_OPTIONS.map(s=>`<option ${t&&t.status===s?'selected':''}>${s}</option>`).join('');
  const primaryOptions = `<option value="">—</option>` + state.methodOptions.primary.map(m=>`<option ${t&&t.primaryMethod===m?'selected':''}>${escapeHtml(m)}</option>`).join('');
  const usedValues = t && Array.isArray(t.methodUsed) ? t.methodUsed : [];
  const usedOptions = state.methodOptions.used.map(m=>`<option value="${escapeHtml(m)}" ${usedValues.includes(m)?'selected':''}>${escapeHtml(m)}</option>`).join('');

  return `
    <div class="grid2">
      <div class="field"><span class="field-label">Client</span><select id="f-client">${clientOptions}</select></div>
      <div class="field"><span class="field-label">Task Type</span><select id="f-type">${typeOptions}</select></div>

      <div class="field"><span class="field-label">Ops Lead</span><select id="f-opslead">${opsLeadOptions}</select></div>
      <div class="field"><span class="field-label">Due Date</span><input type="date" id="f-duedate" value="${t?t.dueDate:''}"></div>
      <div class="field"><span class="field-label">Day of Week (auto)</span><input type="text" id="f-dow" value="${t?t.dayOfWeek:''}" disabled></div>

      <div class="field"><span class="field-label">Primary Method</span><select id="f-primary">${primaryOptions}</select></div>
      <div class="field"><span class="field-label">Method Used <span class="hint">(select any that apply)</span></span><select id="f-used" multiple size="4">${usedOptions}</select></div>
      <div class="field"></div>
      <div class="field"><span class="field-label">Starting Target <span class="hint">(pulled from Metabase once daily at this client's feed sync time, then frozen)</span></span><input type="number" id="f-target" value="${t?t.startingTarget:''}"></div>
      <div class="field"><span class="field-label">Remaining <span class="hint">(pulled from Metabase continuously through the day)</span></span><input type="number" id="f-remaining" value="${t?t.remaining:''}"></div>
      <div class="field"><span class="field-label">Rate</span><input type="number" id="f-rate" value="${t?t.rate:''}"></div>
      <div class="field"><span class="field-label">Estimated Hours <span class="hint">(auto = starting target ÷ rate)</span></span><input type="number" id="f-esthours" value="${t?t.estimatedHours:''}"><div class="hint" id="f-esthours-time">${formatHoursAsTime(t?t.estimatedHours:'')}</div></div>

    <div class="field" style="margin-top:12px;">
