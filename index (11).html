          <span class="field-label">Tags <span class="hint">(comma-separated — added to each task's existing tags)</span></span>
          <input type="text" id="bf-tags" placeholder="e.g. rush, VIP client" list="tag-suggestions">
          <datalist id="tag-suggestions">${allKnownTags().map(tag=>`<option value="${escapeHtml(tag)}">`).join('')}</datalist>
          <label class="hint" style="display:block;margin-top:6px;"><input type="checkbox" id="bf-tags-replace"> Replace existing tags instead of adding to them</label>
        </div>
      </div>
      <div class="hint" style="margin-top:8px;">If you set Target and/or Rate, Estimated Hours recalculates automatically for every selected task.</div>
      <div class="modal-actions">
        <button class="btn secondary" data-close-modal="1">Cancel</button>
        <button class="btn" data-action="save-bulk-edit">Apply to ${count} Task${count>1?'s':''}</button>
      </div>
    </div></div>`;
  }
  return '';
}

function readTaskForm(){
  return {
    clientId: document.getElementById('f-client').value || null,
    taskType: document.getElementById('f-type').value,
    assignedStylist: document.getElementById('f-stylist').value,
    opsLead: document.getElementById('f-opslead').value,
    dueDate: document.getElementById('f-duedate').value,
    status: document.getElementById('f-status').value,
    primaryMethod: document.getElementById('f-primary').value,
    methodUsed: Array.from(document.getElementById('f-used').selectedOptions).map(o=>o.value),
    startingTarget: document.getElementById('f-target').value,
    remaining: document.getElementById('f-remaining').value,
    rate: document.getElementById('f-rate').value,
    estimatedHours: document.getElementById('f-esthours').value,
    actualTimeSpent: document.getElementById('f-actual').value,
    totalCompleted: document.getElementById('f-totalcompleted').value,
    tags: [...new Set(document.getElementById('f-tags').value.split(',').map(s=>s.trim()).filter(Boolean))],
    comments: document.getElementById('f-comments').value,
    custom: (()=>{ const o = {}; document.querySelectorAll('[data-f-custom]').forEach(el=>{ o[el.dataset.fCustom] = el.value; }); return o; })(),
  };
}

/* ============================= EVENT HANDLING ============================= */
function attachGlobalHandlers(){
  const root = document.getElementById('root');

  root.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{ state.view = el.dataset.nav; render(); });
  if(state.view==='recurring') attachRecurringHandlers(root);
  if(state.view==='mydashboard'){ attachDashboardColumnHandlers(root); attachDashboardOrderHandlers(root); }
  const themeBtn = root.querySelector('[data-action="toggle-theme"]');
  if(themeBtn) themeBtn.onclick = ()=>{
    const dark = document.documentElement.dataset.theme !== 'dark';
    if(dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
    try{ localStorage.setItem('studio_ops_theme', dark ? 'dark' : 'light'); }catch(e){}
    render();
  };
  root.querySelectorAll('[data-action="export-all"]').forEach(b=>b.onclick = ()=>exportAllToExcel());
  root.querySelectorAll('[data-action="export-alltasks"]').forEach(b=>b.onclick = ()=>exportFilteredTasksToExcel());
  root.querySelectorAll('[data-action="export-workload"]').forEach(b=>b.onclick = ()=>exportWorkloadToExcel());
  const refreshBtn = root.querySelector('[data-action="refresh-all"]');
  if(refreshBtn) refreshBtn.onclick = async ()=>{ state.taskCache={}; state.loaded=false; await render(); };

  // Reports
  const reportMonthInput = root.querySelector('#report-month');
  if(reportMonthInput) reportMonthInput.onchange = async ()=>{
    state.reportMonth = reportMonthInput.value;
    const cutoff = archiveCutoffDate();
    if(state.reportMonth < cutoff.slice(0,7) && !state.archiveLoaded){
      const mainEl = document.getElementById('main');
      if(mainEl) mainEl.innerHTML = '<div class="loading">Loading historical data for this month…</div>';
      await ensureArchiveLoaded();
    }
    render();
  };
  const reportSearchInput = root.querySelector('#report-client-search');
  if(reportSearchInput) reportSearchInput.oninput = debounce(()=>{ state.reportClientSearch = reportSearchInput.value; render(); }, 300);
  const reportOpsLeadFilter = root.querySelector('#report-opslead-filter');
  if(reportOpsLeadFilter) reportOpsLeadFilter.onchange = ()=>{ state.reportOpsLeadFilter = reportOpsLeadFilter.value; render(); };
  root.querySelectorAll('[data-client-opslead]').forEach(el=>{
    el.onchange = async ()=>{
      const c = state.clients.find(c=>c.id===el.dataset.clientOpslead);
      if(c){
        c.opsLead = el.value;
        await storeSet('clients', state.clients);
        await applyOpsLeadToClientTasks(c.id, c.opsLead);
        render();
      }
    };
  });
  root.querySelectorAll('[data-client-goal]').forEach(el=>{
    el.onchange = async ()=>{
      const [type, clientId] = el.dataset.clientGoal.split('|');
      const monthKey = state.reportMonth;
      // same path as Goal Planning, so both pages always show the same goal and the month's tasks follow it
      el.disabled = true;
      await distributeMonthlyGoal(clientId, type, monthKey, el.value);
      render();
    };
  });

  // Training & Auto-Assign
  const addTrainingBtn = root.querySelector('[data-action="add-training-entry"]');
  if(addTrainingBtn) addTrainingBtn.onclick = async ()=>{
    const stylistId = document.getElementById('tm-stylist').value;
    const clientId = document.getElementById('tm-client').value;
    const taskType = document.getElementById('tm-type').value;
    if(!isTrained(stylistId, clientId, taskType)){
      state.trainingMatrix.push({id:uid(), stylistId, clientId, taskType});
      await saveTrainingMatrix();
    }
    render();
  };
  root.querySelectorAll('[data-remove-training]').forEach(el=>el.onclick=async ()=>{
    state.trainingMatrix = state.trainingMatrix.filter(e=>e.id!==el.dataset.removeTraining);
    await saveTrainingMatrix();
    render();
  });
  const importTrainingBtn = root.querySelector('[data-action="import-training"]');
  if(importTrainingBtn) importTrainingBtn.onclick = async ()=>{
    const text = document.getElementById('training-import-text').value;
    const result = parseTrainingImport(text);
    await saveTrainingMatrix();
    state.trainingImportResult = result;
    state.trainingImportText = '';
    render();
  };
  const trainingSearchInput = root.querySelector('#training-client-search');
  if(trainingSearchInput) trainingSearchInput.oninput = debounce(()=>{ state.trainingClientSearch = trainingSearchInput.value; render(); }, 300);

  const autoAssignFromInput = root.querySelector('#auto-assign-from');
  if(autoAssignFromInput) autoAssignFromInput.onchange = ()=>{ state.autoAssignFrom = autoAssignFromInput.value; };
  const autoAssignToInput = root.querySelector('#auto-assign-to');
  if(autoAssignToInput) autoAssignToInput.onchange = ()=>{ state.autoAssignTo = autoAssignToInput.value; };
  const runAutoAssignBtn = root.querySelector('[data-action="run-auto-assign"]');
  if(runAutoAssignBtn) runAutoAssignBtn.onclick = async ()=>{
    state.autoAssignRunning = true; render();
    const result = await runAutoAssign(state.autoAssignFrom, state.autoAssignTo);
    state.autoAssignResult = result;
    state.autoAssignRunning = false;
    render();
  };

  const recommendFromInput = root.querySelector('#recommend-from');
  if(recommendFromInput) recommendFromInput.onchange = ()=>{ state.recommendFrom = recommendFromInput.value; };
  const recommendToInput = root.querySelector('#recommend-to');
  if(recommendToInput) recommendToInput.onchange = ()=>{ state.recommendTo = recommendToInput.value; };
  const runRecommendBtn = root.querySelector('[data-action="run-recommend"]');
  if(runRecommendBtn) runRecommendBtn.onclick = async ()=>{
    state.recommendRunning = true; render();
    const result = await runRecommendation(state.recommendFrom, state.recommendTo);
    state.recommendResult = result;
    state.recommendRunning = false;
    render();
  };

  const splitCapFromInput = root.querySelector('#splitcap-from');

  const splitCapToInput = root.querySelector('#splitcap-to');

  if(runSplitCapBtn) runSplitCapBtn.onclick = async ()=>{

    state.splitCapRunning = false;
    render();

  const ptoStylistSel = root.querySelector('#pto-stylist');

  const ptoFromInput = root.querySelector('#pto-from');
  if(ptoFromInput) ptoFromInput.onchange = ()=>{ state.ptoFrom = ptoFromInput.value; };
  const ptoToInput = root.querySelector('#pto-to');
  if(ptoToInput) ptoToInput.onchange = ()=>{ state.ptoTo = ptoToInput.value; };
  const submitPtoBtn = root.querySelector('[data-action="submit-pto"]');
  if(submitPtoBtn) submitPtoBtn.onclick = async ()=>{

    state.ptoSubmitting = false;
    render();

  const submitMeetingBtn = root.querySelector('[data-action="submit-meeting"]');
  if(submitMeetingBtn) submitMeetingBtn.onclick = async ()=>{
    const stylistId = document.getElementById('meeting-stylist').value;
    const date = document.getElementById('meeting-date').value;

    const name = document.getElementById('meeting-name').value.trim();

  const ptoCoverageFromInput = root.querySelector('#ptocoverage-from');

  const ptoCoverageToInput = root.querySelector('#ptocoverage-to');

  const runPtoCoverageBtn = root.querySelector('[data-action="run-ptocoverage"]');
  if(runPtoCoverageBtn) runPtoCoverageBtn.onclick = async ()=>{
    state.ptoCoverageRunning = true; render();
    const result = await checkPTOCoverage(state.ptoCoverageFrom, state.ptoCoverageTo);
    state.ptoCoverageResult = result;
    state.ptoCoverageRunning = false;
    render();
  };

  // Goal Planning
  const goalPlanOpsLeadSel = root.querySelector('#goalplan-opslead');
  if(goalPlanOpsLeadSel) goalPlanOpsLeadSel.onchange = ()=>{ state.goalPlanOpsLead = goalPlanOpsLeadSel.value; render(); };
  const goalPlanSearchInput = root.querySelector('#goalplan-search');
  if(goalPlanSearchInput) goalPlanSearchInput.oninput = debounce(()=>{ state.goalPlanSearch = goalPlanSearchInput.value; render(); }, 300);
  root.querySelectorAll('[data-goalplan-input]').forEach(el=>{
    el.onchange = async ()=>{
      const [taskType, clientId, monthKey] = el.dataset.goalplanInput.split('|');
      state.goalPlanApplying = true; render();
      const result = await distributeMonthlyGoal(clientId, taskType, monthKey, el.value);
      const client = state.clients.find(c=>c.id===clientId);
      state.goalPlanLastResult = { clientName: client?client.name:'—', taskType, monthKey, ...result };
      state.goalPlanApplying = false;
      render();
    };
  });
  root.querySelectorAll('[data-daily-amount]').forEach(el=>{
    el.onchange = async ()=>{
      const [taskType, clientId] = el.dataset.dailyAmount.split('|');
      state.goalPlanApplying = true; render();
      state.dailyAmounts[taskType] = state.dailyAmounts[taskType] || {};
      const amount = parseFloat(el.value);
      if(amount>0) state.dailyAmounts[taskType][clientId] = amount; else delete state.dailyAmounts[taskType][clientId];
      await saveDailyAmounts();
      const { created, removed } = await syncDailyAmountTasks(clientId, taskType);
      const today = fmtDate(new Date()), horizon = rollingHorizonEnd();
      const autoAssignResult = await runAutoAssign(today, horizon);
      const client = state.clients.find(c=>c.id===clientId);
      state.goalPlanLastResult = { kind:'daily', clientName: client?client.name:'—', taskType, monthKey: today.slice(0,7),
        amount: amount>0?amount:0, cleared: !(amount>0), created: created.length, removed, horizon, autoAssignResult };
      state.goalPlanApplying = false;
      render();
    };
  });
  const dismissGoalPlanResult = root.querySelector('[data-action="dismiss-goalplan-result"]');
  if(dismissGoalPlanResult) dismissGoalPlanResult.onclick = ()=>{ state.goalPlanLastResult = null; render(); };

  root.querySelectorAll('[data-remove-pto]').forEach(el=>el.onclick=async ()=>{
    if(!confirm('Remove this PTO entry? Auto-Assign will re-run for that day since capacity just opened back up.')) return;

    const result = await removePTO(el.dataset.removePto);
    if(result){ alert(`Removed ${result.stylistName}'s PTO for ${result.date}. Auto-Assign re-ran: ${result.autoAssignResult.assignedCount} newly assigned, ${result.autoAssignResult.reassignedCount} reassigned.`); }

  // My Dashboard

    myNameSel.innerHTML = `<option value="">Select your name…</option>` + opts.map(o=>`<option value="${o.id}">${escapeHtml(o.name)}</option>`).join('');

  const setMyIdentityBtn = root.querySelector('[data-action="set-my-identity"]');
  if(setMyIdentityBtn) setMyIdentityBtn.onclick = ()=>{

  const switchMyIdentityBtn = root.querySelector('[data-action="switch-my-identity"]');
  if(switchMyIdentityBtn) switchMyIdentityBtn.onclick = ()=>{

  const gotoPtoBtn = root.querySelector('[data-action="goto-pto"]');

  root.querySelectorAll('[data-all-sort]').forEach(th=>th.onclick = ()=>{

    try{ localStorage.setItem('studio_ops_alltasks_sort', JSON.stringify(state.allTasksSort)); }catch(e){}

  });

  root.querySelectorAll('[data-remove-stylist]').forEach(el=>el.onclick=async ()=>{

    if(!confirm(`Remove ${s.name}? This clears them off every task they're assigned to and removes them from the Training Matrix. This can't be undone.`)) return;
    el.textContent = 'Removing…'; el.disabled = true;
    const result = await removeStylistEverywhere(s.id);

    if(result.clearedTasks.length>0){
      // jump straight to the reliable, always-accurate place to review these
      state.view = 'all';
      state.allTasksFilters = {multi:{stylist:['__unassigned__']},from:'',to:'',q:''};
      state.allTasksPage = 1;
      render();
      const sample = result.clearedTasks.slice(0,10).map(t=>`${t.client} — ${t.taskType} (${t.date})`).join('\n');
      const more = result.clearedTasks.length>10 ? `\n…and ${result.clearedTasks.length-10} more.` : '';
      alert(`${result.removedName} removed. ${result.clearedTasks.length} task(s) are now unassigned (shown below, filtered to "Unassigned"):\n\n${sample}${more}`);
    } else {
      alert(`${result.removedName} removed. They had no tasks assigned, so nothing needs reassigning.`);
      render();
    }
  });
  const addStylistBtn = root.querySelector('[data-action="add-stylist"]');
  if(addStylistBtn) addStylistBtn.onclick = async ()=>{
    const nameInp = document.getElementById('new-stylist-name');
    const capInp = document.getElementById('new-stylist-cap');
    const name = nameInp.value.trim();
    const capacity = parseFloat(capInp.value);
    if(!name){ alert('Enter a name for the new stylist.'); return; }
    if(isNaN(capacity) || capacity<=0){ alert('Enter a daily capacity greater than 0.'); return; }
    state.stylists.push({id:uid(), name, capacity});
    await saveStylists();
    render();
  };
  root.querySelectorAll('[data-remove-method]').forEach(el=>el.onclick=async ()=>{ const [grp,idx]=el.dataset.removeMethod.split('|'); state.methodOptions[grp].splice(Number(idx),1); await saveMethodOptions(); render(); });
  root.querySelectorAll('[data-remove-opslead]').forEach(el=>el.onclick=async ()=>{ state.opsLeads.splice(Number(el.dataset.removeOpslead),1); await saveOpsLeads(); render(); });
  const addOpsLeadBtn = root.querySelector('[data-action="add-opslead"]');
  if(addOpsLeadBtn) addOpsLeadBtn.onclick=async ()=>{ const inp=document.getElementById('new-opslead-input'); if(inp.value.trim()){ state.opsLeads.push({id:uid(), name:inp.value.trim()}); await saveOpsLeads(); render(); } };
  root.querySelectorAll('[data-remove-type]').forEach(el=>el.onclick=async ()=>{ state.additionalTypes.splice(Number(el.dataset.removeType),1); await saveAdditionalTypes(); render(); });
  const addTypeBtn = root.querySelector('[data-action="add-type"]');
  if(addTypeBtn) addTypeBtn.onclick=async ()=>{ const inp=document.getElementById('new-type-input'); if(inp.value.trim()){ state.additionalTypes.push(inp.value.trim()); await saveAdditionalTypes(); render(); } };
  const addPrimaryBtn = root.querySelector('[data-action="add-primary-method"]');
  if(addPrimaryBtn) addPrimaryBtn.onclick=async ()=>{ const inp=document.getElementById('new-primary-input'); if(inp.value.trim()){ state.methodOptions.primary.push(inp.value.trim()); await saveMethodOptions(); render(); } };
  const addUsedBtn = root.querySelector('[data-action="add-used-method"]');
  if(addUsedBtn) addUsedBtn.onclick=async ()=>{ const inp=document.getElementById('new-used-input'); if(inp.value.trim()){ state.methodOptions.used.push(inp.value.trim()); await saveMethodOptions(); render(); } };
  root.querySelectorAll('[data-remove-holiday]').forEach(el=>el.onclick=async ()=>{
    const [region, id] = el.dataset.removeHoliday.split('|');
    if(region==='us'){ state.holidaysUS = state.holidaysUS.filter(h=>h.id!==id); await saveHolidaysUS(); }
    else { state.holidaysMacedonia = state.holidaysMacedonia.filter(h=>h.id!==id); await saveHolidaysMacedonia(); }
    render();
  });
  const addHolidayUSBtn = root.querySelector('[data-action="add-holiday-us"]');
  if(addHolidayUSBtn) addHolidayUSBtn.onclick=async ()=>{
    const dateInp = document.getElementById('new-holiday-us-date');
    const labelInp = document.getElementById('new-holiday-us-label');
    if(dateInp.value && labelInp.value.trim()){
      state.holidaysUS.push({id:uid(), date:dateInp.value, label:labelInp.value.trim()});
      await saveHolidaysUS();
      render();
    }
  };
  const addHolidayMKBtn = root.querySelector('[data-action="add-holiday-mk"]');
  if(addHolidayMKBtn) addHolidayMKBtn.onclick=async ()=>{
    const dateInp = document.getElementById('new-holiday-mk-date');
    const labelInp = document.getElementById('new-holiday-mk-label');
    if(dateInp.value && labelInp.value.trim()){
      state.holidaysMacedonia.push({id:uid(), date:dateInp.value, label:labelInp.value.trim()});
      await saveHolidaysMacedonia();
      render();
    }
  };
  const autoSplitThresholdInput = root.querySelector('#auto-split-threshold');
  if(autoSplitThresholdInput) autoSplitThresholdInput.onchange = async ()=>{
    state.autoSplitThresholdHours = parseFloat(autoSplitThresholdInput.value)||0;
    await saveAutoSplitThreshold();
  };

  // Modal generic close
  root.querySelectorAll('[data-close-modal]').forEach(el=>el.onclick=(e)=>{ if(e.target===el){ state.modal=null; render(); } });
  root.querySelectorAll('[data-stop]').forEach(el=>el.onclick=(e)=>e.stopPropagation());

  // Modal live starting target/rate -> estimated hours
  const targetEl = document.getElementById('f-target'), rateEl = document.getElementById('f-rate'), estEl = document.getElementById('f-esthours');
  const estTimeEl = document.getElementById('f-esthours-time');
  if(estEl && estTimeEl) estEl.oninput = ()=>{ estTimeEl.textContent = formatHoursAsTime(estEl.value); };
  if(targetEl && rateEl && estEl){
    const recalc = ()=>{ const tg=parseFloat(targetEl.value), rt=parseFloat(rateEl.value); if(!isNaN(tg)&&!isNaN(rt)&&rt!==0){ estEl.value = round2(tg/rt); if(estTimeEl) estTimeEl.textContent = formatHoursAsTime(estEl.value); } };
    targetEl.oninput = recalc; rateEl.oninput = recalc;
  }
  const dueDateEl = document.getElementById('f-duedate'), dowEl = document.getElementById('f-dow');
  if(dueDateEl && dowEl){ dueDateEl.oninput = ()=>{ dowEl.value = dueDateEl.value ? dayOfWeekFromDate(dueDateEl.value) : ''; }; }

  // Save actions
  const saveAddClient = root.querySelector('[data-action="save-add-client"]');
  if(saveAddClient) saveAddClient.onclick = async ()=>{
    const name = document.getElementById('new-client-name').value.trim();
    const year = parseInt(document.getElementById('new-client-year').value)||2026;
    if(!name) return alert('Please enter a client name.');
    saveAddClient.textContent='Creating…'; saveAddClient.disabled=true;
    const c = await addClient(name, year);
    state.modal=null; state.selectedClientId=c.id; state.selectedTab=CORE_TYPES[0]; state.view='clients';
    render();
  };

  const saveAddTask = root.querySelector('[data-action="save-add-task"]');
  if(saveAddTask) saveAddTask.onclick = async ()=>{
    const data = readTaskForm();
    await addTask(data);
    state.modal=null; render();
  };

  const saveEditTask = root.querySelector('[data-action="save-edit-task"]');
  if(saveEditTask) saveEditTask.onclick = async ()=>{
    const data = readTaskForm();
    const oldClientId = saveEditTask.dataset.clientId, taskId = saveEditTask.dataset.taskId;
    const newClientId = data.clientId || INTERNAL_ID;
    let cappedAt = null, rebalanceResult = null;
    if(newClientId !== oldClientId){
      // moved to a different client — remove from old, add to new
      const idx = state.taskCache[oldClientId].findIndex(t=>t.id===taskId);
      const [moved] = state.taskCache[oldClientId].splice(idx,1);
      await saveClientTasks(oldClientId);
      Object.assign(moved, data, {clientId:newClientId});
      cappedAt = applyStartingTargetCap(moved);
      await ensureClientTasksLoaded(newClientId);
      state.taskCache[newClientId].push(moved);
      await saveClientTasks(newClientId);
    } else {
      const result = await updateTask(oldClientId, taskId, data);
      cappedAt = result ? result.cappedAt : null;
      rebalanceResult = result ? result.rebalanceResult : null;
    }
    state.modal=null; render();
    const messages = [];
    if(cappedAt!==null) messages.push(`Starting Target reduced to ${cappedAt} — this client is set to "Capped to Monthly Goal," and that's this day's share of the monthly goal.`);
    if(rebalanceResult && rebalanceResult.goalMet) messages.push(`Monthly goal met — ${rebalanceResult.removed} remaining task(s) for this month were removed${rebalanceResult.removed?' and Auto-Assign re-ran so that time can go elsewhere':''}.`);
    else if(rebalanceResult && rebalanceResult.futureDaysCount>0) messages.push(`Remaining days rebalanced: ${round2(rebalanceResult.monthlyRemaining)} still needed this month, spread across ${rebalanceResult.futureDaysCount} remaining working day(s) → ${rebalanceResult.newDailyTarget}/day going forward.`);
    if(messages.length) alert(messages.join('\n\n'));
  };

  const bfUsedApply = document.getElementById('bf-used-apply');
  const bfUsedSelect = document.getElementById('bf-used');
  if(bfUsedApply && bfUsedSelect){ bfUsedApply.onchange = ()=>{ bfUsedSelect.disabled = !bfUsedApply.checked; }; }

  const saveBulkEdit = root.querySelector('[data-action="save-bulk-edit"]');
  if(saveBulkEdit) saveBulkEdit.onclick = async ()=>{
    const updates = {
      assignedStylist: document.getElementById('bf-stylist').value,
      opsLead: document.getElementById('bf-opslead').value,
      status: document.getElementById('bf-status').value,
      dueDate: document.getElementById('bf-duedate').value,
      primaryMethod: document.getElementById('bf-primary').value,
      startingTarget: document.getElementById('bf-target').value,
      rate: document.getElementById('bf-rate').value,
    };
    if(document.getElementById('bf-used-apply').checked){
      updates.methodUsed = Array.from(document.getElementById('bf-used').selectedOptions).map(o=>o.value);
    }
    const tagsInput = document.getElementById('bf-tags').value.trim();
    if(tagsInput){
      updates.tagsToAdd = [...new Set(tagsInput.split(',').map(s=>s.trim()).filter(Boolean))];
      updates.tagsReplace = document.getElementById('bf-tags-replace').checked;
    }
    saveBulkEdit.textContent='Applying…'; saveBulkEdit.disabled=true;
    const result = await bulkUpdateTasks([...state.selectedTaskIds], updates);
    state.selectedTaskIds.clear();
    state.modal=null; render();
    if(result && result.cappedCount>0){ alert(`${result.cappedCount} task(s) had their Starting Target reduced to that day's monthly-goal cap ("Capped to Monthly Goal" clients only).`); }
    if(result && result.rebalancedCombos>0){ alert(`${result.rebalancedCombos} client + task type combo(s) had their remaining working days rebalanced based on the new completions.`); }
  };
}

function debounce(fn, ms){ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); }; }

/* ============================= BOOT ============================= */
try{ const th = localStorage.getItem('studio_ops_theme'); if(th==='dark') document.documentElement.dataset.theme = 'dark'; }catch(e){}
try{ const srt = JSON.parse(localStorage.getItem('studio_ops_alltasks_sort')||'null'); if(srt && srt.key) state.allTasksSort = srt; }catch(e){}
try{ const gb = localStorage.getItem('studio_ops_alltasks_groupby'); if(gb) state.atGroupBy = gb; }catch(e){}
try{
  const saved = JSON.parse(localStorage.getItem('studio_ops_my_identity') || 'null');
  if(saved && saved.role && saved.id){ state.myRole = saved.role; state.myPersonId = saved.id; }
}catch(e){}
render();
</script>
</body>
</html>
