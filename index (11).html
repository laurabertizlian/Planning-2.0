<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Styling Team Master Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20232B;
    --paper:#F7F5F1;
    --panel:#FFFFFF;
    --plum:#6B3F52;
    --plum-light:#8C5C71;
    --plum-dim:#F1E7EC;
    --sage:#5F7A68;
    --sage-dim:#E6EDE8;
    --amber:#B8791F;
    --amber-dim:#F7EBD6;
    --rose:#AE4038;
    --rose-dim:#F6E4E2;
    --line:#E4E0D8;
    --gray:#75787C;
    --gray-light:#A4A7AA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;}
  ::selection{background:var(--plum-dim);}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:13px;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  .app{display:flex;height:100vh;overflow:hidden;}

  /* Sidebar */
  .sidebar{width:216px;flex-shrink:0;background:var(--ink);color:#EFEAE3;display:flex;flex-direction:column;padding:22px 14px;}
  .brand{font-family:'Fraunces',serif;font-size:20px;font-weight:600;letter-spacing:.2px;padding:0 8px 4px;}
  .brand small{display:block;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:1.5px;color:#9FA6B2;text-transform:uppercase;margin-top:3px;}
  .nav{margin-top:28px;display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:#C9CCD3;background:none;border:none;text-align:left;font-size:13.5px;font-weight:500;transition:background .12s,color .12s;}
  .nav-item:hover{background:#2B303A;color:#fff;}
  .nav-item.active{background:var(--plum);color:#fff;}
  .nav-icon{width:16px;text-align:center;font-size:14px;}
  .sidebar-foot{margin-top:auto;padding:10px 10px 0;border-top:1px solid #33394480;}
  .sidebar-foot button{width:100%;background:none;border:1px solid #454C58;color:#C9CCD3;padding:7px 8px;border-radius:6px;font-size:12px;margin-top:8px;}
  .sidebar-foot button:hover{border-color:#7A8290;color:#fff;}
  .sync-status{font-size:10.5px;color:#8A909B;margin-top:10px;line-height:1.5;}

  /* Main */
  .main{flex:1;overflow-y:auto;padding:26px 34px 60px;}
  .view-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
  .view-title{font-size:24px;font-weight:600;}
  .view-sub{color:var(--gray);font-size:12.5px;margin-top:4px;}
  .btn{background:var(--plum);color:#fff;border:none;padding:9px 16px;border-radius:7px;font-size:13px;font-weight:600;letter-spacing:.1px;}
  .btn:hover{background:var(--plum-light);}
  .btn.secondary{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn.secondary:hover{border-color:var(--gray);}
  .btn.small{padding:5px 11px;font-size:12px;border-radius:6px;}
  .btn.ghost{background:none;color:var(--plum);border:none;padding:4px 6px;font-weight:600;}
  .btn.danger{background:var(--rose);}
  .btn.danger:hover{background:#8f342d;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--gray);font-weight:600;margin-bottom:4px;display:block;}
  select,.input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);}
  input[type=text],input[type=number],input[type=date],textarea{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%;}
  textarea{resize:vertical;min-height:56px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--plum-light);outline-offset:0;border-color:var(--plum-light);}

  table{border-collapse:collapse;width:100%;font-size:12.5px;}
  th{text-align:left;padding:8px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);border-bottom:1px solid var(--line);background:#FCFBF9;position:sticky;top:0;}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr.taskrow:hover{background:var(--plum-dim);cursor:pointer;}
  .empty{padding:40px 20px;text-align:center;color:var(--gray);}
  .empty h3{margin-bottom:6px;color:var(--ink);}

  .status-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .status-Not\ Started{background:#EDEBE6;color:#6B6B63;}
  .status-In\ Progress{background:var(--amber-dim);color:var(--amber);}
  .status-Incomplete{background:var(--rose-dim);color:var(--rose);}
  .status-Done{background:var(--sage-dim);color:var(--sage);}
  .status-Blocked{background:#EADCE0;color:#8C3B4A;}

  /* Client folders */
  .folder-layout{display:flex;gap:22px;align-items:flex-start;}
  .client-list{width:250px;flex-shrink:0;max-height:74vh;overflow-y:auto;}
  .client-list-item{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:500;display:flex;justify-content:space-between;align-items:center;}
  .client-list-item:hover{background:var(--plum-dim);cursor:pointer;}
  .client-list-item.active{background:var(--plum);color:#fff;}
  .client-list-item .count{font-size:10.5px;color:var(--gray-light);}
  .client-list-item.active .count{color:#E9DDE2;}
  .folder-main{flex:1;min-width:0;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap;}
  .tab{padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--gray);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
  .tab.active{color:var(--plum);border-bottom-color:var(--plum);}
  .month-accordion summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:12.5px;background:#FCFBF9;border-bottom:1px solid var(--line);list-style:none;display:flex;justify-content:space-between;}
  .month-accordion summary::-webkit-details-marker{display:none;}
  .month-accordion{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;}

  /* Workload grid */
  .wl-controls{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px;}
  .wl-toggle{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
  .wl-toggle button{border:none;background:#fff;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--gray);}
  .wl-toggle button.active{background:var(--plum);color:#fff;}
  .wl-scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;}
  .wl-table{border-collapse:separate;border-spacing:0;font-family:'JetBrains Mono',monospace;}
  .wl-table th{white-space:nowrap;background:#FCFBF9;}
  .wl-table th.stylist-col,.wl-table td.stylist-col{position:sticky;left:0;background:#fff;z-index:2;border-right:1px solid var(--line);font-family:'Inter',sans-serif;min-width:168px;}
  .wl-table th.stylist-col{background:#FCFBF9;z-index:3;}
  .wl-cell{min-width:74px;text-align:center;padding:6px 4px;cursor:pointer;}
  .wl-cell:hover{outline:2px solid var(--plum-light);outline-offset:-2px;}
  .wl-hrs{font-weight:700;font-size:13px;}
  .wl-bar{height:4px;border-radius:3px;background:#E9E6E0;margin-top:5px;overflow:hidden;}
  .wl-bar-fill{height:100%;border-radius:3px;}
  .cap-open .wl-hrs{color:var(--sage);}
  .cap-open .wl-bar-fill{background:var(--sage);}
  .cap-near .wl-hrs{color:var(--amber);}
  .cap-near .wl-bar-fill{background:var(--amber);}
  .cap-over .wl-hrs{color:var(--rose);}
  .cap-over .wl-bar-fill{background:var(--rose);}
  .cap-zero .wl-hrs{color:var(--gray-light);}
  .cap-zero .wl-bar-fill{background:transparent;}
  .stylist-name{font-weight:600;font-size:12.5px;}
  .stylist-cap{font-size:10.5px;color:var(--gray);font-family:'JetBrains Mono',monospace;}
  .legend{display:flex;gap:16px;margin-top:12px;font-size:11.5px;color:var(--gray);align-items:center;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(32,35,43,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;z-index:50;overflow-y:auto;}
  .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:26px 28px 24px;margin-bottom:5vh;}
  .modal h2{font-size:19px;margin-bottom:2px;}
  .modal-sub{color:var(--gray);font-size:12px;margin-bottom:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 14px;}
  .field{margin-bottom:2px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;border-top:1px solid var(--line);padding-top:16px;}
  .close-x{position:absolute;top:18px;right:22px;background:none;border:none;font-size:18px;color:var(--gray);}
  .modal{position:relative;}
  .hint{font-size:11px;color:var(--gray-light);margin-top:3px;}

  /* Settings */
  .settings-section{margin-bottom:30px;}
  .settings-section h3{font-size:15px;margin-bottom:4px;}
  .settings-section .view-sub{margin-bottom:14px;}
  .chip-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
  .chip{background:var(--plum-dim);color:var(--plum);padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .chip button{background:none;border:none;color:var(--plum);font-size:13px;line-height:1;padding:0;}
  .tag-chip{padding:2px 8px;font-size:10.5px;margin:1px 3px 1px 0;display:inline-block;}
  .add-chip-row{display:flex;gap:8px;margin-top:10px;max-width:340px;}

  .pagination{display:flex;justify-content:center;gap:6px;margin-top:14px;align-items:center;}
  .pagination button{border:1px solid var(--line);background:#fff;padding:5px 10px;border-radius:6px;font-size:12px;}
  .pagination button:disabled{opacity:.4;cursor:default;}
  .pagination span{font-size:12px;color:var(--gray);}

  .filters-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .filters-row .field{min-width:130px;}

  .comment-preview{color:var(--gray);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;}
  .loading{padding:60px;text-align:center;color:var(--gray);font-size:13px;}
  .banner{background:var(--amber-dim);color:#7A5313;border:1px solid #E6CB94;padding:10px 14px;border-radius:9px;font-size:12.5px;margin-bottom:18px;}
  /* ===== Editorial theme (preview) ===== */
  :root{
    --ink:#2B2522; --paper:#F2EDE8; --panel:#F8F5F1; --plum:#6E2A3C; --plum-light:#8A4155; --plum-dim:#EEDFE0;
    --line:#E0D8D0; --gray:#7B726C; --gray-light:#A69D96; --tan:#E7DED4;
    --sage:#5E7563; --sage-dim:#E3E8E0; --amber:#A8732A; --amber-dim:#F3E7D3; --rose:#9E3B36; --rose-dim:#F3E1DE;
  }
  html,body{background:var(--paper);font-family:'Inter',sans-serif;}
  h1,h2,h3,.view-title,.brand{font-family:'Instrument Serif',serif;font-weight:400;letter-spacing:-.2px;}
  h3{font-size:22px !important;}
  .main{padding:38px 48px 70px;}
  .view-title{font-size:48px;line-height:1.02;font-weight:400;}
  .view-header > div:first-child::before{content:attr(data-eyebrow);display:block;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--plum);margin-bottom:10px;}
  .view-sub{font-size:14px;line-height:1.6;color:#5F5752;max-width:760px;}

  /* Sidebar: light, editorial, numbered */
  .sidebar{background:var(--paper);color:var(--ink);border-right:1px solid var(--line);padding:28px 16px;width:236px;}
  .brand{font-size:27px;line-height:1.05;padding:0 6px;}
  .brand small{color:var(--plum);letter-spacing:1.6px;font-size:10.5px;margin-top:8px;}
  .nav{counter-reset:nav;gap:0;margin-top:26px;}
  .nav-item{counter-increment:nav;color:var(--ink);border-radius:0;padding:10px 6px;border-bottom:1px solid var(--line);font-size:13.5px;gap:12px;}
  .nav-item .nav-icon{display:none;}
  .nav-item::before{content:counter(nav, decimal-leading-zero);flex:0 0 28px;height:28px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:'Inter',sans-serif;}
  .nav-item:hover{background:transparent;color:var(--plum);}
  .nav-item.active{background:transparent;color:var(--plum);font-weight:600;}
  .nav-item.active::before{background:var(--plum);border-color:var(--plum);color:#fff;}
  .sidebar-foot{border-top:none;}
  .sidebar-foot button{border:1px solid var(--line);color:var(--ink);border-radius:999px;background:var(--panel);}
  .sidebar-foot button:hover{border-color:var(--plum);color:var(--plum);}
  .sync-status{color:var(--gray);}

  /* Surfaces */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:none;}
  .btn{background:var(--plum);border-radius:999px;padding:9px 18px;font-weight:500;}
  .btn:hover{background:var(--plum-light);}
  .btn.secondary{background:var(--panel);border:1px solid var(--line);border-radius:999px;}
  .btn.ghost{color:var(--plum);}
  .btn.small{border-radius:999px;}
  .field-label{color:var(--gray);font-weight:500;letter-spacing:1.1px;font-size:10.5px;}
  select,.input,input[type=text],input[type=number],input[type=date],textarea{background:#FCFAF8;border:1px solid var(--line);border-radius:10px;}
  input:focus,select:focus,textarea:focus{outline:1px solid var(--plum);border-color:var(--plum);}

  /* Tables: hairline rules, no fills */
  th{background:transparent !important;color:var(--gray);font-weight:500;letter-spacing:1px;border-bottom:1px solid var(--line);}
  td{border-bottom:1px solid var(--line);}
  .wl-table th.stylist-col,.wl-table td.stylist-col{background:var(--panel) !important;}
  td[style*="background:#fff"]{background:var(--panel) !important;}
  tr.taskrow:hover{background:#EFE8E1;}
  .wl-scroll{border-radius:18px;background:var(--panel);}

  /* Pills & chips: beige tags, dashed "empty" pills, burgundy highlight */
  .chip,.tag-chip{background:var(--tan);color:var(--ink);border-radius:6px;font-weight:500;}
  .chip button{color:var(--gray);}
  .status-pill{border-radius:999px;font-weight:500;padding:4px 11px;}
  .status-Not\ Started{background:transparent;color:var(--gray);border:1px dashed #CFC5BC;}
  .status-In\ Progress{background:var(--plum-dim);color:var(--plum);}
  .status-Done{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  .banner{background:var(--plum-dim);color:var(--plum);border:1px solid #E2C9CD;border-radius:14px;}
  .tabs{border-bottom:1px solid var(--line);}
  .tab.active{color:var(--plum);border-bottom-color:var(--plum);}
  .wl-toggle{border-radius:999px;}
  .wl-toggle button{background:var(--panel);}
  .wl-toggle button.active{background:var(--plum);}
  .client-list-item.active{background:var(--plum-dim);color:var(--plum);font-weight:600;}
  .client-list-item:hover{background:#EFE8E1;}
  .month-accordion{border-radius:14px;}
  .month-accordion summary{background:transparent;}
  .modal{background:var(--panel);border-radius:20px;}
  .empty{font-family:'Instrument Serif',serif;font-size:19px;color:var(--gray);}
  .wl-clients{margin-top:5px;font-family:'Inter',sans-serif;font-size:10.5px;line-height:1.35;color:var(--gray);text-align:left;max-width:120px;}
  .wl-clients div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wl-clients .wl-more{color:var(--gray-light);}
  .wl-cell{vertical-align:top;min-width:96px;}
  .dash-table-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px;}
  .dash-table td{white-space:nowrap;}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--plum);}
  .dash-drag-col{width:22px;padding:0 !important;}
  td.dash-drag{cursor:grab;color:var(--gray-light);font-size:13px;letter-spacing:-2px;width:22px;padding:0 4px !important;user-select:none;}
  td.dash-drag:hover{color:var(--plum);}
  tr.dragging{opacity:.55;outline:1px dashed var(--plum);}
  body.is-dragging{cursor:grabbing;user-select:none;}
  td.dash-drag{touch-action:none;}
  .dash-order-status{font-size:12px;color:var(--gray);margin:-8px 0 14px;}
  .dash-order-status .btn.ghost{font-size:12px;padding:0 4px;}
  .dash-table th{white-space:normal;vertical-align:bottom;min-width:60px;}
  .dash-table td,.dash-table th{padding-left:8px;padding-right:8px;}
  .dash-col-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .dash-col-row .btn.small{padding:2px 9px;}
  .dash-col-row .btn:disabled{opacity:.35;cursor:default;}

  /* Workload board */
  .wlb-tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
  .wlb-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel);}
  .wlb{min-width:1100px;}
  .wlb-row{display:grid;border-bottom:1px solid var(--line);}
  .wlb-row:last-child{border-bottom:none;}
  .wlb-head{position:sticky;top:0;z-index:3;background:var(--panel);}
  .wlb-dayhead{padding:10px 8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gray);text-align:center;border-left:1px solid var(--line);}
  .wlb-dayhead span{font-size:13px;color:var(--ink);margin-left:3px;}
  .wlb-dayhead.today span{background:var(--plum);color:#fff;border-radius:999px;padding:1px 7px;}
  .wlb-name-col{position:sticky;left:0;z-index:2;background:var(--panel);padding:8px 10px;border-right:1px solid var(--line);}
  .wlb-person{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:0;text-align:left;color:var(--ink);}
  .wlb-avatar{flex:0 0 28px;height:28px;border-radius:50%;background:var(--plum);color:#fff;font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  .wlb-person-name{flex:1;font-weight:600;font-size:13px;line-height:1.2;}
  .wlb-person-name small{display:block;font-weight:400;font-size:10.5px;color:var(--gray);}
  .wlb-week{font-size:11px;font-weight:600;background:var(--sage-dim);color:var(--sage);border-radius:6px;padding:2px 6px;}
  .wlb-caret{color:var(--gray);font-size:11px;}
  .wlb-day{padding:6px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:5px;min-height:46px;}
  .wlb-day.weekend{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(127,110,100,.07) 6px 12px);}
  .wlb-day.today{box-shadow:inset 2px 0 0 var(--plum);}
  .wlb-cap{border:none;border-radius:8px;padding:5px 6px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;font-family:'Inter',sans-serif;}
  .wlb-cap span{font-weight:400;opacity:.8;}
  .wlb-cap.cap-zero{background:var(--tan);color:var(--gray);}
  .wlb-cap.cap-open{background:var(--sage-dim);color:var(--sage);}
  .wlb-cap.cap-near{background:var(--amber-dim);color:var(--amber);}
  .wlb-cap.cap-over{background:var(--rose-dim);color:var(--rose);}
  .wlb-card{border-radius:7px;background:color-mix(in srgb, var(--c) 30%, var(--panel));border-left:3px solid var(--c);padding:4px 7px 5px;cursor:pointer;min-width:0;}
  .wlb-card:hover{background:color-mix(in srgb, var(--c) 45%, var(--panel));}
  .wlb-card.done{opacity:.6;}
  .wlb-client{font-size:10.5px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wlb-line{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:600;color:var(--ink);}
  .wlb-type{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wlb-time{white-space:nowrap;font-weight:500;}
  .wlb-time .over{color:var(--rose);font-weight:600;}
  .wlb-card{touch-action:none;user-select:none;}
  .wlb-card.wlb-dragging{opacity:.35;}
  .wlb-ghost{position:fixed;z-index:100;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.18);transform:rotate(1.5deg);}

  .wlb-pin{float:right;cursor:pointer;font-size:10px;margin-left:4px;}
  .wlb-pin:hover{filter:grayscale(1);}

  /* All Tasks filters & groups */
  .at-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .at-filter{position:relative;}
  .at-filter-btn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .at-filter-btn:hover{border-color:var(--plum);}
  .at-filter-label{color:var(--gray);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;margin-right:2px;}
  .at-filter.active .at-filter-btn{background:var(--plum-dim);border-color:var(--plum);color:var(--plum);}
  .at-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:10px;}
  .at-pop-actions{display:flex;justify-content:space-between;margin:6px 0 4px;}
  .at-pop-list{max-height:280px;overflow-y:auto;}
  .at-opt{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:13px;cursor:pointer;border-radius:6px;}
  .at-opt:hover{background:var(--tan);}
  .at-table th,.at-table td{white-space:nowrap;}
  .at-table th{white-space:normal;min-width:70px;vertical-align:bottom;}
  .at-group{margin-bottom:10px;overflow:hidden;}
  .at-group-head{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:12px 16px;text-align:left;color:var(--ink);font-size:14px;}
  .at-group-head:hover{background:var(--tan);}
  .at-group-meta{color:var(--gray);font-size:12px;margin-left:auto;}
  .at-caret{color:var(--gray);width:12px;}
  .at-cols-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));column-gap:22px;}

  /* Reports */
  .an-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:16px;}
  .an-tile{padding:16px 18px;}
  .an-big{font-family:'Instrument Serif',serif;font-size:40px;line-height:1.1;margin:4px 0;}

  .an-card h3{margin-bottom:10px;}
  .an-table td{vertical-align:middle;}
  .an-num{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .an-bar{height:10px;border-radius:0 4px 4px 0;background:transparent;min-width:120px;}
  .an-bar-fill{height:100%;background:var(--plum);border-radius:0 4px 4px 0;min-width:2px;}

  html[data-theme="dark"]{
    --ink:#ECE5DF; --paper:#171413; --panel:#221E1C; --plum:#D892A4; --plum-light:#E6AABA; --plum-dim:#3B262C;

  html[data-theme="dark"] .wl-toggle button.active{background:var(--plum-strong);color:#fff;}

  html[data-theme="dark"] input[type=date],html[data-theme="dark"] input[type=time],html[data-theme="dark"] textarea{background:#1B1817;color:var(--ink);border-color:var(--line);}

  html[data-theme="dark"] .status-Blocked{background:#3B262C;color:var(--plum);}
  html[data-theme="dark"] .banner{background:var(--plum-dim);color:var(--plum-light);border-color:#57343D;}

  html[data-theme="dark"] .pagination button{background:var(--panel);color:var(--ink);border-color:var(--line);}
  html[data-theme="dark"] .client-list-item.active{background:var(--plum-dim);color:var(--plum-light);}
  html[data-theme="dark"] ::selection{background:#57343D;}

  .theme-toggle:hover{border-color:var(--plum);color:var(--plum);}

function uid(){ return 'id'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function fmtDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function dayOfWeekFromDate(s){ if(!s) return ''; return DAY_NAMES[parseDate(s).getDay()]; }
function startOfWeek(d){ const c=new Date(d); const day=c.getDay(); const diff=(day===0?-6:1)-day; c.setDate(c.getDate()+diff); c.setHours(0,0,0,0); return c; }
function addDays(d,n){ const c=new Date(d); c.setDate(c.getDate()+n); return c; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function round2(n){ return Math.round(n*100)/100; }
function formatHoursAsTime(hours){
  const h = parseFloat(hours);
  if(isNaN(h) || h===0) return '—';
  const totalMinutes = Math.round(h*60);
  const hh = Math.floor(totalMinutes/60);
  const mm = totalMinutes%60;
  if(hh===0) return `${mm}m`;
  if(mm===0) return `${hh}h`;
  return `${hh}h ${mm}m`;
}

// Remaining is its own field, not derived — it's meant to be pulled live from
// Metabase throughout the day (continuous re-pull, unlike Starting Target which
// freezes once pulled at each client's daily sync time). Until that connection
// exists, it's editable by hand like Starting Target.
function displayValue(v){ return (v!==''&&v!==undefined&&v!==null) ? v : '—'; }

async function storeSet(key,val){ try{ await window.storage.set(key, JSON.stringify(val), true); }catch(e){ console.error('storage set failed',key,e); } }
async function storeGet(key){ try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
async function storeDelete(key){ try{ await window.storage.delete(key, true); }catch(e){ /* ignore missing key */ } }

function defaultStylists(){

  for(;i<=13;i++) list.push({id:uid(), name:specialNames[i] || `Stylist ${String(i).padStart(2,'0')}`, capacity:7.5});
  for(;i<=15;i++) list.push({id:uid(), name:specialNames[i] || `Stylist ${String(i).padStart(2,'0')}`, capacity:7});
  for(;i<=17;i++) list.push({id:uid(), name:specialNames[i] || `Stylist ${String(i).padStart(2,'0')}`, capacity:6});
  for(;i<=25;i++) list.push({id:uid(), name:specialNames[i] || `Stylist ${String(i).padStart(2,'0')}`, capacity:5});
  return list;
}

function makeTask(overrides){
  const base = {
    id:uid(), clientId:null, taskType:CORE_TYPES[0], assignedStylist:'', estimatedHours:'', actualTimeSpent:'',
    dueDate:'', opsLead:'', status:'Not Started', primaryMethod:'', startingTarget:'', remaining:'', totalCompleted:'', rate:'',
    methodUsed:[], tags:[], comments:'', autoSplitGroup:''
  };
  const t = Object.assign(base, overrides);
  if(!Array.isArray(t.methodUsed)) t.methodUsed = t.methodUsed ? [t.methodUsed] : [];
  if(!Array.isArray(t.tags)) t.tags = t.tags ? [t.tags] : [];
  t.dayOfWeek = dayOfWeekFromDate(t.dueDate);
  return t;
}

// Tasks are no longer pre-generated for the whole year. They're created on demand:
// monthly goals (Styling, STM) on Goal Planning, daily amounts (OOS, STM OOS) on
// Goal Planning, and schedules on the Recurring Tasks tab. This stays as a no-op
// so older migrations that call it keep working (they just get an empty list).
function generateYearTasks(clientId, year, opsLead){
  return [];
}
function generateYearTasksLegacy(clientId, year, opsLead){
  const tasks=[];
  CORE_TYPES.forEach(type=>{
    let d = new Date(year,0,1);
    while(d.getFullYear()===year){
      tasks.push(makeTask({clientId, taskType:type, dueDate:fmtDate(d), opsLead: opsLead||''}));
      d = addDays(d,1);
    }
  });
  return tasks;
}

function showBootProgress(message, done, total){
  const root = document.getElementById('root');
  const pct = total ? Math.round((done/total)*100) : 0;
  root.innerHTML = `<div class="loading">
    <div style="font-weight:600;margin-bottom:8px;color:var(--ink);">${escapeHtml(message)}</div>
    ${total ? `<div>${done} of ${total}</div>
    <div style="margin:14px auto 0;height:6px;width:280px;background:#E9E6E0;border-radius:4px;overflow:hidden;">
      <div style="height:100%;background:var(--plum);width:${pct}%;"></div>
    </div>` : ''}
  </div>`;
}

async function applyRealDataMigration(){
  const already = await storeGet('migration_real_data_v1');
  if(already) return;

  showBootProgress('Setting up stylists, ops leads, and method options…');

  // capture old ids for opsLead remapping before we replace the stylist roster
  const oldTaylorBrams = state.stylists.find(s=>s.name==='Taylor Brams');
  const oldAngSalerno = state.stylists.find(s=>s.name==='Ang Salerno');

  // 1. Real stylist roster (name + daily capacity)
  state.stylists = REAL_STYLIST_ROSTER.map(([name,capacity])=>({id:uid(), name, capacity}));
  await saveStylists();

  // 2. Ops Leads — separate roster, not tied to stylist capacity
  state.opsLeads = REAL_OPS_LEAD_NAMES.map(name=>({id:uid(), name}));
  await storeSet('ops_leads', state.opsLeads);

  // 3. Method options — same real 8-option list for both Primary Method and Method Used
  state.methodOptions = { primary:[...REAL_METHOD_OPTIONS], used:[...REAL_METHOD_OPTIONS] };
  await saveMethodOptions();

  // 4. Remap any existing opsLead references from the old demo stylist ids to the new Ops Lead roster
  const newTaylor = state.opsLeads.find(o=>o.name==='Taylor');
  const newAng = state.opsLeads.find(o=>o.name==='Ang');
  for(const cid of Object.keys(state.taskCache)){
    let touched = false;
    state.taskCache[cid].forEach(t=>{
      if(oldTaylorBrams && t.opsLead===oldTaylorBrams.id && newTaylor){ t.opsLead = newTaylor.id; touched=true; }
      if(oldAngSalerno && t.opsLead===oldAngSalerno.id && newAng){ t.opsLead = newAng.id; touched=true; }
      if(!Array.isArray(t.methodUsed)) { t.methodUsed = t.methodUsed ? [t.methodUsed] : []; touched=true; }
    });
    if(touched) await saveClientTasks(cid);
  }

  // 5. Drop the two placeholder demo clients — the real roster already includes actual Aerie/Aeropostale entries
  state.clients = state.clients.filter(c=>c.name!=='Aerie (example)' && c.name!=='Aeropostale (example)');
  await storeSet('clients', state.clients);

  // 6. Create a folder (full year of core-list tasks) for every real client
  const toCreate = REAL_CLIENT_ROSTER.filter(name=>!state.clients.some(c=>c.name===name));
  let done = 0;
  for(const name of toCreate){
    showBootProgress(`Creating client folder: ${name}`, done, toCreate.length);
    const opsLeadName = CLIENT_OPS_LEAD_MAP[name] || '';
    const opsLeadObj = opsLeadName ? state.opsLeads.find(o=>o.name===opsLeadName) : null;
    const c = { id:uid(), name, year:2026, opsLead: opsLeadObj ? opsLeadObj.id : '' };
    state.clients.push(c);
    const tasks = generateYearTasks(c.id, c.year, c.opsLead);
    state.taskCache[c.id] = tasks;
    await saveClientTasks(c.id);
    done++;
  }
  await storeSet('clients', state.clients);

  await storeSet('migration_real_data_v1', true);
}

async function applyClientOpsLeadMigration(){
  const already = await storeGet('migration_client_opslead_v1');
  if(already) return;
  let changed = false;
  state.clients.forEach(c=>{
    if(c.opsLead) return; // don't clobber anything already assigned
    const opsLeadName = CLIENT_OPS_LEAD_MAP[c.name];
    if(opsLeadName){
      const o = state.opsLeads.find(o=>o.name===opsLeadName);
      if(o){ c.opsLead = o.id; changed = true; }
    } else if(c.opsLead===undefined){
      c.opsLead = '';
      changed = true;
    }
  });
  if(changed) await storeSet('clients', state.clients);
  await storeSet('migration_client_opslead_v1', true);
}

async function applyTrainingImportMigration(){
  const already = await storeGet('migration_training_import_v1');
  if(already) return;

  showBootProgress('Importing training matrix…');

  // "Macy's" (no suffix) appears in the training data but wasn't part of the original
  // client roster (only the Beauty/Home/Big Kids/Men/Women variants were) — add it so
  // that real training data isn't dropped.
  if(!state.clients.some(c=>c.name==="Macy's")){
    const c = { id:uid(), name:"Macy's", year:2026, opsLead:'' };
    state.clients.push(c);
    const tasks = generateYearTasks(c.id, c.year, '');
    state.taskCache[c.id] = tasks;
    await saveClientTasks(c.id);
    await storeSet('clients', state.clients);
  }

  let added = 0;
  TRAINING_IMPORT_DATA.forEach(([stylistName, clientName, taskType])=>{
    const stylist = state.stylists.find(s=>s.name===stylistName);
    const client = state.clients.find(c=>c.name===clientName);
    if(!stylist || !client) return;
    if(!isTrained(stylist.id, client.id, taskType)){
      state.trainingMatrix.push({id:uid(), stylistId:stylist.id, clientId:client.id, taskType});
      added++;
    }
  });
  if(added>0) await saveTrainingMatrix();

  await storeSet('migration_training_import_v1', true);
}

async function applyClientDataCorrectionsMigration(){
  const already = await storeGet('migration_corrections_v1');
  if(already) return;

  showBootProgress('Applying client roster corrections…');

  function addTraining(stylistName, clientName, taskType){
    const stylist = state.stylists.find(s=>s.name===stylistName);
    const client = state.clients.find(c=>c.name===clientName);
    if(!stylist || !client) return;
    if(!isTrained(stylist.id, client.id, taskType)){
      state.trainingMatrix.push({id:uid(), stylistId:stylist.id, clientId:client.id, taskType});
    }
  }

  async function removeClientEntirely(clientName){
    const c = state.clients.find(c=>c.name===clientName);
    if(!c) return;
    state.clients = state.clients.filter(x=>x.id!==c.id);
    state.trainingMatrix = state.trainingMatrix.filter(e=>e.clientId!==c.id);
    delete state.taskCache[c.id];
    await storeDelete('tasks:'+c.id);
  }

  // 1. The stylists trained under plain "Macy's" are actually trained on
  //    Macy's - Men and Macy's - Women, for OOS and Styling only.
  const macysStylists = ['Aleksandar','Hristijan','Iskra','Iva','Jordan','Marko','Natasha','Nikki','Njomeza','Sara','Tea','Vera','Veronika','Zhaklina'];
  macysStylists.forEach(name=>{
    ['Macy\'s - Men','Macy\'s - Women'].forEach(client=>{
      ['OOS','Styling'].forEach(type=>addTraining(name, client, type));
    });
  });
  await removeClientEntirely("Macy's");

  // 2. Macy's - Big Kids: Natasha and Njomeza, OOS and Styling.
  ['Natasha','Njomeza'].forEach(name=>{
    ['OOS','Styling'].forEach(type=>addTraining(name, "Macy's - Big Kids", type));
  });

  // 3. Sugar and Jade: Jina, all task types used across the training matrix.
  const ALL_SHEET_TASK_TYPES = ['Featured Shops','Galleries','Gallery QA & OOS','Matchbacks','Metadata','OOS','Priority Outfitting','QA','STM','STM OOS','Sample Outfits','Styling','Tagging'];
  ALL_SHEET_TASK_TYPES.forEach(type=>addTraining('Jina','Sugar and Jade', type));

  // 4. JCPenney - Kids/Men/Women: same stylists as JCPenney (Apparel), OOS and Styling only.
  const jcpStylists = ['Iskra','Ivona','Jina','Sara','Tatiana','Tea','Zhaklina'];
  jcpStylists.forEach(name=>{
    ['JCPenney - Kids','JCPenney - Men','JCPenney - Women'].forEach(client=>{
      ['OOS','Styling'].forEach(type=>addTraining(name, client, type));
    });
  });

  // 5. Discontinued clients — remove entirely.
  for(const name of ['Fanatics','Life Style Sports','Liverpool LA','Magnolia','mnml']){
    await removeClientEntirely(name);
  }

  await storeSet('clients', state.clients);
  await saveTrainingMatrix();
  await storeSet('migration_corrections_v1', true);
}

async function applySegmentSubfolderMigration(){
  const already = await storeGet('migration_segment_subfolders_v1');
  if(already) return;

  // Group the flat SEGMENT_SUBFOLDER_DATA rows by their base (merged) client
  const byBase = {};
  SEGMENT_SUBFOLDER_DATA.forEach(([base, newName, rate, stylingMethod, oosMethod])=>{
    (byBase[base] = byBase[base] || []).push({newName, rate, stylingMethod, oosMethod});
  });

  const baseNames = Object.keys(byBase);
  let done = 0;
  for(const baseName of baseNames){
    showBootProgress(`Splitting ${baseName} into segments…`, done, baseNames.length);
    const baseClient = state.clients.find(c=>c.name===baseName);
    if(!baseClient){ done++; continue; }

    // carry over ops lead + any training-matrix assignments from the merged client
    const baseOpsLead = baseClient.opsLead || '';
    const baseTrainingEntries = state.trainingMatrix.filter(e=>e.clientId===baseClient.id);

    for(const seg of byBase[baseName]){
      if(state.clients.some(c=>c.name===seg.newName)) continue; // already created
      const c = { id:uid(), name:seg.newName, year:2026, opsLead:baseOpsLead };
      state.clients.push(c);
      const tasks = generateYearTasks(c.id, c.year, baseOpsLead);
      tasks.forEach(t=>{
        if(t.taskType==='Styling'){
          t.primaryMethod = seg.stylingMethod;
          if(seg.rate!==null) t.rate = seg.rate;
        }
        if(t.taskType==='OOS' && seg.oosMethod){
          t.primaryMethod = seg.oosMethod;
        }
      });
      state.taskCache[c.id] = tasks;
      await saveClientTasks(c.id);

      baseTrainingEntries.forEach(e=>{
        state.trainingMatrix.push({id:uid(), stylistId:e.stylistId, clientId:c.id, taskType:e.taskType});
      });
    }

    // remove the now-superseded merged client
    state.clients = state.clients.filter(c=>c.id!==baseClient.id);
    state.trainingMatrix = state.trainingMatrix.filter(e=>e.clientId!==baseClient.id);
    delete state.taskCache[baseClient.id];
    await storeDelete('tasks:'+baseClient.id);

    done++;
  }

  await storeSet('clients', state.clients);
  await saveTrainingMatrix();
  await storeSet('migration_segment_subfolders_v1', true);
}

async function applyOOS5MinAllocationMigration(){
  const already = await storeGet('migration_oos_5min_allocation_v1');
  if(already) return;

  const EXCLUDED_NAMES = new Set(['Anne Klein','Gym + Coffee','Lilac Blonde']);
  const today = fmtDate(new Date());
  const endDate = '2026-12-30';
  if(today > endDate){ await storeSet('migration_oos_5min_allocation_v1', true); return; } // window already passed
  const hours = round2(5/60);

  showBootProgress('Setting 5 min OOS allocation…');
  const eligibleClients = state.clients.filter(c=>!EXCLUDED_NAMES.has(c.name));
  let done = 0;
  for(const c of eligibleClients){
    showBootProgress('Setting 5 min OOS allocation…', done, eligibleClients.length);
    await ensureClientTasksLoaded(c.id);
    let touched = false;
    state.taskCache[c.id].forEach(t=>{
      if(t.taskType==='OOS' && t.dueDate>=today && t.dueDate<=endDate){
        const dow = parseDate(t.dueDate).getDay();
        if(dow===0 || dow===6) return; // weekdays only
        t.estimatedHours = hours;
        touched = true;
      }
    });
    if(touched) await saveClientTasks(c.id);
    done++;
  }

  // Auto-Assign in month-sized chunks so this stays responsive rather than one giant run
  let chunkStart = today;
  while(chunkStart<=endDate){
    const chunkEndCandidate = fmtDate(addDays(parseDate(chunkStart), 30));
    const chunkEnd = chunkEndCandidate < endDate ? chunkEndCandidate : endDate;
    showBootProgress(`Auto-Assigning ${chunkStart} to ${chunkEnd}…`);

}

// Start of "last month" relative to today — the active/archive boundary.
function archiveCutoffDate(){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth()-1, 1);
  return fmtDate(d);
}

async function ensureClientTasksLoaded(clientId){
  if(state.taskCache[clientId]) return state.taskCache[clientId];
  let tasks = await storeGet('tasks:'+clientId);
  if(!tasks) tasks = [];
  tasks.forEach(t=>{ t.dayOfWeek = dayOfWeekFromDate(t.dueDate); if(!Array.isArray(t.methodUsed)) t.methodUsed = t.methodUsed ? [t.methodUsed] : []; if(!Array.isArray(t.tags)) t.tags = t.tags ? [t.tags] : []; });

  // Self-maintaining archive: every time this client's tasks are touched,
  // anything older than last month moves out to a separate archive key.
  // Nothing is deleted — just kept out of the everyday active payload.
  const cutoff = archiveCutoffDate();
  const toArchive = tasks.filter(t=>t.dueDate && t.dueDate<cutoff);
  if(toArchive.length>0){
    const active = tasks.filter(t=>!(t.dueDate && t.dueDate<cutoff));
    const existingArchive = (await storeGet('archive:'+clientId)) || [];
    await storeSet('archive:'+clientId, existingArchive.concat(toArchive));
    await storeSet('tasks:'+clientId, active);
    tasks = active;
  }

  state.taskCache[clientId] = tasks;
  return tasks;
}

async function ensureAllTasksLoaded(){
  const ids = [...state.clients.map(c=>c.id), INTERNAL_ID];
  for(const id of ids){ await ensureClientTasksLoaded(id); }
}

/* ============================= ON-DEMAND TASK GENERATION ============================= */
// Task types driven by a monthly goal on Goal Planning, and by a repeating daily amount.
const MONTHLY_GOAL_TYPES = ['Styling','STM'];
const DAILY_AMOUNT_TYPES = ['OOS','STM OOS'];
const RECURRING_DEFAULT_TYPES = ['Gallery QA & OOS','QA'];
// How far ahead daily-amount and recurring tasks are kept generated. Extended
// automatically once a day when the app loads.
const ROLLING_HORIZON_DAYS = 56;
function rollingHorizonEnd(){ return fmtDate(addDays(new Date(), ROLLING_HORIZON_DAYS)); }

// True when someone has actually worked on / edited the task, so it must never be
// auto-deleted. Targets, assignments and estimated hours don't count — those are
// filled in automatically by Goal Planning and Auto-Assign.
function taskHasWork(t){
  const filled = v => v!==undefined && v!==null && String(v).trim()!=='';
  return filled(t.actualTimeSpent) || filled(t.totalCompleted) || filled(t.remaining) ||
    filled(t.comments) || (t.status && t.status!=='Not Started') ||
    (Array.isArray(t.tags) && t.tags.length>0) || (Array.isArray(t.methodUsed) && t.methodUsed.length>0) ||
    (t.custom && Object.values(t.custom).some(filled));
}

function isWorkday(dateStr, taskType){
  const dow = parseDate(dateStr).getDay();
  return dow!==0 && dow!==6 && !isHoliday(dateStr, taskType);
}

function workdaysBetween(fromStr, toStr, taskType){
  const out = [];
  if(!fromStr || !toStr || fromStr>toStr) return out;
  let d = parseDate(fromStr);
  const end = parseDate(toStr);
  while(d<=end){ const ds = fmtDate(d); if(isWorkday(ds, taskType)) out.push(ds); d = addDays(d,1); }
  return out;
}

// Rate / primary method / ops lead / estimated hours to copy onto a newly
// generated task: the client's most recent task of that type, else the saved
// defaults, else the original rate/method import tables, else the client's ops lead.
function taskTemplateFor(clientId, taskType){
  const client = state.clients.find(c=>c.id===clientId) || {};
  const tpl = { rate:'', primaryMethod:'', opsLead: client.opsLead || '', estimatedHours:'' };
  const saved = state.taskDefaults[clientId] && state.taskDefaults[clientId][taskType];
  if(saved) Object.keys(tpl).forEach(k=>{ if(saved[k]!==undefined && saved[k]!=='') tpl[k] = saved[k]; });
  const latest = (state.taskCache[clientId]||[])
    .filter(t=>t.taskType===taskType && t.dueDate)
    .sort((a,b)=>b.dueDate.localeCompare(a.dueDate))[0];
  if(latest){
    if(latest.rate!=='' && latest.rate!==undefined) tpl.rate = latest.rate;
    if(latest.primaryMethod) tpl.primaryMethod = latest.primaryMethod;
    if(latest.opsLead) tpl.opsLead = latest.opsLead;
  }
  if(tpl.rate==='' && taskType==='Styling'){
    const row = STYLING_RATE_METHOD_DATA.find(r=>r[0]===client.name);
    if(row){ if(row[1]!==null) tpl.rate = row[1]; if(!tpl.primaryMethod) tpl.primaryMethod = row[2]; }
  }
  if(!tpl.primaryMethod && taskType==='OOS'){
    const row = OOS_METHOD_DATA.find(r=>r[0]===client.name);
    if(row) tpl.primaryMethod = row[1];
  }
  return tpl;
}

// Remembers each client + type's rate / method / ops lead / estimated hours before
// the old placeholder tasks are removed, so newly generated tasks inherit them.
// Each field comes from the latest-dated task that actually has a value for it.
function captureTaskDefaults(clientId){
  const byType = {};
  const sorted = (state.taskCache[clientId]||[]).filter(t=>t.taskType && t.dueDate).sort((a,b)=>b.dueDate.localeCompare(a.dueDate));
  sorted.forEach(t=>{
    const d = byType[t.taskType] = byType[t.taskType] || { rate:'', primaryMethod:'', opsLead:'', estimatedHours:'' };
    const filled = v => v!==undefined && v!==null && v!=='';
    if(!filled(d.rate) && filled(t.rate)) d.rate = t.rate;
    if(!filled(d.primaryMethod) && filled(t.primaryMethod)) d.primaryMethod = t.primaryMethod;
    if(!filled(d.opsLead) && filled(t.opsLead)) d.opsLead = t.opsLead;
    // a fixed time allocation (e.g. OOS's 5 min) only matters when there's no rate to derive hours from
    if(!filled(d.estimatedHours) && !filled(t.rate) && filled(t.estimatedHours) && !filled(t.startingTarget)) d.estimatedHours = t.estimatedHours;
  });
  if(!Object.keys(byType).length) return;
  state.taskDefaults[clientId] = state.taskDefaults[clientId] || {};
  Object.keys(byType).forEach(tt=>{ const d = byType[tt]; if(d.rate!=='') d.estimatedHours = ''; state.taskDefaults[clientId][tt] = d; });
}

// Creates a task for each date that doesn't already have one of this client + type.
// Returns the dates that were created.
function ensureTasksForDates(clientId, taskType, dates, extra){
  const cache = state.taskCache[clientId];
  const existing = new Set(cache.filter(t=>t.taskType===taskType).map(t=>t.dueDate));
  const tpl = taskTemplateFor(clientId, taskType);
  const created = [];
  dates.forEach(ds=>{
    if(existing.has(ds)) return;
    cache.push(makeTask(Object.assign({ clientId, taskType, dueDate:ds, rate:tpl.rate, primaryMethod:tpl.primaryMethod,
      opsLead:tpl.opsLead, estimatedHours:tpl.estimatedHours }, extra||{})));
    existing.add(ds);
    created.push(ds);
  });
  return created;
}

// Removes tasks matching `match` unless someone has worked on them. Tasks that
// can't be removed get their Starting Target cleared instead. Returns # removed.
function removeUntouchedTasks(clientId, match){
  const before = state.taskCache[clientId].length;
  state.taskCache[clientId] = state.taskCache[clientId].filter(t=>{
    if(!match(t)) return true;
    if(taskHasWork(t)){ t.startingTarget = ''; return true; }
    return false;
  });
  return before - state.taskCache[clientId].length;
}

// Sets the daily Starting Target on every task of this type across the given dates
// (days already split across stylists share the amount instead of duplicating it).
function setDailyTargets(clientId, taskType, dates, amount){
  const dateSet = new Set(dates);
  const byDate = {};
  state.taskCache[clientId].forEach(t=>{
    if(t.taskType===taskType && dateSet.has(t.dueDate)) (byDate[t.dueDate] = byDate[t.dueDate] || []).push(t);
  });
  Object.keys(byDate).forEach(ds=>applyDayStartingTarget(byDate[ds], amount));
}

async function saveRecurringRules(){ await storeSet('recurring_rules', state.recurringRules); }
async function saveTaskDefaults(){ await storeSet('task_defaults', state.taskDefaults); }

// Brings one client's daily-amount tasks (OOS / STM OOS) in line with its amount,
// from today through the rolling horizon. Returns {created, removed}.
async function syncDailyAmountTasks(clientId, taskType){
  await ensureClientTasksLoaded(clientId);
  const today = fmtDate(new Date());
  const horizon = rollingHorizonEnd();
  const amt = state.dailyAmounts[taskType] && state.dailyAmounts[taskType][clientId];
  const amount = parseFloat(amt);
  let created = [], removed = 0;
  if(!amount || amount<=0){
    removed = removeUntouchedTasks(clientId, t=>t.taskType===taskType && t.dueDate>=today && !t.recurringRuleId && !t.manual);
  } else {
    const dates = workdaysBetween(today, horizon, taskType);
    created = ensureTasksForDates(clientId, taskType, dates, { generatedBy:'daily' });
    setDailyTargets(clientId, taskType, dates, amount);
  }
  await saveClientTasks(clientId);
  return { created, removed };
}

/* ---------- Recurring Tasks schedules ---------- */
const RECURRING_FREQUENCIES = [
  ['weekly','Every week'],
  ['biweekly','Every 2 weeks'],
  ['monthly_date','Monthly on a date'],
  ['monthly_nth','Monthly on a weekday (e.g. 1st Monday)'],
];
const WEEKDAY_CHOICES = [[1,'Mon'],[2,'Tue'],[3,'Wed'],[4,'Thu'],[5,'Fri']];
const NTH_CHOICES = [[1,'1st'],[2,'2nd'],[3,'3rd'],[4,'4th'],[-1,'Last']];

function nextWorkdayOnOrAfter(dateStr, taskType){
  let d = parseDate(dateStr);
  for(let i=0;i<14;i++){ const ds = fmtDate(d); if(isWorkday(ds, taskType)) return ds; d = addDays(d,1); }
  return dateStr;
}

// All dates the rule lands on between fromStr and toStr (inclusive). Weekly rules
// skip holidays; monthly rules that land on a weekend/holiday move to the next workday.
function recurringRuleDates(rule, fromStr, toStr){
  const start = rule.startDate && rule.startDate>fromStr ? rule.startDate : fromStr;
  const end = rule.endDate && rule.endDate<toStr ? rule.endDate : toStr;
  if(start>end) return [];
  const out = new Set();
  if(rule.frequency==='weekly' || rule.frequency==='biweekly'){
    const days = (rule.weekdays||[]).map(Number);
    const anchor = startOfWeek(parseDate(rule.startDate || start));
    let d = parseDate(start);
    const endD = parseDate(end);
    while(d<=endD){
      const ds = fmtDate(d);
      if(days.includes(d.getDay()) && isWorkday(ds, rule.taskType)){
        const weeks = Math.round((startOfWeek(d) - anchor) / (7*86400000));
        if(rule.frequency==='weekly' || weeks%2===0) out.add(ds);
      }
      d = addDays(d,1);
    }
  } else {
    // walk month by month, starting a month early so a shifted date can still land in range
    let m = new Date(parseDate(start).getFullYear(), parseDate(start).getMonth()-1, 1);
    const endD = parseDate(end);
    while(m<=endD){
      const y = m.getFullYear(), mi = m.getMonth();
      let target = null;
      if(rule.frequency==='monthly_date'){
        const day = Math.min(parseInt(rule.dayOfMonth)||1, daysInMonth(y, mi));
        target = fmtDate(new Date(y, mi, day));
      } else {
        const wd = parseInt(rule.nthWeekday)||1, nth = parseInt(rule.nth)||1;
        if(nth===-1){
          let d = new Date(y, mi, daysInMonth(y, mi));
          while(d.getDay()!==wd) d = addDays(d,-1);
          target = fmtDate(d);
        } else {
          let d = new Date(y, mi, 1);
          while(d.getDay()!==wd) d = addDays(d,1);
          target = fmtDate(addDays(d, 7*(nth-1)));
        }
      }
      const actual = nextWorkdayOnOrAfter(target, rule.taskType);
      if(actual>=start && actual<=end) out.add(actual);
      m = new Date(y, mi+1, 1);
    }
  }
  return [...out].sort();
}

function describeRecurringRule(r){
  const dayNames = {0:'Sun',1:'Mon',2:'Tue',3:'Wed',4:'Thu',5:'Fri',6:'Sat'};
  if(r.frequency==='weekly' || r.frequency==='biweekly'){
    const days = (r.weekdays||[]).map(Number).sort().map(d=>dayNames[d]).join(', ') || 'no days picked';
    return `${r.frequency==='weekly'?'Every week':'Every 2 weeks'} on ${days}`;
  }
  if(r.frequency==='monthly_date') return `Monthly on day ${r.dayOfMonth} (next workday if it falls on a weekend/holiday)`;
  const nth = (NTH_CHOICES.find(n=>n[0]===parseInt(r.nth))||[0,'?'])[1];
  return `Monthly on the ${nth} ${dayNames[parseInt(r.nthWeekday)]}`;
}

// Generates a rule's tasks from today through the rolling horizon.
async function syncRecurringRuleTasks(rule){
  await ensureClientTasksLoaded(rule.clientId);
  const today = fmtDate(new Date());
  const dates = recurringRuleDates(rule, today, rollingHorizonEnd());
  const extra = { generatedBy:'recurring', recurringRuleId: rule.id };
  if(rule.hours!=='' && rule.hours!==undefined && rule.hours!==null) extra.estimatedHours = parseFloat(rule.hours)||'';
  const created = ensureTasksForDates(rule.clientId, rule.taskType, dates, extra);
  if(rule.target!=='' && rule.target!==undefined && rule.target!==null){
    const amt = parseFloat(rule.target)||0;
    state.taskCache[rule.clientId].forEach(t=>{
      if(t.recurringRuleId===rule.id && created.includes(t.dueDate)){
        t.startingTarget = amt;
        const rate = parseFloat(t.rate);
        if((rule.hours===''||rule.hours===undefined) && !isNaN(rate) && rate) t.estimatedHours = round2(amt/rate);
      }
    });
  }
  if(created.length) await saveClientTasks(rule.clientId);
  return created;
}

async function removeRecurringRuleFutureTasks(rule){
  await ensureClientTasksLoaded(rule.clientId);

// Once a day on load: keep daily-amount and recurring tasks generated through the
// rolling horizon, then Auto-Assign only the newly created days.
async function extendRollingTasks(force){
  const today = fmtDate(new Date());
  const last = await storeGet('rolling_tasks_extended_on');
  if(!force && last===today) return null;
  let minDate = null, maxDate = null;
  const note = ds=>{ if(!minDate||ds<minDate) minDate=ds; if(!maxDate||ds>maxDate) maxDate=ds; };
  const jobs = [];
  DAILY_AMOUNT_TYPES.forEach(tt=>{
    Object.keys(state.dailyAmounts[tt]||{}).forEach(cid=>{
      if(state.clients.some(c=>c.id===cid) && parseFloat(state.dailyAmounts[tt][cid])>0) jobs.push({kind:'daily', cid, tt});
    });
  });
  state.recurringRules.forEach(r=>{ if(state.clients.some(c=>c.id===r.clientId)) jobs.push({kind:'rule', rule:r}); });
  let done = 0;
  for(const j of jobs){
    showBootProgress('Scheduling upcoming daily and recurring tasks…', done, jobs.length);
    const created = j.kind==='daily' ? (await syncDailyAmountTasks(j.cid, j.tt)).created : await syncRecurringRuleTasks(j.rule);
    created.forEach(note);
    done++;
  }
  let result = null;
  if(minDate){
    showBootProgress('Auto-Assigning newly scheduled tasks…');
    result = await runAutoAssign(minDate, maxDate);
  }
  await storeSet('rolling_tasks_extended_on', today);
  return result;
}

// One-time switch to on-demand tasks: removes every placeholder nobody has worked on
// (active and archived), then regenerates tasks for monthly goals already entered
// (this month onward), and converts this month's OOS goals into daily amounts.
async function applyGoalDrivenTasksMigration(){
  const already = await storeGet('migration_goal_driven_tasks_v1');
  if(already) return;
  const clients = state.clients;
  let done = 0;
  const BATCH = 8;
  for(let i=0;i<clients.length;i+=BATCH){
    await Promise.all(clients.slice(i,i+BATCH).map(async c=>{
      await ensureClientTasksLoaded(c.id);
      captureTaskDefaults(c.id);
      state.taskCache[c.id] = state.taskCache[c.id].filter(taskHasWork);
      await saveClientTasks(c.id);
      const archived = await storeGet('archive:'+c.id);
      if(archived && archived.length){
        const kept = archived.filter(taskHasWork);
        if(kept.length!==archived.length) await storeSet('archive:'+c.id, kept);
      }
    }));
    done = Math.min(clients.length, i+BATCH);
    showBootProgress('Removing empty placeholder tasks…', done, clients.length);
  }
  state.archiveLoaded = false; state.archiveCache = {};
  await saveTaskDefaults();

  // This month's OOS monthly goals become a daily amount (goal ÷ this month's workdays).
  const curMonth = fmtDate(new Date()).slice(0,7);
  const oosGoals = (state.monthlyGoals[curMonth] && state.monthlyGoals[curMonth]['OOS']) || {};
  state.dailyAmounts['OOS'] = state.dailyAmounts['OOS'] || {};
  Object.keys(oosGoals).forEach(cid=>{
    const g = parseFloat(oosGoals[cid]);
    const wd = weekdayDatesInMonth(curMonth, 'OOS').length;
    if(g>0 && wd>0 && state.dailyAmounts['OOS'][cid]===undefined) state.dailyAmounts['OOS'][cid] = Math.ceil(g/wd);
  });
  await saveDailyAmounts();

  // Regenerate tasks for the monthly goals already entered, this month onward.
  const months = Object.keys(state.monthlyGoals).filter(mk=>mk>=curMonth).sort();
  const jobs = [];
  months.forEach(mk=>MONTHLY_GOAL_TYPES.forEach(tt=>{
    Object.keys((state.monthlyGoals[mk]||{})[tt]||{}).forEach(cid=>{
      if(parseFloat(state.monthlyGoals[mk][tt][cid])>0 && state.clients.some(c=>c.id===cid)) jobs.push({mk,tt,cid});
    });
  }));
  done = 0;
  for(const j of jobs){
    showBootProgress('Recreating tasks for monthly goals you already entered…', done, jobs.length);
    await applyMonthlyGoalTasks(j.cid, j.tt, j.mk, state.monthlyGoals[j.mk][j.tt][j.cid]);
    done++;
  }
  for(const mk of months){
    if(!jobs.some(j=>j.mk===mk)) continue;
    const [y,m] = mk.split('-').map(Number);
    showBootProgress(`Auto-Assigning ${monthLabel(mk)}…`);
    await runAutoAssign(`${mk}-01`, `${mk}-${String(daysInMonth(y,m-1)).padStart(2,'0')}`);
  }
  await storeSet('migration_goal_driven_tasks_v1', true);
  await storeDelete('rolling_tasks_extended_on'); // force daily/recurring generation right after
}

// Creates (or removes) one client's tasks for a monthly goal, and spreads the goal
// across that month's workdays. No Auto-Assign — callers run it afterward.
async function applyMonthlyGoalTasks(clientId, taskType, monthKey, goalValue){
  await ensureClientTasksLoaded(clientId);
  const weekdayDates = weekdayDatesInMonth(monthKey, taskType);
  const goalNum = parseFloat(goalValue) || 0;
  const dailyTarget = weekdayDates.length>0 ? Math.ceil(goalNum/weekdayDates.length) : 0;
  let created = [], removed = 0;
  const inMonth = t=>t.taskType===taskType && t.dueDate && t.dueDate.slice(0,7)===monthKey && !t.recurringRuleId && !t.manual;
  if(goalNum<=0){
    removed = removeUntouchedTasks(clientId, inMonth);
  } else {
    created = ensureTasksForDates(clientId, taskType, weekdayDates, { generatedBy:'goal' });
    const weekdaySet = new Set(weekdayDates);
    // weekend/holiday tasks in this month: drop if untouched, otherwise clear their target
    removed = removeUntouchedTasks(clientId, t=>inMonth(t) && !weekdaySet.has(t.dueDate));
    setDailyTargets(clientId, taskType, weekdayDates, dailyTarget);
  }
  await saveClientTasks(clientId);
  return { weekdayCount: weekdayDates.length, dailyTarget, created: created.length, removed };
}

async function updateTask(clientId, taskId, updates){
  const arr = state.taskCache[clientId];
  const idx = arr.findIndex(t=>t.id===taskId);
  if(idx===-1) return null;
  const prevTotalCompleted = arr[idx].totalCompleted;
  if(updates.custom) updates = Object.assign({}, updates, { custom: Object.assign({}, arr[idx].custom||{}, updates.custom) });
  const t = Object.assign(arr[idx], updates);
  if(updates.startingTarget!==undefined || updates.rate!==undefined){
    const startingTarget = parseFloat(t.startingTarget), rate = parseFloat(t.rate);
    if(!isNaN(startingTarget) && !isNaN(rate) && rate!==0){ t.estimatedHours = round2(startingTarget/rate); }
  }
  let cappedAt = null;
  if(updates.startingTarget!==undefined) cappedAt = applyStartingTargetCap(t);
  t.dayOfWeek = dayOfWeekFromDate(t.dueDate);
  await saveClientTasks(clientId);

  let rebalanceResult = null;
  if(updates.totalCompleted!==undefined && updates.totalCompleted!==prevTotalCompleted && t.dueDate){
    rebalanceResult = await rebalanceFutureDays(clientId, t.taskType, t.dueDate.slice(0,7));
  }
  return { cappedAt, rebalanceResult };
}

async function bulkUpdateTasks(taskIds, updates){
  // group by clientId so we touch each client's storage key once
  const byClient = {};
  taskIds.forEach(id=>{
    for(const cid of Object.keys(state.taskCache)){
      const t = state.taskCache[cid].find(x=>x.id===id);
      if(t){ (byClient[cid]=byClient[cid]||[]).push(t); break; }
    }
  });
  let cappedCount = 0;
  const rebalanceCombos = new Map(); // 'clientId|taskType|monthKey' -> {clientId,taskType,monthKey}
  for(const cid of Object.keys(byClient)){
    byClient[cid].forEach(t=>{
      Object.keys(updates).forEach(k=>{
        if(k==='tagsToAdd' || k==='tagsReplace') return;
        if(updates[k]!==''&&updates[k]!==null&&updates[k]!==undefined) t[k]=updates[k];
      });
      if(updates.tagsToAdd && updates.tagsToAdd.length){
        t.tags = updates.tagsReplace ? [...updates.tagsToAdd] : [...new Set([...(t.tags||[]), ...updates.tagsToAdd])];
      }
      if(updates.startingTarget!==undefined && updates.startingTarget!=='' || updates.rate!==undefined && updates.rate!==''){
        const startingTarget = parseFloat(t.startingTarget), rate = parseFloat(t.rate);
        if(!isNaN(startingTarget) && !isNaN(rate) && rate!==0) t.estimatedHours = round2(startingTarget/rate);
      }
      if(updates.startingTarget!==undefined && updates.startingTarget!==''){
        if(applyStartingTargetCap(t)!==null) cappedCount++;
      }
      if(updates.totalCompleted!==undefined && updates.totalCompleted!=='' && t.dueDate){
        const monthKey = t.dueDate.slice(0,7);
        rebalanceCombos.set(`${cid}|${t.taskType}|${monthKey}`, {clientId:cid, taskType:t.taskType, monthKey});
      }
      if(updates.dueDate) t.dayOfWeek = dayOfWeekFromDate(t.dueDate);
    });
    await saveClientTasks(cid);
  }
  let rebalancedCombos = 0;
  for(const {clientId, taskType, monthKey} of rebalanceCombos.values()){
    if(await rebalanceFutureDays(clientId, taskType, monthKey)) rebalancedCombos++;
  }
  return { cappedCount, rebalancedCombos };
}

// Removing a stylist isn't just deleting the roster row — it also clears them
// off every task they were assigned (so Workload View and Auto-Assign don't
// keep counting a departed stylist's capacity) and drops any Training Matrix
// entries for them, since those would otherwise be meaningless dangling refs.
async function removeStylistEverywhere(stylistId){
  const removedName = (state.stylists.find(s=>s.id===stylistId)||{}).name || 'Stylist';
  state.stylists = state.stylists.filter(s=>s.id!==stylistId);
  await saveStylists();

  const trainingRemoved = state.trainingMatrix.filter(e=>e.stylistId===stylistId).length;
  state.trainingMatrix = state.trainingMatrix.filter(e=>e.stylistId!==stylistId);
  await saveTrainingMatrix();

  const clearedTasks = [];
  const allClientIds = [...state.clients.map(c=>c.id), INTERNAL_ID];
  for(const cid of allClientIds){
    await ensureClientTasksLoaded(cid);
    let touched = false;
    state.taskCache[cid].forEach(t=>{
      if(t.assignedStylist===stylistId){
        t.assignedStylist = '';
        t.pinned = false; // on PTO — let Auto-Assign hand it to someone else
        touched = true;
        clearedTasks.push({ client:(state.clients.find(c=>c.id===t.clientId)||{}).name||'Internal / Non-client', taskType:t.taskType, date:t.dueDate });
      }
    });
    if(touched) await saveClientTasks(cid);
  }

  return { removedName, trainingRemoved, clearedTasks };
}

        <td>${(t.tags&&t.tags.length) ? t.tags.map(tag=>`<span class="chip tag-chip">${escapeHtml(tag)}</span>`).join('') : '—'}</td>
        <td><span class="comment-preview">${escapeHtml(t.comments||'—')}</span></td>
      </tr>`;
    }).join('')}

const WL_TYPE_COLORS = { 'Styling':'#E8859F', 'OOS':'#6FB7DE', 'STM':'#5FCF8E', 'STM OOS':'#4FB8B0', 'Gallery QA & OOS':'#B38BD6',
  'QA':'#E3B45A', 'PTO':'#A8A29E', 'Holiday':'#A8A29E', 'Meeting':'#8E9AAF' };
function wlTypeColor(tt){
  if(WL_TYPE_COLORS[tt]) return WL_TYPE_COLORS[tt];
  let h = 0; for(const ch of String(tt)) h = (h*31 + ch.charCodeAt(0)) % 360; // stable color for other types
  return `hsl(${h} 45% 62%)`;
}
function wlTypeRank(tt){ const order = ['Styling','STM','OOS','STM OOS','Gallery QA & OOS','QA']; const i = order.indexOf(tt); return i<0 ? 50 : i; }

/* ---------- Drag a workload card to another day and/or stylist ---------- */
function attachWorkloadBoardDrag(root){
  let lastDragEnd = 0;
  root.querySelectorAll('.wlb-card').forEach(card=>{
    const openTask = card.onclick; // set by the global [data-edit-task] handler
    card.onclick = e=>{ if(Date.now()-lastDragEnd < 400) return; if(e.target.closest('[data-wl-unpin]')) return; openTask && openTask(e); };
    card.onpointerdown = e=>{
      if(e.button!==undefined && e.button!==0) return;
      const startX = e.clientX, startY = e.clientY;
      let ghost = null, target = null;
      const move = ev=>{
        if(!ghost){
          if(Math.abs(ev.clientX-startX) + Math.abs(ev.clientY-startY) < 6) return; // still a click
          const r = card.getBoundingClientRect();
          ghost = card.cloneNode(true); ghost.classList.add('wlb-ghost');
          ghost.style.width = r.width+'px';
          document.body.appendChild(ghost);
          card.classList.add('wlb-dragging'); document.body.classList.add('is-dragging');
        }
        ghost.style.left = (ev.clientX+8)+'px'; ghost.style.top = (ev.clientY+8)+'px';
        const el = document.elementFromPoint(ev.clientX, ev.clientY);
        const day = el && el.closest ? el.closest('[data-wl-drop]') : null;
        if(day!==target){ if(target) target.classList.remove('wlb-drop'); target = day; if(target) target.classList.add('wlb-drop'); }
      };
      const up = async ()=>{
        document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
        if(!ghost) return; // plain click — the click handler opens the task
        ghost.remove(); card.classList.remove('wlb-dragging'); document.body.classList.remove('is-dragging');
        lastDragEnd = Date.now();
        if(!target) return;
        target.classList.remove('wlb-drop');
        const [stylistId, date] = target.dataset.wlDrop.split('|');
        const taskId = card.dataset.editTask, clientId = card.dataset.editClient;
        await ensureClientTasksLoaded(clientId);
        const t = state.taskCache[clientId].find(x=>x.id===taskId); if(!t) return;
        if(t.assignedStylist===stylistId && t.dueDate===date) return;
        const s = state.stylists.find(x=>x.id===stylistId);
        if(clientId!==INTERNAL_ID && !isTrained(stylistId, clientId, t.taskType)){
          const cn = (state.clients.find(c=>c.id===clientId)||{}).name||'this client';
          if(!confirm(`${s?s.name:'This stylist'} isn't trained on ${cn} — ${t.taskType}. Move it anyway?`)) return;
        }
        const dow = parseDate(date).getDay();
        if((dow===0 || dow===6) && !confirm('That\'s a weekend day. Move it anyway?')) return;
        await updateTask(clientId, taskId, { assignedStylist: stylistId, dueDate: date, pinned: true });
        state.wlLastMove = { taskId, text: `Moved ${t.taskType} for ${(state.clients.find(c=>c.id===clientId)||{}).name||'Internal'} to ${s?s.name:''}, ${date}. It's pinned 📌 so Auto-Assign won't move it back — click the pin to release it.` };
        render();
      };
      document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
    };
  });
  root.querySelectorAll('[data-wl-unpin]').forEach(el=>el.onclick = async e=>{
    e.stopPropagation();
    const [taskId, clientId] = el.dataset.wlUnpin.split('|');
    await updateTask(clientId, taskId, { pinned: false });
    state.wlLastMove = { text: 'Pin released — Auto-Assign can move this task again the next time it runs.' };
    render();
  });
  const dismiss = root.querySelector('[data-action="wl-dismiss-move"]'); if(dismiss) dismiss.onclick = ()=>{ state.wlLastMove = null; render(); };
}

function workloadBoardHtml(days){
  const flat = allTasksFlat();
  const dayStrs = days.map(fmtDate);
  const byKey = {};
  flat.forEach(t=>{
    if(!t.assignedStylist || !dayStrs.includes(t.dueDate)) return;
    (byKey[t.assignedStylist+'|'+t.dueDate] = byKey[t.assignedStylist+'|'+t.dueDate] || []).push(t);
  });
  const cname = t => t.clientId===INTERNAL_ID ? (t.taskType==='PTO'?'Time off':'Internal') : ((state.clients.find(c=>c.id===t.clientId)||{}).name||'—');
  const q = (state.wlSearch||'').toLowerCase();
  const collapsed = state.wlCollapsed || (state.wlCollapsed = {});
  const todayStr = fmtDate(new Date());
  const isWeekend = d => d.getDay()===0 || d.getDay()===6;
  const colTemplate = days.map(d=>isWeekend(d) ? 'minmax(64px,.35fr)' : 'minmax(170px,1fr)').join(' ');

  const head = `<div class="wlb-row wlb-head" style="grid-template-columns:200px ${colTemplate};">
    <div class="wlb-name-col"></div>
    ${days.map(d=>{ const ds = fmtDate(d); return `<div class="wlb-dayhead ${ds===todayStr?'today':''} ${isWeekend(d)?'weekend':''}">${DAY_NAMES[d.getDay()]} <span>${d.getDate()}</span></div>`; }).join('')}
  </div>`;

  const stylists = [...state.stylists].filter(s=>!q || s.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  const rows = stylists.map(s=>{
    const weekHrs = round2(dayStrs.reduce((sum,ds)=>sum + (byKey[s.id+'|'+ds]||[]).reduce((x,t)=>x+(parseFloat(t.estimatedHours)||0),0), 0));
    const isCollapsed = !!collapsed[s.id];
    const initials = s.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const cols = days.map(d=>{
      const ds = fmtDate(d);
      const tasks = (byKey[s.id+'|'+ds]||[]).slice().sort((a,b)=>wlTypeRank(a.taskType)-wlTypeRank(b.taskType) || cname(a).localeCompare(cname(b)));
      const hrs = round2(tasks.reduce((x,t)=>x+(parseFloat(t.estimatedHours)||0),0));
      const pct = s.capacity>0 ? hrs/s.capacity : 0;
      const cls = hrs<=0 ? 'cap-zero' : pct>=1 ? 'cap-over' : pct>=0.85 ? 'cap-near' : 'cap-open';
      const pill = `<button class="wlb-cap ${cls}" data-wl-cell="${s.id}|${ds}" title="${tasks.length} task(s) — click for the day's list">${hrs>0?formatHoursAsTime(hrs):'0h'}${isWeekend(d)?'':` <span>/ ${formatHoursAsTime(s.capacity)}</span>`}</button>`;
      const cards = isCollapsed ? '' : tasks.map(t=>{
        const est = formatHoursAsTime(t.estimatedHours) || '—';
        const act = parseFloat(t.actualTimeSpent);
        const over = !isNaN(act) && act > (parseFloat(t.estimatedHours)||0);
        const time = !isNaN(act) ? `<span class="${over?'over':''}">${formatHoursAsTime(act)}/${est}</span>` : est;
        const done = t.status==='Done';
        return `<div class="wlb-card ${done?'done':''} ${t.pinned?'pinned':''}" style="--c:${wlTypeColor(t.taskType)}" data-edit-task="${t.id}" data-edit-client="${t.clientId}" title="${escapeHtml(cname(t))} — ${escapeHtml(t.taskType)} · ${escapeHtml(t.status)}${t.startingTarget!==''&&t.startingTarget!==undefined?` · target ${t.startingTarget}`:''}">
          <div class="wlb-client">${escapeHtml(cname(t))}${t.pinned?`<span class="wlb-pin" data-wl-unpin="${t.id}|${t.clientId}" title="Pinned — Auto-Assign won't move this. Click to release.">📌</span>`:''}</div>
          <div class="wlb-line"><span class="wlb-type">${done?'✓ ':''}${escapeHtml(t.taskType)}</span><span class="wlb-time">${time}</span></div>
        </div>`;
      }).join('');
      return `<div class="wlb-day ${isWeekend(d)?'weekend':''} ${ds===todayStr?'today':''}" data-wl-drop="${s.id}|${ds}">${pill}${cards}</div>`;
    }).join('');
    return `<div class="wlb-row" style="grid-template-columns:200px ${colTemplate};">
      <div class="wlb-name-col">
        <button class="wlb-person" data-wl-collapse="${s.id}" title="${isCollapsed?'Show':'Hide'} tasks">
          <span class="wlb-avatar">${escapeHtml(initials)}</span>
          <span class="wlb-person-name">${escapeHtml(s.name)}<small>cap ${formatHoursAsTime(s.capacity)}/day</small></span>
          <span class="wlb-week">${weekHrs>0?formatHoursAsTime(weekHrs):'0h'}</span>
          <span class="wlb-caret">${isCollapsed?'▸':'▾'}</span>
        </button>
      </div>
      ${cols}
    </div>`;
  }).join('') || `<div class="empty">No stylists match "${escapeHtml(state.wlSearch)}".</div>`;

  const legend = ['Styling','STM','OOS','STM OOS','Gallery QA & OOS','QA'].map(tt=>`<span><span class="dot" style="background:${wlTypeColor(tt)}"></span>${escapeHtml(tt)}</span>`).join('');
  return `
    <div class="wlb-tools">
      <input type="text" id="wl-search" value="${escapeHtml(state.wlSearch||'')}" placeholder="Filter stylists…" style="max-width:220px;">
      <button class="btn secondary small" data-action="wl-expand-all">Expand all</button>
      <button class="btn secondary small" data-action="wl-collapse-all">Collapse all</button>
    </div>
    ${state.wlLastMove ? `<div class="banner" style="display:flex;justify-content:space-between;gap:10px;">${escapeHtml(state.wlLastMove.text)}<button class="close-x" style="position:static;" data-action="wl-dismiss-move">✕</button></div>` : ''}
    <div class="wlb-scroll"><div class="wlb">${head}${rows}</div></div>
    <div class="legend">${legend}<span>Drag a card to another day or stylist to reassign it (moved cards are pinned 📌 so Auto-Assign leaves them alone). Click a card to open it, or a day's hours for that day's list. Red time = actual over estimate.</span></div>`;
}

async function renderWorkload(){
  await ensureAllTasksLoaded();
  const days = [];
  const count = state.wl.rangeType==='month' ? 30 : 7;
  for(let i=0;i<count;i++) days.push(addDays(state.wl.anchor, i));

  const flat = allTasksFlat();
  const byStylistDay = {};
  const clientsByStylistDay = {};
  flat.forEach(t=>{
    if(!t.assignedStylist || !t.dueDate) return;
    const key = t.assignedStylist+'|'+t.dueDate;
    const hrs = parseFloat(t.estimatedHours)||0;
    byStylistDay[key] = (byStylistDay[key]||0) + hrs;
    const cName = t.clientId===INTERNAL_ID ? t.taskType : ((state.clients.find(c=>c.id===t.clientId)||{}).name||'—');
    (clientsByStylistDay[key] = clientsByStylistDay[key] || new Set()).add(cName);
  });

  const headerCells = days.map(d=>`<th>${DAY_NAMES[d.getDay()]}<br><span style="font-weight:400;color:var(--gray-light);">${d.getMonth()+1}/${d.getDate()}</span></th>`).join('');

  const rows = [...state.stylists].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>{
    const cells = days.map(d=>{
      const key = s.id+'|'+fmtDate(d);
      const hrs = round2(byStylistDay[key]||0);
      const pct = s.capacity>0 ? hrs/s.capacity : 0;
      let cls='cap-zero';
      if(hrs>0){
        cls = pct>=1 ? 'cap-over' : pct>=0.85 ? 'cap-near' : 'cap-open';
      }
      const barPct = Math.min(pct*100,100);
      const names = [...(clientsByStylistDay[key]||[])].sort((a,b)=>a.localeCompare(b));
      const shown = state.wl.rangeType==='month' ? [] : names.slice(0,3);
      const clientsHtml = names.length ? `<div class="wl-clients">${shown.map(n=>`<div>${escapeHtml(n)}</div>`).join('')}${names.length>shown.length?`<div class="wl-more">${shown.length?'+':''}${names.length-shown.length} client${names.length-shown.length===1?'':'s'}</div>`:''}</div>` : '';
      return `<td class="wl-cell ${cls}" data-wl-cell="${s.id}|${fmtDate(d)}" title="${escapeHtml(names.join(', '))}">
        <div class="wl-hrs">${hrs}</div>
        <div class="wl-bar"><div class="wl-bar-fill" style="width:${barPct}%"></div></div>
        ${clientsHtml}
      </td>`;
    }).join('');
    return `<tr><td class="stylist-col"><div class="stylist-name">${escapeHtml(s.name)}</div><div class="stylist-cap">cap ${s.capacity}h/day</div></td>${cells}</tr>`;
  }).join('');

  const rangeLabel = `${fmtDate(days[0])} – ${fmtDate(days[days.length-1])}`;

  return `
    <div class="view-header">
      <div>
        <div class="view-title">Workload View</div>
        <div class="view-sub">${state.wl.rangeType==='week' ? 'Every task each stylist is assigned, by day — client, task type and time estimate, with daily hours vs. capacity.' : 'Sum of estimated hours per stylist, per day, vs. their daily capacity. Switch to Week to see each task.'}</div>
      </div>
      <div style="display:flex;gap:8px;"><button class="btn secondary" data-action="export-workload">⤓ Export to Excel</button><button class="btn" data-action="open-add-task">+ Add Task</button></div>
    </div>
    <div class="wl-controls">
      <div class="wl-toggle">
        <button class="${state.wl.rangeType==='week'?'active':''}" data-wl-range="week">Week</button>
        <button class="${state.wl.rangeType==='month'?'active':''}" data-wl-range="month">Month</button>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn secondary small" data-action="wl-prev">← Prev</button>
        <button class="btn secondary small" data-action="wl-today">This week</button>
        <button class="btn secondary small" data-action="wl-next">Next →</button>
      </div>
      <div style="font-size:12.5px;color:var(--gray);align-self:center;">${rangeLabel}</div>
    </div>
    ${state.wl.rangeType==='week' ? workloadBoardHtml(days) : `    <div class="wl-scroll">
      <table class="wl-table">
        <thead><tr><th class="stylist-col">Stylist</th>${headerCells}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--sage);"></span>Under 85% capacity</span>
      <span><span class="dot" style="background:var(--amber);"></span>85–99% capacity</span>
      <span><span class="dot" style="background:var(--rose);"></span>At or over capacity</span>
      <span>Each cell lists the clients that stylist is working on that day (hover for the full list in Month view). Click a cell to see that day's tasks.</span>
    </div>`}
  `;
}

// SheetJS is loaded only the first time someone exports, so it doesn't slow page loads.
let xlsxLoading = null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!xlsxLoading) xlsxLoading = new Promise((res, rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ()=>res(window.XLSX);
    sc.onerror = ()=>{ xlsxLoading = null; rej(new Error('Could not load the Excel library')); };
    document.head.appendChild(sc);
  });
  return xlsxLoading;
}
function xlNum(v){ const n = parseFloat(v); return (v===''||v===null||v===undefined||isNaN(n)) ? (v===undefined||v===null?'':v) : n; }
function taskToExcelRow(t){
  const clientName = t.clientId===INTERNAL_ID ? 'Internal / Non-client' : ((state.clients.find(c=>c.id===t.clientId)||{}).name||'');
  const row = {
    'Client': clientName, 'Task Type': t.taskType||'', 'Due Date': t.dueDate||'', 'Day': t.dayOfWeek||'',
    'Stylist': t.assignedStylist ? stylistName(t.assignedStylist) : '', 'Ops Lead': ((state.opsLeads.find(o=>o.id===t.opsLead)||{}).name||''),
    'Status': t.status||'', 'Starting Target': xlNum(t.startingTarget), 'Remaining': xlNum(t.remaining), 'Total Completed': xlNum(t.totalCompleted),
    'Rate': xlNum(t.rate), 'Est. Hrs': xlNum(t.estimatedHours), 'Actual': xlNum(t.actualTimeSpent),
    'Primary Method': t.primaryMethod||'', 'Method Used': (t.methodUsed||[]).join(', '), 'Tags': (t.tags||[]).join(', '), 'Comments': t.comments||'',
  };
  (state.customFields||[]).forEach(f=>{ const v = t.custom && t.custom[f.id]; row[f.name] = f.type==='number' ? xlNum(v) : (v||''); });
  return row;
}
function xlSheet(XLSX, rows, header){
  const ws = XLSX.utils.json_to_sheet(rows, header ? {header} : undefined);
  const keys = header || (rows[0] ? Object.keys(rows[0]) : []);
  ws['!cols'] = keys.map(k=>({ wch: Math.min(48, Math.max(String(k).length, ...rows.slice(0,300).map(r=>String(r[k]??'').length)) + 2) }));
  if(keys.length) ws['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:Math.max(rows.length,1), c:keys.length-1}}) };
  return ws;
}
async function xlDownload(build, filename){
  let XLSX;
  try{ XLSX = await loadXLSX(); }catch(e){ alert('Excel export needs an internet connection to load — please try again.'); return; }
  const wb = XLSX.utils.book_new();
  build(XLSX, wb);
  XLSX.writeFile(wb, filename);
}
const xlTaskSort = (a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'') || ((state.clients.find(c=>c.id===a.clientId)||{}).name||'').localeCompare((state.clients.find(c=>c.id===b.clientId)||{}).name||'');
