/* ============================= EVENT HANDLING ============================= */
function attachGlobalHandlers(){
  const root = document.getElementById('root');

  root.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{ state.view = el.dataset.nav; render(); });
  const refreshBtn = root.querySelector('[data-action="refresh-all"]');
  if(refreshBtn) refreshBtn.onclick = async ()=>{ state.taskCache={}; state.loaded=false; await render(); };

  // Reports
  const reportMonthInput = root.querySelector('#report-month');
  if(reportMonthInput) reportMonthInput.onchange = async ()=>{
    state.reportMonth = reportMonthInput.value;
    const cutoff = archiveCutoffDate();
    if(state.reportMonth < cutoff.slice(0,7) && !state.archiveLoaded){
      const mainEl = document.getElementById('main');
      if(mainEl) mainEl.innerHTML = '<div class="loading">Loading historical data for this month…</div>';
      await ensureArchiveLoaded();
    }
    render();
  };
  const reportSearchInput = root.querySelector('#report-client-search');
  if(reportSearchInput) reportSearchInput.oninput = debounce(()=>{ state.reportClientSearch = reportSearchInput.value; render(); }, 300);
  const reportOpsLeadFilter = root.querySelector('#report-opslead-filter');
  if(reportOpsLeadFilter) reportOpsLeadFilter.onchange = ()=>{ state.reportOpsLeadFilter = reportOpsLeadFilter.value; render(); };
  root.querySelectorAll('[data-client-opslead]').forEach(el=>{
    el.onchange = async ()=>{
      const c = state.clients.find(c=>c.id===el.dataset.clientOpslead);
      if(c){
        c.opsLead = el.value;
        await storeSet('clients', state.clients);
        await applyOpsLeadToClientTasks(c.id, c.opsLead);
        render();
      }
    };
  });
  root.querySelectorAll('[data-client-goal]').forEach(el=>{
    el.onchange = async ()=>{
      const [type, clientId] = el.dataset.clientGoal.split('|');
      const monthKey = state.reportMonth;
      if(!state.monthlyGoals[monthKey]) state.monthlyGoals[monthKey] = {};
      if(!state.monthlyGoals[monthKey][type]) state.monthlyGoals[monthKey][type] = {};
      state.monthlyGoals[monthKey][type][clientId] = el.value;
      await saveMonthlyGoals();
      render();
    };
  });

  // Training & Auto-Assign
  const addTrainingBtn = root.querySelector('[data-action="add-training-entry"]');
  if(addTrainingBtn) addTrainingBtn.onclick = async ()=>{
    const stylistId = document.getElementById('tm-stylist').value;

      await ensureClientTasksLoaded(newClientId);
      state.taskCache[newClientId].push(moved);
      await saveClientTasks(newClientId);
    } else {
      const result = await updateTask(oldClientId, taskId, data);
      cappedAt = result ? result.cappedAt : null;
      rebalanceResult = result ? result.rebalanceResult : null;
    }
    state.modal=null; render();
    const messages = [];
    if(cappedAt!==null) messages.push(`Starting Target reduced to ${cappedAt} — this client is set to "Capped to Monthly Goal," and that's this day's share of the monthly goal.`);
    if(rebalanceResult && rebalanceResult.futureDaysCount>0) messages.push(`Remaining days rebalanced: ${round2(rebalanceResult.monthlyRemaining)} still needed this month, spread across ${rebalanceResult.futureDaysCount} remaining working day(s) → ${rebalanceResult.newDailyTarget}/day going forward.`);
    if(messages.length) alert(messages.join('\n\n'));
  };

  const bfUsedApply = document.getElementById('bf-used-apply');
  const bfUsedSelect = document.getElementById('bf-used');
  if(bfUsedApply && bfUsedSelect){ bfUsedApply.onchange = ()=>{ bfUsedSelect.disabled = !bfUsedApply.checked; }; }

  const saveBulkEdit = root.querySelector('[data-action="save-bulk-edit"]');
  if(saveBulkEdit) saveBulkEdit.onclick = async ()=>{
    const updates = {
      assignedStylist: document.getElementById('bf-stylist').value,
      opsLead: document.getElementById('bf-opslead').value,
      status: document.getElementById('bf-status').value,
      dueDate: document.getElementById('bf-duedate').value,
      primaryMethod: document.getElementById('bf-primary').value,
      startingTarget: document.getElementById('bf-target').value,
      rate: document.getElementById('bf-rate').value,
    };
    if(document.getElementById('bf-used-apply').checked){
      updates.methodUsed = Array.from(document.getElementById('bf-used').selectedOptions).map(o=>o.value);
    }
    const tagsInput = document.getElementById('bf-tags').value.trim();
    if(tagsInput){
      updates.tagsToAdd = [...new Set(tagsInput.split(',').map(s=>s.trim()).filter(Boolean))];
      updates.tagsReplace = document.getElementById('bf-tags-replace').checked;
    }
    saveBulkEdit.textContent='Applying…'; saveBulkEdit.disabled=true;
    const result = await bulkUpdateTasks([...state.selectedTaskIds], updates);
    state.selectedTaskIds.clear();
    state.modal=null; render();
    if(result && result.cappedCount>0){ alert(`${result.cappedCount} task(s) had their Starting Target reduced to that day's monthly-goal cap ("Capped to Monthly Goal" clients only).`); }
    if(result && result.rebalancedCombos>0){ alert(`${result.rebalancedCombos} client + task type combo(s) had their remaining working days rebalanced based on the new completions.`); }
  };
}

function debounce(fn, ms){ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); }; }

/* ============================= BOOT ============================= */
try{
  const saved = JSON.parse(localStorage.getItem('studio_ops_my_identity') || 'null');
  if(saved && saved.role && saved.id){ state.myRole = saved.role; state.myPersonId = saved.id; }
}catch(e){}
render();
</script>
