<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Styling Team Master Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20232B;
    --paper:#F7F5F1;
    --panel:#FFFFFF;
    --plum:#6B3F52;
    --plum-light:#8C5C71;
    --plum-dim:#F1E7EC;
    --sage:#5F7A68;
    --sage-dim:#E6EDE8;
    --amber:#B8791F;
    --amber-dim:#F7EBD6;
    --rose:#AE4038;
    --rose-dim:#F6E4E2;
    --line:#E4E0D8;
    --gray:#75787C;
    --gray-light:#A4A7AA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;}
  ::selection{background:var(--plum-dim);}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:13px;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  .app{display:flex;height:100vh;overflow:hidden;}

  /* Sidebar */
  .sidebar{width:216px;flex-shrink:0;background:var(--ink);color:#EFEAE3;display:flex;flex-direction:column;padding:22px 14px;}
  .brand{font-family:'Fraunces',serif;font-size:20px;font-weight:600;letter-spacing:.2px;padding:0 8px 4px;}
  .brand small{display:block;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:1.5px;color:#9FA6B2;text-transform:uppercase;margin-top:3px;}
  .nav{margin-top:28px;display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:#C9CCD3;background:none;border:none;text-align:left;font-size:13.5px;font-weight:500;transition:background .12s,color .12s;}
  .nav-item:hover{background:#2B303A;color:#fff;}
  .nav-item.active{background:var(--plum);color:#fff;}
  .nav-icon{width:16px;text-align:center;font-size:14px;}
  .sidebar-foot{margin-top:auto;padding:10px 10px 0;border-top:1px solid #33394480;}
  .sidebar-foot button{width:100%;background:none;border:1px solid #454C58;color:#C9CCD3;padding:7px 8px;border-radius:6px;font-size:12px;margin-top:8px;}
  .sidebar-foot button:hover{border-color:#7A8290;color:#fff;}
  .sync-status{font-size:10.5px;color:#8A909B;margin-top:10px;line-height:1.5;}

  /* Main */
  .main{flex:1;overflow-y:auto;padding:26px 34px 60px;}
  .view-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
  .view-title{font-size:24px;font-weight:600;}
  .view-sub{color:var(--gray);font-size:12.5px;margin-top:4px;}
  .btn{background:var(--plum);color:#fff;border:none;padding:9px 16px;border-radius:7px;font-size:13px;font-weight:600;letter-spacing:.1px;}
  .btn:hover{background:var(--plum-light);}
  .btn.secondary{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn.secondary:hover{border-color:var(--gray);}
  .btn.small{padding:5px 11px;font-size:12px;border-radius:6px;}
  .btn.ghost{background:none;color:var(--plum);border:none;padding:4px 6px;font-weight:600;}
  .btn.danger{background:var(--rose);}
  .btn.danger:hover{background:#8f342d;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--gray);font-weight:600;margin-bottom:4px;display:block;}
  select,.input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);}
  input[type=text],input[type=number],input[type=date],textarea{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%;}
  textarea{resize:vertical;min-height:56px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--plum-light);outline-offset:0;border-color:var(--plum-light);}

  table{border-collapse:collapse;width:100%;font-size:12.5px;}
  th{text-align:left;padding:8px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);border-bottom:1px solid var(--line);background:#FCFBF9;position:sticky;top:0;}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr.taskrow:hover{background:var(--plum-dim);cursor:pointer;}
  .empty{padding:40px 20px;text-align:center;color:var(--gray);}
  .empty h3{margin-bottom:6px;color:var(--ink);}

  .status-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .status-Not\ Started{background:#EDEBE6;color:#6B6B63;}
  .status-In\ Progress{background:var(--amber-dim);color:var(--amber);}
  .status-Incomplete{background:var(--rose-dim);color:var(--rose);}
  .status-Done{background:var(--sage-dim);color:var(--sage);}
  .status-Blocked{background:#EADCE0;color:#8C3B4A;}

  /* Client folders */
  .folder-layout{display:flex;gap:22px;align-items:flex-start;}
  .client-list{width:250px;flex-shrink:0;max-height:74vh;overflow-y:auto;}
  .client-list-item{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:500;display:flex;justify-content:space-between;align-items:center;}
  .client-list-item:hover{background:var(--plum-dim);cursor:pointer;}
  .client-list-item.active{background:var(--plum);color:#fff;}
  .client-list-item .count{font-size:10.5px;color:var(--gray-light);}
  .client-list-item.active .count{color:#E9DDE2;}
  .folder-main{flex:1;min-width:0;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap;}
  .tab{padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--gray);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
  .tab.active{color:var(--plum);border-bottom-color:var(--plum);}
  .month-accordion summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:12.5px;background:#FCFBF9;border-bottom:1px solid var(--line);list-style:none;display:flex;justify-content:space-between;}
  .month-accordion summary::-webkit-details-marker{display:none;}
  .month-accordion{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;}

  /* Workload grid */
  .wl-controls{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px;}
  .wl-toggle{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
  .wl-toggle button{border:none;background:#fff;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--gray);}
  .wl-toggle button.active{background:var(--plum);color:#fff;}
  .wl-scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;}
  .wl-table{border-collapse:separate;border-spacing:0;font-family:'JetBrains Mono',monospace;}
  .wl-table th{white-space:nowrap;background:#FCFBF9;}
  .wl-table th.stylist-col,.wl-table td.stylist-col{position:sticky;left:0;background:#fff;z-index:2;border-right:1px solid var(--line);font-family:'Inter',sans-serif;min-width:168px;}
  .wl-table th.stylist-col{background:#FCFBF9;z-index:3;}
  .wl-cell{min-width:74px;text-align:center;padding:6px 4px;cursor:pointer;}
  .wl-cell:hover{outline:2px solid var(--plum-light);outline-offset:-2px;}
  .wl-hrs{font-weight:700;font-size:13px;}
  .wl-bar{height:4px;border-radius:3px;background:#E9E6E0;margin-top:5px;overflow:hidden;}
  .wl-bar-fill{height:100%;border-radius:3px;}
  .cap-open .wl-hrs{color:var(--sage);}
  .cap-open .wl-bar-fill{background:var(--sage);}
  .cap-near .wl-hrs{color:var(--amber);}
  .cap-near .wl-bar-fill{background:var(--amber);}
  .cap-over .wl-hrs{color:var(--rose);}
  .cap-over .wl-bar-fill{background:var(--rose);}
  .cap-zero .wl-hrs{color:var(--gray-light);}
  .cap-zero .wl-bar-fill{background:transparent;}
  .stylist-name{font-weight:600;font-size:12.5px;}
  .stylist-cap{font-size:10.5px;color:var(--gray);font-family:'JetBrains Mono',monospace;}
  .legend{display:flex;gap:16px;margin-top:12px;font-size:11.5px;color:var(--gray);align-items:center;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(32,35,43,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;z-index:50;overflow-y:auto;}
  .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:26px 28px 24px;margin-bottom:5vh;}
  .modal h2{font-size:19px;margin-bottom:2px;}
  .modal-sub{color:var(--gray);font-size:12px;margin-bottom:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 14px;}
  .field{margin-bottom:2px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;border-top:1px solid var(--line);padding-top:16px;}
  .close-x{position:absolute;top:18px;right:22px;background:none;border:none;font-size:18px;color:var(--gray);}
  .modal{position:relative;}
  .hint{font-size:11px;color:var(--gray-light);margin-top:3px;}

  /* Settings */
  .settings-section{margin-bottom:30px;}
  .settings-section h3{font-size:15px;margin-bottom:4px;}
  .settings-section .view-sub{margin-bottom:14px;}
  .chip-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
  .chip{background:var(--plum-dim);color:var(--plum);padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .chip button{background:none;border:none;color:var(--plum);font-size:13px;line-height:1;padding:0;}
  .tag-chip{padding:2px 8px;font-size:10.5px;margin:1px 3px 1px 0;display:inline-block;}
  .add-chip-row{display:flex;gap:8px;margin-top:10px;max-width:340px;}

  .pagination{display:flex;justify-content:center;gap:6px;margin-top:14px;align-items:center;}
  .pagination button{border:1px solid var(--line);background:#fff;padding:5px 10px;border-radius:6px;font-size:12px;}
  .pagination button:disabled{opacity:.4;cursor:default;}
  .pagination span{font-size:12px;color:var(--gray);}

  .filters-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .filters-row .field{min-width:130px;}

  .comment-preview{color:var(--gray);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;}
  .loading{padding:60px;text-align:center;color:var(--gray);font-size:13px;}
  .banner{background:var(--amber-dim);color:#7A5313;border:1px solid #E6CB94;padding:10px 14px;border-radius:9px;font-size:12.5px;margin-bottom:18px;}
</style>

/* ============================= UTIL ============================= */
function uid(){ return 'id'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function fmtDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function dayOfWeekFromDate(s){ if(!s) return ''; return DAY_NAMES[parseDate(s).getDay()]; }
function startOfWeek(d){ const c=new Date(d); const day=c.getDay(); const diff=(day===0?-6:1)-day; c.setDate(c.getDate()+diff); c.setHours(0,0,0,0); return c; }
function addDays(d,n){ const c=new Date(d); c.setDate(c.getDate()+n); return c; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function round2(n){ return Math.round(n*100)/100; }
function formatHoursAsTime(hours){
  const h = parseFloat(hours);
  if(isNaN(h) || h===0) return '—';
  const totalMinutes = Math.round(h*60);
  const hh = Math.floor(totalMinutes/60);
  const mm = totalMinutes%60;
  if(hh===0) return `${mm}m`;
  if(mm===0) return `${hh}h`;
  return `${hh}h ${mm}m`;
}

// Remaining is its own field, not derived — it's meant to be pulled live from
// Metabase throughout the day (continuous re-pull, unlike Starting Target which
// freezes once pulled at each client's daily sync time). Until that connection
// exists, it's editable by hand like Starting Target.
function displayValue(v){ return (v!==''&&v!==undefined&&v!==null) ? v : '—'; }

async function storeSet(key,val){ try{ await window.storage.set(key, JSON.stringify(val), true); }catch(e){ console.error('storage set failed',key,e); } }
async function storeGet(key){ try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
async function storeDelete(key){ try{ await window.storage.delete(key, true); }catch(e){ /* ignore missing key */ } }

function defaultStylists(){

  const list=[];

  for(;i<=15;i++) list.push({id:uid(), name:specialNames[i] || `Stylist ${String(i).padStart(2,'0')}`, capacity:7});
  for(;i<=17;i++) list.push({id:uid(), name:specialNames[i] || `Stylist ${String(i).padStart(2,'0')}`, capacity:6});
  for(;i<=25;i++) list.push({id:uid(), name:specialNames[i] || `Stylist ${String(i).padStart(2,'0')}`, capacity:5});
  return list;
}

function makeTask(overrides){
  const base = {
    id:uid(), clientId:null, taskType:CORE_TYPES[0], assignedStylist:'', estimatedHours:'', actualTimeSpent:'',
    dueDate:'', opsLead:'', status:'Not Started', primaryMethod:'', startingTarget:'', remaining:'', totalCompleted:'', rate:'',
    methodUsed:[], tags:[], comments:'', autoSplitGroup:''
  };
  const t = Object.assign(base, overrides);
  if(!Array.isArray(t.methodUsed)) t.methodUsed = t.methodUsed ? [t.methodUsed] : [];
  if(!Array.isArray(t.tags)) t.tags = t.tags ? [t.tags] : [];
  t.dayOfWeek = dayOfWeekFromDate(t.dueDate);
  return t;
}

function generateYearTasks(clientId, year, opsLead){
  const tasks=[];
  CORE_TYPES.forEach(type=>{
    let d = new Date(year,0,1);
    while(d.getFullYear()===year){
      tasks.push(makeTask({clientId, taskType:type, dueDate:fmtDate(d), opsLead: opsLead||''}));
      d = addDays(d,1);
    }
  });
  return tasks;
}

function showBootProgress(message, done, total){

  root.innerHTML = `<div class="loading">
    <div style="font-weight:600;margin-bottom:8px;color:var(--ink);">${escapeHtml(message)}</div>
    ${total ? `<div>${done} of ${total}</div>
    <div style="margin:14px auto 0;height:6px;width:280px;background:#E9E6E0;border-radius:4px;overflow:hidden;">
      <div style="height:100%;background:var(--plum);width:${pct}%;"></div>

}

async function applyRealDataMigration(){
  const already = await storeGet('migration_real_data_v1');
  if(already) return;

  showBootProgress('Setting up stylists, ops leads, and method options…');

  // capture old ids for opsLead remapping before we replace the stylist roster
  const oldTaylorBrams = state.stylists.find(s=>s.name==='Taylor Brams');
  const oldAngSalerno = state.stylists.find(s=>s.name==='Ang Salerno');

  // 1. Real stylist roster (name + daily capacity)
  state.stylists = REAL_STYLIST_ROSTER.map(([name,capacity])=>({id:uid(), name, capacity}));
  await saveStylists();

  // 2. Ops Leads — separate roster, not tied to stylist capacity
  state.opsLeads = REAL_OPS_LEAD_NAMES.map(name=>({id:uid(), name}));
  await storeSet('ops_leads', state.opsLeads);

  // 3. Method options — same real 8-option list for both Primary Method and Method Used
  state.methodOptions = { primary:[...REAL_METHOD_OPTIONS], used:[...REAL_METHOD_OPTIONS] };
  await saveMethodOptions();

  // 4. Remap any existing opsLead references from the old demo stylist ids to the new Ops Lead roster
  const newTaylor = state.opsLeads.find(o=>o.name==='Taylor');
  const newAng = state.opsLeads.find(o=>o.name==='Ang');
  for(const cid of Object.keys(state.taskCache)){
    let touched = false;
    state.taskCache[cid].forEach(t=>{
      if(oldTaylorBrams && t.opsLead===oldTaylorBrams.id && newTaylor){ t.opsLead = newTaylor.id; touched=true; }
      if(oldAngSalerno && t.opsLead===oldAngSalerno.id && newAng){ t.opsLead = newAng.id; touched=true; }
      if(!Array.isArray(t.methodUsed)) { t.methodUsed = t.methodUsed ? [t.methodUsed] : []; touched=true; }
    });
    if(touched) await saveClientTasks(cid);
  }

  // 5. Drop the two placeholder demo clients — the real roster already includes actual Aerie/Aeropostale entries
  state.clients = state.clients.filter(c=>c.name!=='Aerie (example)' && c.name!=='Aeropostale (example)');
  await storeSet('clients', state.clients);

  // 6. Create a folder (full year of core-list tasks) for every real client
  const toCreate = REAL_CLIENT_ROSTER.filter(name=>!state.clients.some(c=>c.name===name));
  let done = 0;
  for(const name of toCreate){
    showBootProgress(`Creating client folder: ${name}`, done, toCreate.length);
    const opsLeadName = CLIENT_OPS_LEAD_MAP[name] || '';
    const opsLeadObj = opsLeadName ? state.opsLeads.find(o=>o.name===opsLeadName) : null;
    const c = { id:uid(), name, year:2026, opsLead: opsLeadObj ? opsLeadObj.id : '' };
    state.clients.push(c);
    const tasks = generateYearTasks(c.id, c.year, c.opsLead);
    state.taskCache[c.id] = tasks;
    await saveClientTasks(c.id);
    done++;
  }
  await storeSet('clients', state.clients);

  await storeSet('migration_real_data_v1', true);
}

async function applyClientOpsLeadMigration(){

  if(already) return;
  let changed = false;
  state.clients.forEach(c=>{
    if(c.opsLead) return; // don't clobber anything already assigned
    const opsLeadName = CLIENT_OPS_LEAD_MAP[c.name];
    if(opsLeadName){
      const o = state.opsLeads.find(o=>o.name===opsLeadName);
      if(o){ c.opsLead = o.id; changed = true; }

      c.opsLead = '';
      changed = true;
    }
  });
  if(changed) await storeSet('clients', state.clients);
  await storeSet('migration_client_opslead_v1', true);
}

async function applyClientDataCorrectionsMigration(){
  const already = await storeGet('migration_corrections_v1');
  if(already) return;

  showBootProgress('Applying client roster corrections…');

  function addTraining(stylistName, clientName, taskType){
    const stylist = state.stylists.find(s=>s.name===stylistName);
    const client = state.clients.find(c=>c.name===clientName);
    if(!stylist || !client) return;
    if(!isTrained(stylist.id, client.id, taskType)){
      state.trainingMatrix.push({id:uid(), stylistId:stylist.id, clientId:client.id, taskType});
    }
  }

  async function removeClientEntirely(clientName){
    const c = state.clients.find(c=>c.name===clientName);
    if(!c) return;
    state.clients = state.clients.filter(x=>x.id!==c.id);
    state.trainingMatrix = state.trainingMatrix.filter(e=>e.clientId!==c.id);
    delete state.taskCache[c.id];
    await storeDelete('tasks:'+c.id);
  }

  // 1. The stylists trained under plain "Macy's" are actually trained on
  //    Macy's - Men and Macy's - Women, for OOS and Styling only.
  const macysStylists = ['Aleksandar','Hristijan','Iskra','Iva','Jordan','Marko','Natasha','Nikki','Njomeza','Sara','Tea','Vera','Veronika','Zhaklina'];
  macysStylists.forEach(name=>{
    ['Macy\'s - Men','Macy\'s - Women'].forEach(client=>{
      ['OOS','Styling'].forEach(type=>addTraining(name, client, type));
    });
  });
  await removeClientEntirely("Macy's");

  // 2. Macy's - Big Kids: Natasha and Njomeza, OOS and Styling.
  ['Natasha','Njomeza'].forEach(name=>{
    ['OOS','Styling'].forEach(type=>addTraining(name, "Macy's - Big Kids", type));
  });

  // 3. Sugar and Jade: Jina, all task types used across the training matrix.
  const ALL_SHEET_TASK_TYPES = ['Featured Shops','Galleries','Gallery QA & OOS','Matchbacks','Metadata','OOS','Priority Outfitting','QA','STM','STM OOS','Sample Outfits','Styling','Tagging'];
  ALL_SHEET_TASK_TYPES.forEach(type=>addTraining('Jina','Sugar and Jade', type));

  // 4. JCPenney - Kids/Men/Women: same stylists as JCPenney (Apparel), OOS and Styling only.
  const jcpStylists = ['Iskra','Ivona','Jina','Sara','Tatiana','Tea','Zhaklina'];
  jcpStylists.forEach(name=>{
    ['JCPenney - Kids','JCPenney - Men','JCPenney - Women'].forEach(client=>{
      ['OOS','Styling'].forEach(type=>addTraining(name, client, type));
    });
  });

  // 5. Discontinued clients — remove entirely.
  for(const name of ['Fanatics','Life Style Sports','Liverpool LA','Magnolia','mnml']){
    await removeClientEntirely(name);
  }

  await storeSet('clients', state.clients);
  await saveTrainingMatrix();
  await storeSet('migration_corrections_v1', true);
}

async function applySegmentSubfolderMigration(){
  const already = await storeGet('migration_segment_subfolders_v1');
  if(already) return;

  // Group the flat SEGMENT_SUBFOLDER_DATA rows by their base (merged) client
  const byBase = {};
  SEGMENT_SUBFOLDER_DATA.forEach(([base, newName, rate, stylingMethod, oosMethod])=>{
    (byBase[base] = byBase[base] || []).push({newName, rate, stylingMethod, oosMethod});
  });

  const baseNames = Object.keys(byBase);
  let done = 0;
  for(const baseName of baseNames){
    showBootProgress(`Splitting ${baseName} into segments…`, done, baseNames.length);
    const baseClient = state.clients.find(c=>c.name===baseName);
    if(!baseClient){ done++; continue; }

    // carry over ops lead + any training-matrix assignments from the merged client
    const baseOpsLead = baseClient.opsLead || '';
    const baseTrainingEntries = state.trainingMatrix.filter(e=>e.clientId===baseClient.id);

    for(const seg of byBase[baseName]){
      if(state.clients.some(c=>c.name===seg.newName)) continue; // already created
      const c = { id:uid(), name:seg.newName, year:2026, opsLead:baseOpsLead };
      state.clients.push(c);
      const tasks = generateYearTasks(c.id, c.year, baseOpsLead);
      tasks.forEach(t=>{
        if(t.taskType==='Styling'){
          t.primaryMethod = seg.stylingMethod;
          if(seg.rate!==null) t.rate = seg.rate;
        }
        if(t.taskType==='OOS' && seg.oosMethod){
          t.primaryMethod = seg.oosMethod;
        }
      });
      state.taskCache[c.id] = tasks;
      await saveClientTasks(c.id);

      baseTrainingEntries.forEach(e=>{
        state.trainingMatrix.push({id:uid(), stylistId:e.stylistId, clientId:c.id, taskType:e.taskType});
      });
    }

    // remove the now-superseded merged client
    state.clients = state.clients.filter(c=>c.id!==baseClient.id);
    state.trainingMatrix = state.trainingMatrix.filter(e=>e.clientId!==baseClient.id);
    delete state.taskCache[baseClient.id];
    await storeDelete('tasks:'+baseClient.id);

    done++;
  }

  await storeSet('clients', state.clients);
  await saveTrainingMatrix();
  await storeSet('migration_segment_subfolders_v1', true);
}

async function applyOOS5MinAllocationMigration(){
  const already = await storeGet('migration_oos_5min_allocation_v1');
  if(already) return;

  const EXCLUDED_NAMES = new Set(['Anne Klein','Gym + Coffee','Lilac Blonde']);
  const today = fmtDate(new Date());
  const endDate = '2026-12-30';
  if(today > endDate){ await storeSet('migration_oos_5min_allocation_v1', true); return; } // window already passed
  const hours = round2(5/60);

  showBootProgress('Setting 5 min OOS allocation…');
  const eligibleClients = state.clients.filter(c=>!EXCLUDED_NAMES.has(c.name));
  let done = 0;
  for(const c of eligibleClients){
    showBootProgress('Setting 5 min OOS allocation…', done, eligibleClients.length);
    await ensureClientTasksLoaded(c.id);
    let touched = false;
    state.taskCache[c.id].forEach(t=>{
      if(t.taskType==='OOS' && t.dueDate>=today && t.dueDate<=endDate){
        const dow = parseDate(t.dueDate).getDay();
        if(dow===0 || dow===6) return; // weekdays only
        t.estimatedHours = hours;
        touched = true;
      }
    });
    if(touched) await saveClientTasks(c.id);
    done++;
  }

  // Auto-Assign in month-sized chunks so this stays responsive rather than one giant run
  let chunkStart = today;
  while(chunkStart<=endDate){
    const chunkEndCandidate = fmtDate(addDays(parseDate(chunkStart), 30));
    const chunkEnd = chunkEndCandidate < endDate ? chunkEndCandidate : endDate;
    showBootProgress(`Auto-Assigning ${chunkStart} to ${chunkEnd}…`);
    await runAutoAssign(chunkStart, chunkEnd);
    chunkStart = fmtDate(addDays(parseDate(chunkEnd), 1));
  }

  await storeSet('migration_oos_5min_allocation_v1', true);
}

// Start of "last month" relative to today — the active/archive boundary.
function archiveCutoffDate(){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth()-1, 1);
  return fmtDate(d);
}

async function ensureClientTasksLoaded(clientId){
  if(state.taskCache[clientId]) return state.taskCache[clientId];
  let tasks = await storeGet('tasks:'+clientId);
  if(!tasks) tasks = [];
  tasks.forEach(t=>{ t.dayOfWeek = dayOfWeekFromDate(t.dueDate); if(!Array.isArray(t.methodUsed)) t.methodUsed = t.methodUsed ? [t.methodUsed] : []; if(!Array.isArray(t.tags)) t.tags = t.tags ? [t.tags] : []; });

  // Self-maintaining archive: every time this client's tasks are touched,
  // anything older than last month moves out to a separate archive key.
  // Nothing is deleted — just kept out of the everyday active payload.
  const cutoff = archiveCutoffDate();
  const toArchive = tasks.filter(t=>t.dueDate && t.dueDate<cutoff);
  if(toArchive.length>0){
    const active = tasks.filter(t=>!(t.dueDate && t.dueDate<cutoff));
    const existingArchive = (await storeGet('archive:'+clientId)) || [];
    await storeSet('archive:'+clientId, existingArchive.concat(toArchive));
    await storeSet('tasks:'+clientId, active);
    tasks = active;
  }

  state.taskCache[clientId] = tasks;
  return tasks;
}

async function ensureAllTasksLoaded(){
  const ids = [...state.clients.map(c=>c.id), INTERNAL_ID];
  for(const id of ids){ await ensureClientTasksLoaded(id); }
}

function allTasksFlat(){
  let out=[];
  Object.keys(state.taskCache).forEach(cid=>{ out = out.concat(state.taskCache[cid]); });
  return out;
}

// Pulls every real client's archived (pre-cutoff) tasks in one go — deliberately
// NOT called during routine page loads, only when something (like Reports on an
// archived month) actually needs historical data. Cached for the rest of the
// session afterward, so switching between archived months doesn't re-pull.
async function ensureArchiveLoaded(){
  if(state.archiveLoaded) return;
  await Promise.all(state.clients.map(async c=>{
    const archived = await storeGet('archive:'+c.id);
    state.archiveCache[c.id] = archived || [];
  }));
  state.archiveLoaded = true;
}

function archiveTasksFlat(){
  let out=[];
  Object.keys(state.archiveCache).forEach(cid=>{ out = out.concat(state.archiveCache[cid]); });
  return out;
}

function allKnownTags(){
  const set = new Set();
  allTasksFlat().forEach(t=>{ (t.tags||[]).forEach(tag=>set.add(tag)); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}

async function updateTask(clientId, taskId, updates){
  const arr = state.taskCache[clientId];
  const idx = arr.findIndex(t=>t.id===taskId);
  if(idx===-1) return null;
  const prevTotalCompleted = arr[idx].totalCompleted;
  const t = Object.assign(arr[idx], updates);
  if(updates.startingTarget!==undefined || updates.rate!==undefined){
    const startingTarget = parseFloat(t.startingTarget), rate = parseFloat(t.rate);
    if(!isNaN(startingTarget) && !isNaN(rate) && rate!==0){ t.estimatedHours = round2(startingTarget/rate); }
  }
  let cappedAt = null;
  if(updates.startingTarget!==undefined) cappedAt = applyStartingTargetCap(t);
  t.dayOfWeek = dayOfWeekFromDate(t.dueDate);
  await saveClientTasks(clientId);

  let rebalanceResult = null;
  if(updates.totalCompleted!==undefined && updates.totalCompleted!==prevTotalCompleted && t.dueDate){
    rebalanceResult = await rebalanceFutureDays(clientId, t.taskType, t.dueDate.slice(0,7));
  }
  return { cappedAt, rebalanceResult };
}

async function bulkUpdateTasks(taskIds, updates){
  // group by clientId so we touch each client's storage key once
  const byClient = {};
  taskIds.forEach(id=>{
    for(const cid of Object.keys(state.taskCache)){
      const t = state.taskCache[cid].find(x=>x.id===id);
      if(t){ (byClient[cid]=byClient[cid]||[]).push(t); break; }
    }
  });
  let cappedCount = 0;
  const rebalanceCombos = new Map(); // 'clientId|taskType|monthKey' -> {clientId,taskType,monthKey}
  for(const cid of Object.keys(byClient)){
    byClient[cid].forEach(t=>{
      Object.keys(updates).forEach(k=>{
        if(k==='tagsToAdd' || k==='tagsReplace') return;
        if(updates[k]!==''&&updates[k]!==null&&updates[k]!==undefined) t[k]=updates[k];
      });
      if(updates.tagsToAdd && updates.tagsToAdd.length){
        t.tags = updates.tagsReplace ? [...updates.tagsToAdd] : [...new Set([...(t.tags||[]), ...updates.tagsToAdd])];
      }
      if(updates.startingTarget!==undefined && updates.startingTarget!=='' || updates.rate!==undefined && updates.rate!==''){
        const startingTarget = parseFloat(t.startingTarget), rate = parseFloat(t.rate);
        if(!isNaN(startingTarget) && !isNaN(rate) && rate!==0) t.estimatedHours = round2(startingTarget/rate);
      }
      if(updates.startingTarget!==undefined && updates.startingTarget!==''){
        if(applyStartingTargetCap(t)!==null) cappedCount++;
      }
      if(updates.totalCompleted!==undefined && updates.totalCompleted!=='' && t.dueDate){
        const monthKey = t.dueDate.slice(0,7);
        rebalanceCombos.set(`${cid}|${t.taskType}|${monthKey}`, {clientId:cid, taskType:t.taskType, monthKey});
      }
      if(updates.dueDate) t.dayOfWeek = dayOfWeekFromDate(t.dueDate);
    });
    await saveClientTasks(cid);
  }
  let rebalancedCombos = 0;
  for(const {clientId, taskType, monthKey} of rebalanceCombos.values()){
    if(await rebalanceFutureDays(clientId, taskType, monthKey)) rebalancedCombos++;
  }
  return { cappedCount, rebalancedCombos };
}

// Removing a stylist isn't just deleting the roster row — it also clears them
// off every task they were assigned (so Workload View and Auto-Assign don't
// keep counting a departed stylist's capacity) and drops any Training Matrix
// entries for them, since those would otherwise be meaningless dangling refs.
async function removeStylistEverywhere(stylistId){
  const removedName = (state.stylists.find(s=>s.id===stylistId)||{}).name || 'Stylist';
  state.stylists = state.stylists.filter(s=>s.id!==stylistId);
  await saveStylists();

  const trainingRemoved = state.trainingMatrix.filter(e=>e.stylistId===stylistId).length;
  state.trainingMatrix = state.trainingMatrix.filter(e=>e.stylistId!==stylistId);
  await saveTrainingMatrix();

  const clearedTasks = [];
  const allClientIds = [...state.clients.map(c=>c.id), INTERNAL_ID];
  for(const cid of allClientIds){
    await ensureClientTasksLoaded(cid);
    let touched = false;
    state.taskCache[cid].forEach(t=>{
      if(t.assignedStylist===stylistId){
        t.assignedStylist = '';
        touched = true;
        clearedTasks.push({ client:(state.clients.find(c=>c.id===t.clientId)||{}).name||'Internal / Non-client', taskType:t.taskType, date:t.dueDate });
      }
    });
    if(touched) await saveClientTasks(cid);
  }

  return { removedName, trainingRemoved, clearedTasks };
}

  if(state.view==='clients') return await renderClientFolders();
  if(state.view==='workload') return await renderWorkload();
  if(state.view==='all') return await renderAllTasks();
  if(state.view==='reports') return await renderReports();
  if(state.view==='training') return await renderTrainingAssign();
  if(state.view==='goalplan') return await renderGoalPlanning();
  if(state.view==='ptocalendar') return await renderPTOCalendar();
  if(state.view==='mydashboard') return await renderMyDashboard();
  if(state.view==='settings') return renderSettings();
  return '';
}

function stylistName(id){ const s = state.stylists.find(s=>s.id===id); return s ? s.name : (id ? '—' : '—'); }
function opsLeadName(id){ const o = state.opsLeads.find(o=>o.id===id); return o ? o.name : (id ? '—' : '—'); }

function renderClientTaskTable(tasks, client){
  if(!tasks.length) return `<div class="empty"><h3>No tasks here yet</h3><p>Use "Add Task" to create one.</p><button class="btn small" style="margin-top:10px" data-action="open-add-task" data-prefill-client="${client?client.id:''}">+ Add Task</button></div>`;

  const isDateDriven = tasks.every(t=>t.dueDate) && CORE_TYPES.includes(tasks[0].taskType);
  let inner;
  if(isDateDriven){
    // group by month
    const byMonth = {};
    tasks.forEach(t=>{ const m = parseDate(t.dueDate).getMonth(); (byMonth[m] = byMonth[m]||[]).push(t); });
    const nowMonth = new Date().getMonth();
    inner = Object.keys(byMonth).sort((a,b)=>a-b).map(m=>{
      const rows = byMonth[m].sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
      return `<details class="month-accordion" ${Number(m)===nowMonth?'open':''}>
        <summary>${MONTH_NAMES[m]}<span>${rows.length} tasks</span></summary>
        ${taskTable(rows, client, {selectable:true})}
      </details>`;
    }).join('');
  } else {
    inner = `<div class="card" style="margin-top:4px;">${taskTable(tasks.sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')), client, {selectable:true})}</div>`;
  }
  const selCount = state.selectedTaskIds.size;
  return `
    <div class="toolbar" style="justify-content:space-between;">
      <div style="font-size:12.5px;color:var(--gray);">${tasks.length} tasks</div>
      <div style="display:flex;gap:8px;">
        <button class="btn secondary small" data-action="select-all-clientfolder">Select all in this list</button>
        <button class="btn small" data-action="open-add-task" data-prefill-client="${client?client.id:''}">+ Add Task</button>
      </div>
    </div>
    ${selCount>0 ? `<div class="card" style="padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;background:var(--plum-dim);border-color:var(--plum-light);">
      <strong style="font-size:12.5px;">${selCount} task${selCount>1?'s':''} selected</strong>
      <button class="btn small" data-action="open-bulk-edit">Bulk Edit…</button>
      <button class="btn secondary small" data-action="clear-selection">Clear selection</button>
    </div>` : ''}
    ${inner}
  `;
}

/* ============================= WORKLOAD VIEW ============================= */
async function renderWorkload(){
  await ensureAllTasksLoaded();
  const days = [];
  const count = state.wl.rangeType==='month' ? 30 : 7;
  for(let i=0;i<count;i++) days.push(addDays(state.wl.anchor, i));

  const flat = allTasksFlat();
  const byStylistDay = {};
  flat.forEach(t=>{
    if(!t.assignedStylist || !t.dueDate) return;
    const key = t.assignedStylist+'|'+t.dueDate;
    const hrs = parseFloat(t.estimatedHours)||0;
    byStylistDay[key] = (byStylistDay[key]||0) + hrs;
  });

  const headerCells = days.map(d=>`<th>${DAY_NAMES[d.getDay()]}<br><span style="font-weight:400;color:var(--gray-light);">${d.getMonth()+1}/${d.getDate()}</span></th>`).join('');

  const rows = [...state.stylists].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>{
    const cells = days.map(d=>{
      const key = s.id+'|'+fmtDate(d);
      const hrs = round2(byStylistDay[key]||0);
      const pct = s.capacity>0 ? hrs/s.capacity : 0;
      let cls='cap-zero';
      if(hrs>0){
        cls = pct>=1 ? 'cap-over' : pct>=0.85 ? 'cap-near' : 'cap-open';
      }
      const barPct = Math.min(pct*100,100);
      return `<td class="wl-cell ${cls}" data-wl-cell="${s.id}|${fmtDate(d)}">
        <div class="wl-hrs">${hrs}</div>
        <div class="wl-bar"><div class="wl-bar-fill" style="width:${barPct}%"></div></div>
      </td>`;
    }).join('');
    return `<tr><td class="stylist-col"><div class="stylist-name">${escapeHtml(s.name)}</div><div class="stylist-cap">cap ${s.capacity}h/day</div></td>${cells}</tr>`;
  }).join('');

  const rangeLabel = `${fmtDate(days[0])} – ${fmtDate(days[days.length-1])}`;

  return `
    <div class="view-header">
      <div>
        <div class="view-title">Workload View</div>
        <div class="view-sub">Sum of estimated hours per stylist, per day, vs. their daily capacity.</div>
      </div>
      <button class="btn" data-action="open-add-task">+ Add Task</button>
    </div>
    <div class="wl-controls">
      <div class="wl-toggle">
        <button class="${state.wl.rangeType==='week'?'active':''}" data-wl-range="week">Week</button>
        <button class="${state.wl.rangeType==='month'?'active':''}" data-wl-range="month">Month</button>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn secondary small" data-action="wl-prev">← Prev</button>
        <button class="btn secondary small" data-action="wl-today">This week</button>
        <button class="btn secondary small" data-action="wl-next">Next →</button>
      </div>
      <div style="font-size:12.5px;color:var(--gray);align-self:center;">${rangeLabel}</div>
    </div>
    <div class="wl-scroll">
      <table class="wl-table">
        <thead><tr><th class="stylist-col">Stylist</th>${headerCells}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--sage);"></span>Under 85% capacity</span>
      <span><span class="dot" style="background:var(--amber);"></span>85–99% capacity</span>
      <span><span class="dot" style="background:var(--rose);"></span>At or over capacity</span>
      <span>Click a cell to see that day's tasks for a stylist.</span>
    </div>
  `;
}

/* ============================= REPORTS VIEW ============================= */
function monthLabel(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return `${MONTH_NAMES[m-1]} ${y}`;
}

async function reportSectionForType(taskType, monthKey){
  const cutoff = archiveCutoffDate(); // 'YYYY-MM-01'
  const isArchived = monthKey < cutoff.slice(0,7);
  let sourceTasks;
  if(isArchived){
    await ensureArchiveLoaded();
    sourceTasks = archiveTasksFlat();
  } else {
    sourceTasks = allTasksFlat();
  }
  const tasks = sourceTasks.filter(t=>t.taskType===taskType && t.dueDate && t.dueDate.slice(0,7)===monthKey);
  const byClient = {};
  tasks.forEach(t=>{
    const cid = t.clientId;
    if(cid===INTERNAL_ID) return; // goals are per real client only
    if(!byClient[cid]) byClient[cid] = { startingTarget:0, remaining:0, completed:0, taskCount:0 };
    byClient[cid].startingTarget += parseFloat(t.startingTarget)||0;
    byClient[cid].remaining += parseFloat(t.remaining)||0;
    byClient[cid].completed += parseFloat(t.totalCompleted)||0;
    byClient[cid].taskCount += 1;
  });

  const goalsForMonth = (state.monthlyGoals[monthKey] && state.monthlyGoals[monthKey][taskType]) || {};

  // list every real client, not just ones with tasks this month, so goals can be set ahead of time
  const rows = state.clients.map(c=>{
    const agg = byClient[c.id] || { startingTarget:0, remaining:0, completed:0, taskCount:0 };
    const goal = goalsForMonth[c.id] !== undefined ? goalsForMonth[c.id] : '';
    return { clientId:c.id, name:c.name, opsLead:c.opsLead||'', goal, ...agg };
  }).sort((a,b)=>a.name.localeCompare(b.name));

  const totalStartingTarget = rows.reduce((s,r)=>s+r.startingTarget,0);
  const totalRemaining = rows.reduce((s,r)=>s+r.remaining,0);
  const totalCompleted = rows.reduce((s,r)=>s+r.completed,0);
  const totalGoal = rows.reduce((s,r)=>s+(parseFloat(r.goal)||0),0);
  return { rows, totalStartingTarget, totalRemaining, totalCompleted, totalGoal, isArchived };
}

async function reportGoalSectionHtml(taskType, monthKey){

  const search = (state.reportClientSearch||'').toLowerCase();

  if(state.reportOpsLeadFilter) visibleRows = visibleRows.filter(r=>r.opsLead===state.reportOpsLeadFilter);
  const pctOfGoal = totalGoal>0 ? round2((totalCompleted/totalGoal)*100) : null;
  const goalRemaining = totalGoal>0 ? round2(totalGoal-totalCompleted) : null;

  const opsLeadSelectOptions = `<option value="">—</option>` + state.opsLeads.map(o=>`<option value="${o.id}">${escapeHtml(o.name)}</option>`).join('');

  const rowsHtml = visibleRows.map(r=>{
    const pctTarget = r.startingTarget>0 ? round2((r.completed/r.startingTarget)*100) : null;
    const goalNum = parseFloat(r.goal)||0;

      <td>${r.taskCount}</td>
      <td>${round2(r.startingTarget)}</td>
      <td>${round2(r.remaining)}</td>
      <td>${round2(r.completed)}</td>
      <td>${pctTarget===null?'—':pctTarget+'%'}</td>
      <td style="width:130px;"><input type="number" data-client-goal="${taskType}|${r.clientId}" value="${r.goal}" placeholder="No goal set"></td>
      <td>${pctOfClientGoal===null?'—':pctOfClientGoal+'%'}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="9" class="empty">No clients match the current filters.</td></tr>`;

  return `
    <div class="card" style="padding:18px 20px;margin-bottom:22px;">
      <div style="margin-bottom:14px;">
        <h3 style="font-size:16px;">${escapeHtml(taskType)}</h3>
        <div class="view-sub">Aggregated from every client's ${escapeHtml(taskType)} tasks due in ${monthLabel(monthKey)}. Goals are set per client, per month.${isArchived?' <strong>Pulled from archived data</strong> — this month has aged out of the everyday active window.':''}</div>
      </div>
      <div class="grid3" style="margin-bottom:16px;">
        <div class="card" style="padding:12px 14px;background:#FCFBF9;">
          <div class="field-label">Total Completed (all clients)</div>
          <div style="font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;">${round2(totalCompleted)}</div>

/* ============================= TRAINING & AUTO-ASSIGN ============================= */
function dateRangeArray(fromStr, toStr){
  const out = [];
  let d = parseDate(fromStr), end = parseDate(toStr);
  while(d<=end){ out.push(fmtDate(d)); d = addDays(d,1); }
  return out;
}

function parseTrainingImport(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const allTypes = [...CORE_TYPES, ...state.additionalTypes];
  let added = 0;
  const skipped = [];
  lines.forEach(line=>{
    let parts;
    if(line.includes('\t')) parts = line.split('\t');
    else if(line.includes('|')) parts = line.split('|');
    else parts = line.split(',');
    parts = parts.map(p=>p.trim()).filter(p=>p!=='');
    if(parts.length<3){ skipped.push({line, reason:'Expected 3 values (stylist, client, task type)'}); return; }
    const [stylistPart, clientPart, typePart] = parts;
    const stylist = state.stylists.find(s=>s.name.toLowerCase()===stylistPart.toLowerCase());
    if(!stylist){ skipped.push({line, reason:`No stylist named "${stylistPart}"`}); return; }
    const client = state.clients.find(c=>c.name.toLowerCase()===clientPart.toLowerCase());
    if(!client){ skipped.push({line, reason:`No client named "${clientPart}"`}); return; }
    const type = allTypes.find(t=>t.toLowerCase()===typePart.toLowerCase());
    if(!type){ skipped.push({line, reason:`No task type named "${typePart}"`}); return; }
    if(isTrained(stylist.id, client.id, type)){ skipped.push({line, reason:'Already in the training matrix'}); return; }
    state.trainingMatrix.push({id:uid(), stylistId:stylist.id, clientId:client.id, taskType:type});
    added++;
  });
  return { added, skipped };
}

function cloneTaskForSplit(original, overrides){
  const clone = Object.assign({}, original, {
    id: uid(), status:'Not Started', comments:'', actualTimeSpent:'',
  }, overrides);
  return clone;
}

// Splits one day's task across multiple trained, available stylists, proportional
// to each one's remaining capacity that day, so nobody gets a share bigger than
// their room allows. Only splits when at least 2 trained stylists have capacity
// left; otherwise leaves the task for normal single-assignment handling.
function splitTaskAcrossStylists(clientId, task, options, loadMap, splitsCreated){
  const hrs = parseFloat(task.estimatedHours)||0;
  const target = parseFloat(task.startingTarget);
  const hasTarget = !isNaN(target);

  const withRoom = options
    .map(s=>{ const key=s.id+'|'+task.dueDate; return { s, remaining: s.capacity-(loadMap[key]||0) }; })
    .filter(o=>o.remaining>0)
    .sort((a,b)=>b.remaining-a.remaining);

  if(withRoom.length<2) return false; // not enough people with room to split across

  // pull in just enough of the top-capacity people to (ideally) cover the hours
  const chosen = [];
  let cumulative = 0;
  for(const o of withRoom){
    chosen.push(o);
    cumulative += o.remaining;
    if(chosen.length>=2 && cumulative>=hrs) break;
  }
  if(chosen.length<2) return false;

  const totalRemaining = chosen.reduce((s,o)=>s+o.remaining,0);
  const groupId = task.autoSplitGroup || task.id;

  let hrsLeft = hrs, targetLeft = hasTarget ? target : 0;
  const pieces = chosen.map((o,idx)=>{
    const isLast = idx===chosen.length-1;
    const ratio = o.remaining/totalRemaining;
    const pieceHrs = isLast ? round2(hrsLeft) : round2(hrs*ratio);
    const pieceTarget = hasTarget ? (isLast ? round2(targetLeft) : round2(target*ratio)) : '';
    hrsLeft = round2(hrsLeft-pieceHrs);
    targetLeft = hasTarget ? round2(targetLeft-pieceTarget) : 0;
    return { stylist:o.s, hrs:pieceHrs, target:pieceTarget };
  });

  // first piece reuses the original task; the rest are new sibling tasks
  task.autoSplitGroup = groupId;
  task.assignedStylist = pieces[0].stylist.id;
  task.estimatedHours = pieces[0].hrs;
  if(hasTarget) task.startingTarget = pieces[0].target;
  loadMap[pieces[0].stylist.id+'|'+task.dueDate] = (loadMap[pieces[0].stylist.id+'|'+task.dueDate]||0) + pieces[0].hrs;

  const newTasks = [];
  for(let i=1;i<pieces.length;i++){
    const p = pieces[i];
    const clone = cloneTaskForSplit(task, {
      autoSplitGroup: groupId,
      assignedStylist: p.stylist.id,
      estimatedHours: p.hrs,
      startingTarget: hasTarget ? p.target : task.startingTarget,
    });
    newTasks.push(clone);
    const key = p.stylist.id+'|'+task.dueDate;
    loadMap[key] = (loadMap[key]||0) + p.hrs;
  }
  state.taskCache[clientId].push(...newTasks);
  splitsCreated.push({ client:(state.clients.find(c=>c.id===clientId)||{}).name||'—', taskType:task.taskType, date:task.dueDate, pieces:pieces.length, stylists:pieces.map(p=>p.stylist.name) });
  return true;
}

async function runAutoAssign(fromStr, toStr){
  await ensureAllTasksLoaded();
  const inRange = allTasksFlat().filter(t=>t.dueDate && t.dueDate>=fromStr && t.dueDate<=toStr);
  const fixedTasks = inRange.filter(t=>t.clientId===INTERNAL_ID);
  const weekendSkipped = inRange.filter(t=>t.clientId!==INTERNAL_ID && (t.dayOfWeek==='Sat' || t.dayOfWeek==='Sun'));
  const candidateTasks = inRange.filter(t=>t.clientId!==INTERNAL_ID && t.dayOfWeek!=='Sat' && t.dayOfWeek!=='Sun');

  const loadMap = {}; // 'stylistId|date' -> hours
  fixedTasks.forEach(t=>{
    if(!t.assignedStylist) return;
    const key = t.assignedStylist+'|'+t.dueDate;
    loadMap[key] = (loadMap[key]||0) + (parseFloat(t.estimatedHours)||0);
  });

  const eligible = [];
  const unassignable = [];
  candidateTasks.forEach(t=>{
    const opts = eligibleStylistsFor(t.clientId, t.taskType);
    if(opts.length===0){
      unassignable.push(t);
      // keep existing assignment's hours as fixed load since we won't touch it
      if(t.assignedStylist){
        const key = t.assignedStylist+'|'+t.dueDate;
        loadMap[key] = (loadMap[key]||0) + (parseFloat(t.estimatedHours)||0);
      }
    } else {
      eligible.push({ task:t, options:opts });
    }
  });

  eligible.sort((a,b)=>{
    if(a.options.length !== b.options.length) return a.options.length - b.options.length;
    if(a.task.dueDate !== b.task.dueDate) return a.task.dueDate.localeCompare(b.task.dueDate);
    return (parseFloat(b.task.estimatedHours)||0) - (parseFloat(a.task.estimatedHours)||0);
  });

  let assignedCount=0, reassignedCount=0, unchangedCount=0;
  const overCapacity = [];
  const touchedClients = new Set();
  const splitsCreated = [];
  const couldNotSplit = [];
  const cap = parseFloat(state.autoSplitThresholdHours)||0;

  for(const {task, options} of eligible){
    touchedClients.add(task.clientId);
    const hrs = parseFloat(task.estimatedHours)||0;

    if(cap>0 && hrs>cap){
      const split = splitTaskAcrossStylists(task.clientId, task, options, loadMap, splitsCreated);
      if(split){
        assignedCount++; // the reshaped task + its new siblings count as newly assigned this run
        continue;
      }
      couldNotSplit.push({ client:(state.clients.find(c=>c.id===task.clientId)||{}).name||'—', taskType:task.taskType, date:task.dueDate, hours:hrs });
      // fall through to normal single-assignment below
    }

    let best = null, bestRemaining = -Infinity;
    options.forEach(s=>{
      const key = s.id+'|'+task.dueDate;
      const used = loadMap[key]||0;
      const remaining = s.capacity - used;
      if(remaining > bestRemaining){ bestRemaining = remaining; best = s; }
    });
    const key = best.id+'|'+task.dueDate;
    loadMap[key] = (loadMap[key]||0) + hrs;
    if(bestRemaining < hrs){ overCapacity.push({task, stylist:best}); }

    const prevStylist = task.assignedStylist;
    task.assignedStylist = best.id;
    if(!prevStylist) assignedCount++;
    else if(prevStylist!==best.id) reassignedCount++;
    else unchangedCount++;
  }

  for(const cid of touchedClients){ await saveClientTasks(cid); }

  return {
    totalConsidered: candidateTasks.length,
    assignedCount, reassignedCount, unchangedCount,
    weekendSkipped: weekendSkipped.length,
    splitsCreated,
    couldNotSplit,
    unassignable: unassignable.map(t=>({ client:(state.clients.find(c=>c.id===t.clientId)||{}).name||'—', taskType:t.taskType, date:t.dueDate })),
    overCapacity: overCapacity.map(o=>({ client:(state.clients.find(c=>c.id===o.task.clientId)||{}).name||'—', taskType:o.task.taskType, date:o.task.dueDate, stylist:o.stylist.name })),
  };
}

async function runRecommendation(fromStr, toStr){
  await ensureAllTasksLoaded();
  const days = dateRangeArray(fromStr, toStr);
  const inRange = allTasksFlat().filter(t=>t.dueDate && t.dueDate>=fromStr && t.dueDate<=toStr);

  // total committed hours per stylist across ALL their tasks in range (any client/type)
  const committedByStylist = {};
  inRange.forEach(t=>{
    if(!t.assignedStylist) return;
    committedByStylist[t.assignedStylist] = (committedByStylist[t.assignedStylist]||0) + (parseFloat(t.estimatedHours)||0);
  });
  const spareByStylist = {};
  state.stylists.forEach(s=>{
    const totalCap = s.capacity * days.length;
    spareByStylist[s.id] = Math.max(0, totalCap - (committedByStylist[s.id]||0));
  });

  // demand per (client, taskType) combo, non-internal only
  const demand = {};
  inRange.forEach(t=>{
    if(t.clientId===INTERNAL_ID) return;
    const key = t.clientId+'|'+t.taskType;
    demand[key] = (demand[key]||0) + (parseFloat(t.estimatedHours)||0);
  });

  const rows = Object.keys(demand).map(key=>{
    const [clientId, taskType] = key.split('|');
    const trained = eligibleStylistsFor(clientId, taskType);
    const coverable = trained.reduce((s,st)=>s+spareByStylist[st.id], 0);
    const demandHours = demand[key];
    const gap = round2(demandHours - coverable);
    const untrainedWithSpare = state.stylists
      .filter(s=>!trained.some(t2=>t2.id===s.id) && spareByStylist[s.id]>0)
      .sort((a,b)=>spareByStylist[b.id]-spareByStylist[a.id])
      .slice(0,3)
      .map(s=>({ name:s.name, spare:round2(spareByStylist[s.id]) }));
    return {
      clientName:(state.clients.find(c=>c.id===clientId)||{}).name||'—',
      taskType, demandHours:round2(demandHours), coverable:round2(coverable), gap,
      suggestions:untrainedWithSpare,
    };
  }).filter(r=>r.gap>0).sort((a,b)=>b.gap-a.gap);

  return rows;
}

function percentile(sortedAsc, p){
  if(sortedAsc.length===0) return 0;
  const idx = Math.min(sortedAsc.length-1, Math.floor(p*(sortedAsc.length-1)));
  return sortedAsc[idx];
}

// For each client+task type, walks every weekday in the range and checks whether
// that day's total volume would need more trained-and-available stylists than the
// account currently has, in order to split it under the cap. The recommended
// headcount is based on the 80th percentile of shortfall across the whole trend —
// not the single worst day — so one outlier spike doesn't drive over-hiring.
async function runSplitCapacityRecommendation(fromStr, toStr){
  await ensureAllTasksLoaded();
  const cap = parseFloat(state.autoSplitThresholdHours)||0;
  const days = dateRangeArray(fromStr, toStr).filter(d=>{
    const dow = parseDate(d).getDay();
    return dow!==0 && dow!==6; // Auto-Assign never touches weekends, so they never need a split
  });
  const inRange = allTasksFlat().filter(t=>t.clientId!==INTERNAL_ID && t.dueDate && t.dueDate>=fromStr && t.dueDate<=toStr);

  // day-by-day total hours per (client, taskType) — summed across split pieces too,
  // so an already-split day still reflects its true original volume
  const hoursByKeyDate = {};
  inRange.forEach(t=>{
    const key = t.clientId+'|'+t.taskType;
    const byDate = (hoursByKeyDate[key] = hoursByKeyDate[key] || {});
    byDate[t.dueDate] = (byDate[t.dueDate]||0) + (parseFloat(t.estimatedHours)||0);
  });

  // spare capacity per stylist across the whole range, for candidate suggestions
  const committedByStylist = {};
  inRange.forEach(t=>{
    if(!t.assignedStylist) return;
    committedByStylist[t.assignedStylist] = (committedByStylist[t.assignedStylist]||0) + (parseFloat(t.estimatedHours)||0);
  });
  const spareByStylist = {};
  state.stylists.forEach(s=>{
    const totalCap = s.capacity * days.length;
    spareByStylist[s.id] = Math.max(0, totalCap - (committedByStylist[s.id]||0));
  });

  const rows = [];
  if(cap>0){
    Object.keys(hoursByKeyDate).forEach(key=>{
      const [clientId, taskType] = key.split('|');
      const trained = eligibleStylistsFor(clientId, taskType);
      const trainedCount = trained.length;
      const byDate = hoursByKeyDate[key];

      let daysNeedingSplit = 0;
      const shortfalls = [];
      days.forEach(d=>{
        const hrs = byDate[d]||0;
        if(hrs<=cap) return;
        daysNeedingSplit++;
        const required = Math.ceil(hrs/cap);
        const shortfall = Math.max(0, required-trainedCount);
        if(shortfall>0) shortfalls.push(shortfall);
      });
      if(shortfalls.length===0) return;

      shortfalls.sort((a,b)=>a-b);
      const recommended = Math.ceil(percentile(shortfalls, 0.8));
      const worst = shortfalls[shortfalls.length-1];

      const candidates = state.stylists
        .filter(s=>!trained.some(t2=>t2.id===s.id))
        .sort((a,b)=>spareByStylist[b.id]-spareByStylist[a.id])
        .slice(0, Math.max(recommended,1))
        .map(s=>({ name:s.name, spare:round2(spareByStylist[s.id]) }));

      rows.push({
        clientName:(state.clients.find(c=>c.id===clientId)||{}).name||'—',
        taskType, daysAnalyzed:days.length, daysNeedingSplit, daysShortStaffed:shortfalls.length,
        trainedCount, recommended, worst, candidates,
      });
    });
  }

  return rows.sort((a,b)=>b.recommended-a.recommended);
}

// Marks a stylist as fully booked (PTO) for every weekday in the range, then
// re-runs Auto-Assign across that same range. Auto-Assign already reassigns
// existing tasks to a better-fit trained stylist when one has more room — a
// PTO'd stylist shows 0 remaining capacity that day, so their other tasks
// naturally move to the next best trained, available person. No separate
// reassignment logic needed; this reuses the exact same machinery.
async function addPTO(stylistId, fromDate, toDate, isHalfDay){
  const stylist = state.stylists.find(s=>s.id===stylistId);
  if(!stylist) return null;

  await ensureClientTasksLoaded(INTERNAL_ID);
  const days = dateRangeArray(fromDate, toDate).filter(d=>{
    const dow = parseDate(d).getDay();
    return dow!==0 && dow!==6; // PTO only matters on days work would otherwise happen
  });
  const hours = isHalfDay ? round2(stylist.capacity/2) : stylist.capacity;

  let created = 0, updated = 0;
  days.forEach(date=>{
    const existing = state.taskCache[INTERNAL_ID].find(t=>t.taskType==='PTO' && t.assignedStylist===stylistId && t.dueDate===date);
    if(existing){
      // already has a PTO entry that day — update it in place rather than duplicate
      existing.estimatedHours = hours;
      existing.ptoHalfDay = !!isHalfDay;
      existing.comments = isHalfDay ? 'PTO (Half Day)' : 'PTO';
      updated++;
      return;
    }
    state.taskCache[INTERNAL_ID].push(makeTask({
      clientId: INTERNAL_ID, taskType:'PTO', assignedStylist:stylistId, dueDate:date,
      estimatedHours: hours, status:'Not Started', comments: isHalfDay ? 'PTO (Half Day)' : 'PTO',
      ptoHalfDay: !!isHalfDay,
    }));
    created++;
  });
  await saveClientTasks(INTERNAL_ID);

  const autoAssignResult = days.length>0 ? await runAutoAssign(days[0], days[days.length-1]) : null;
  return { stylistName: stylist.name, daysCreated: created, daysUpdated: updated, days, isHalfDay: !!isHalfDay, autoAssignResult };
}

async function removePTO(taskId){
  await ensureClientTasksLoaded(INTERNAL_ID);
  const task = state.taskCache[INTERNAL_ID].find(t=>t.id===taskId);
  if(!task) return null;
  state.taskCache[INTERNAL_ID] = state.taskCache[INTERNAL_ID].filter(t=>t.id!==taskId);
  await saveClientTasks(INTERNAL_ID);
  // capacity just opened back up — re-optimize that single day in case it helps
  const autoAssignResult = await runAutoAssign(task.dueDate, task.dueDate);
  return { stylistName: stylistName(task.assignedStylist), date: task.dueDate, autoAssignResult };
}

// For each client + task type that has trained coverage, checks every weekday
// in range for days where NO trained stylist has any capacity left at all —
// a true coverage gap, not just a busy day. Uses actual remaining capacity
// (factoring in half-day PTO, other assignments, everything) rather than a
// simple "on PTO or not" flag, so a half-day person correctly still counts as
// partial coverage rather than being treated as fully unavailable.
async function checkPTOCoverage(fromStr, toStr){
  await ensureAllTasksLoaded();
  const days = dateRangeArray(fromStr, toStr).filter(d=>{
    const dow = parseDate(d).getDay();
    return dow!==0 && dow!==6;
  });
  const daySet = new Set(days);

  const loadByStylistDate = {}; // 'stylistId|date' -> committed hours (PTO + everything else)
  allTasksFlat().forEach(t=>{
    if(!t.assignedStylist || !daySet.has(t.dueDate)) return;
    const key = t.assignedStylist+'|'+t.dueDate;
    loadByStylistDate[key] = (loadByStylistDate[key]||0) + (parseFloat(t.estimatedHours)||0);
  });

  const combos = new Set();
  state.trainingMatrix.forEach(e=>combos.add(e.clientId+'|'+e.taskType));

  const flags = [];
  combos.forEach(key=>{
    const [clientId, taskType] = key.split('|');
    const trained = eligibleStylistsFor(clientId, taskType);
    if(trained.length===0) return;
    days.forEach(date=>{
      const noRoomAnywhere = trained.every(s=>{
        const used = loadByStylistDate[s.id+'|'+date] || 0;
        return (s.capacity - used) <= 0;
      });
      if(noRoomAnywhere){
        flags.push({
          clientName:(state.clients.find(c=>c.id===clientId)||{}).name||'—',
          taskType, date, trainedNames: trained.map(s=>s.name),
        });
      }
    });
  });

  return flags.sort((a,b)=> a.date.localeCompare(b.date) || a.clientName.localeCompare(b.clientName));
}

    <strong>${escapeHtml(r.stylistName)}</strong> marked out (${r.isHalfDay?'Half Day':'Full Day'}) for ${r.daysCreated} new day(s)${r.daysUpdated?` (${r.daysUpdated} existing day(s) updated to match)`:''} (${r.days[0]||'—'} to ${r.days[r.days.length-1]||'—'}).

      <ul style="margin:4px 0 0 18px;max-height:140px;overflow-y:auto;">${aa.unassignable.slice(0,30).map(u=>`<li>${escapeHtml(u.client)} — ${escapeHtml(u.taskType)} (${u.date})</li>`).join('')}</ul>

// Same idea as PTO — blocks off a chunk of a stylist's capacity for one day —
// just a shorter, named duration instead of a full/half day off. Reuses the
// same Auto-Assign re-run so anything that no longer fits moves to someone
// else with room, exactly like PTO does.
async function addMeeting(stylistId, date, meetingName, minutes){
  const stylist = state.stylists.find(s=>s.id===stylistId);
  if(!stylist) return null;

  await ensureClientTasksLoaded(INTERNAL_ID);
  const hours = round2(minutes/60);
  state.taskCache[INTERNAL_ID].push(makeTask({
    clientId: INTERNAL_ID, taskType:'Meeting', assignedStylist:stylistId, dueDate:date,
    estimatedHours: hours, status:'Not Started', comments: meetingName,
  }));
  await saveClientTasks(INTERNAL_ID);

  const autoAssignResult = await runAutoAssign(date, date);
  return { stylistName: stylist.name, meetingName, hours, minutes, date, autoAssignResult };
}

function meetingResultBannerHtml(r){
  if(!r) return '';
  const aa = r.autoAssignResult;
  return `<div class="card" style="padding:14px 16px;margin-top:14px;background:var(--sage-dim);border-color:var(--sage);">

/* ============================= GOAL PLANNING ============================= */
function daysInMonth(year, monthIndex){ return new Date(year, monthIndex+1, 0).getDate(); }

function holidaysForTaskType(taskType){
  const region = HOLIDAY_REGION_BY_TASKTYPE[taskType] || 'US';
  return region==='Macedonia' ? state.holidaysMacedonia : state.holidaysUS;
}
function isHoliday(dateStr, taskType){
  return holidaysForTaskType(taskType).some(h=>h.date===dateStr);
}

function weekdayDatesInMonth(monthKey, taskType){
  const [y,m] = monthKey.split('-').map(Number);
  const total = daysInMonth(y, m-1);
  const out = [];
  for(let d=1; d<=total; d++){
    const dt = new Date(y, m-1, d);
    const dow = dt.getDay();
    const ds = fmtDate(dt);
    if(dow!==0 && dow!==6 && !isHoliday(ds, taskType)) out.push(ds);
  }
  return out;
}

function monthKeysAhead(n){
  const out = [];
  const now = new Date();
  for(let i=0;i<n;i++){
    const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  return out;
}

// The ceiling a "Capped to Monthly Goal" client's Starting Target should never
// exceed for a given day: that month's goal (if one's been set on Goal Planning)
// divided evenly across the type's weekdays, same math Goal Planning itself uses.
// Returns null when there's nothing to cap against (no goal set that month, or
// the date isn't a working day for that type), meaning no cap applies.
function goalCapForDate(clientId, taskType, dateStr){
  const monthKey = dateStr.slice(0,7);
  const goal = state.monthlyGoals[monthKey] && state.monthlyGoals[monthKey][taskType] && state.monthlyGoals[monthKey][taskType][clientId];
  if(goal===undefined || goal==='' || goal===null) return null;
  const weekdayDates = weekdayDatesInMonth(monthKey, taskType);
  if(!weekdayDates.includes(dateStr)) return 0; // not a working day per that type's calendar
  return weekdayDates.length>0 ? Math.ceil((parseFloat(goal)||0)/weekdayDates.length) : null;
}

// Clamps a task's Starting Target down to that day's goal cap if its client is
// set to "Capped to Monthly Goal". Full Coverage clients pass through untouched.
// Returns the cap that was applied, or null if no clamping happened.
function applyStartingTargetCap(task){
  const client = state.clients.find(c=>c.id===task.clientId);
  if(!client || !client.capToMonthlyGoal) return null;
  const cap = goalCapForDate(task.clientId, task.taskType, task.dueDate);
  if(cap===null) return null;
  const current = parseFloat(task.startingTarget);
  if(isNaN(current) || current<=cap) return null;
  task.startingTarget = cap;
  const rate = parseFloat(task.rate);
  if(!isNaN(rate) && rate!==0) task.estimatedHours = round2(cap/rate);
  return cap;
}

// Splits a monthly goal evenly across every weekday (Mon–Fri) task of the given
// type for a client that month, setting each task's Target field. Also stores the
// goal itself in state.monthlyGoals so the Reports page reflects the same number.
// Applies a day's total Starting Target across however many task pieces exist for
// that day (1 if not split, several if already auto-split), keeping each piece's
// existing relative share. Shared by Goal Planning and the manual Metabase import.
function applyDayStartingTarget(pieces, dayTotal){
  if(pieces.length===1){
    const t = pieces[0];
    t.startingTarget = dayTotal;
    const rate = parseFloat(t.rate);
    if(!isNaN(rate) && rate!==0) t.estimatedHours = round2(dayTotal/rate);
    return;
  }
  const oldTotal = pieces.reduce((s,t)=>s+(parseFloat(t.startingTarget)||0),0);
  let remaining = dayTotal;
  pieces.forEach((t,idx)=>{
    const isLast = idx===pieces.length-1;
    const ratio = oldTotal>0 ? (parseFloat(t.startingTarget)||0)/oldTotal : 1/pieces.length;
    const piece = isLast ? remaining : Math.round(dayTotal*ratio);
    remaining -= piece;
    t.startingTarget = piece;
    const rate = parseFloat(t.rate);
    if(!isNaN(rate) && rate!==0) t.estimatedHours = round2(piece/rate);
  });
}

// Recomputes future days' Starting Target based on progress so far this month:
// (monthly goal − everything completed so far) ÷ (working days still ahead).
// Today and past days are never touched — only days strictly after today. Runs
// automatically whenever Total Completed changes for a client + task type that
// has a monthly goal set, then re-runs Auto-Assign across the affected future
// days so assignments stay optimized against the new pace.
async function rebalanceFutureDays(clientId, taskType, monthKey){
  const goal = state.monthlyGoals[monthKey] && state.monthlyGoals[monthKey][taskType] && state.monthlyGoals[monthKey][taskType][clientId];
  if(goal===undefined || goal==='' || goal===null) return null; // no monthly goal set — nothing to rebalance against

  await ensureClientTasksLoaded(clientId);
  const monthTasks = state.taskCache[clientId].filter(t=>t.taskType===taskType && t.dueDate && t.dueDate.slice(0,7)===monthKey);
  const totalCompleted = monthTasks.reduce((s,t)=>s+(parseFloat(t.totalCompleted)||0),0);
  const monthlyRemaining = Math.max(0, round2((parseFloat(goal)||0) - totalCompleted));

  const today = fmtDate(new Date());
  const weekdayDates = weekdayDatesInMonth(monthKey, taskType);
  const futureDates = weekdayDates.filter(d=>d>today);
  if(futureDates.length===0) return { monthlyRemaining, futureDaysCount:0, newDailyTarget:0, autoAssignResult:null };

  const newDailyTarget = Math.ceil(monthlyRemaining/futureDates.length);

  const byDate = {};
  monthTasks.forEach(t=>{ if(futureDates.includes(t.dueDate)) (byDate[t.dueDate]=byDate[t.dueDate]||[]).push(t); });
  Object.keys(byDate).forEach(date=>{
    applyDayStartingTarget(byDate[date], newDailyTarget);
    byDate[date].forEach(t=>applyStartingTargetCap(t));
  });
  await saveClientTasks(clientId);

  const autoAssignResult = await runAutoAssign(futureDates[0], futureDates[futureDates.length-1]);

  return { monthlyRemaining, futureDaysCount:futureDates.length, newDailyTarget, autoAssignResult };
}

async function distributeMonthlyGoal(clientId, taskType, monthKey, goalValue){
  const weekdayDates = weekdayDatesInMonth(monthKey, taskType);
  const weekdayCount = weekdayDates.length;
  const goalNum = parseFloat(goalValue) || 0;
  const dailyTarget = weekdayCount>0 ? Math.ceil(goalNum/weekdayCount) : 0;

  await ensureClientTasksLoaded(clientId);
  const weekdaySet = new Set(weekdayDates);

  // group same-day tasks (a day already split across multiple stylists shares
  // one due date/type but several task rows) so the daily target gets divided
  // across them instead of duplicated onto every piece
  const byDate = {};
  state.taskCache[clientId].forEach(t=>{
    if(t.taskType===taskType && t.dueDate && t.dueDate.slice(0,7)===monthKey){
      (byDate[t.dueDate] = byDate[t.dueDate] || []).push(t);
    }
  });

  let touched = false;
  Object.keys(byDate).forEach(date=>{
    const pieces = byDate[date];
    if(!weekdaySet.has(date)){
      // weekend or holiday within the same month — clear any stale value from a prior run
      pieces.forEach(t=>{ t.startingTarget = ''; });
      touched = true;
      return;
    }
    applyDayStartingTarget(pieces, dailyTarget);
    touched = true;
  });
  if(touched) await saveClientTasks(clientId);

  if(!state.monthlyGoals[monthKey]) state.monthlyGoals[monthKey] = {};
  if(!state.monthlyGoals[monthKey][taskType]) state.monthlyGoals[monthKey][taskType] = {};
  state.monthlyGoals[monthKey][taskType][clientId] = goalValue;
  await saveMonthlyGoals();

  // Auto-assign the whole month right after the goal changes — capacity is shared
  // across every client a stylist works on that day, so this re-optimizes across
  // all clients for the month, not just the one whose goal was just edited. This
  // both fills newly-targeted tasks and can reassign existing ones for a better fit.
  const [gy, gm] = monthKey.split('-').map(Number);
  const monthFrom = `${monthKey}-01`;
  const monthTo = `${monthKey}-${String(daysInMonth(gy, gm-1)).padStart(2,'0')}`;
  const autoAssignResult = await runAutoAssign(monthFrom, monthTo);

  return { weekdayCount, dailyTarget, autoAssignResult };
}

function goalPlanSectionHtml(taskType, months){
  const search = (state.goalPlanSearch||'').toLowerCase();
  const rows = state.clients
    .filter(c=>!search || c.name.toLowerCase().includes(search))
    .sort((a,b)=>a.name.localeCompare(b.name));

  const headerCells = months.map(mk=>`<th>${monthLabel(mk).replace(' ', '<br>')}</th>`).join('');

  const rowsHtml = rows.map(c=>{
    const cells = months.map(mk=>{
      const goal = (state.monthlyGoals[mk] && state.monthlyGoals[mk][taskType] && state.monthlyGoals[mk][taskType][c.id] !== undefined)
        ? state.monthlyGoals[mk][taskType][c.id] : '';
      const weekdayCount = weekdayDatesInMonth(mk, taskType).length;
      const goalNum = parseFloat(goal)||0;
      const dailyTarget = goalNum>0 ? Math.ceil(goalNum/weekdayCount) : null;
      return `<td style="min-width:100px;">
        <input type="number" data-goalplan-input="${taskType}|${c.id}|${mk}" value="${goal}" placeholder="—" style="width:80px;">
        ${dailyTarget!==null?`<div class="hint" style="white-space:nowrap;">${dailyTarget}/day</div>`:''}
      </td>`;
    }).join('');
    return `<tr><td style="position:sticky;left:0;background:#fff;font-weight:600;">${escapeHtml(c.name)}</td>${cells}</tr>`;
  }).join('') || `<tr><td class="empty">No clients match "${escapeHtml(state.goalPlanSearch)}".</td></tr>`;

  const totalCells = months.map(mk=>{
    const sum = state.clients.reduce((s,c)=>{
      const goal = state.monthlyGoals[mk] && state.monthlyGoals[mk][taskType] && state.monthlyGoals[mk][taskType][c.id];
      return s + (parseFloat(goal)||0);
    }, 0);
    return `<td style="font-weight:700;font-family:'JetBrains Mono',monospace;">${sum ? round2(sum) : '—'}</td>`;
  }).join('');

  return `
    <div class="card" style="padding:18px 20px;margin-bottom:22px;overflow-x:auto;">
      <h3 style="font-size:16px;margin-bottom:4px;">${escapeHtml(taskType)}</h3>
      <div class="view-sub" style="margin-bottom:12px;">Enter a monthly goal per client — it's automatically split evenly across that month's weekday ${escapeHtml(taskType)} tasks and written to each task's Target field. ${HOLIDAY_REGION_BY_TASKTYPE[taskType]==='Macedonia' ? 'Macedonia holidays are skipped.' : 'US holidays are skipped.'}</div>
      <table class="wl-table" style="font-family:inherit;">
        <thead><tr><th style="position:sticky;left:0;background:#FCFBF9;">Client</th>${headerCells}</tr></thead>
        <tbody>${rowsHtml}</tbody>
        <tfoot><tr style="border-top:2px solid var(--line);">
          <td style="position:sticky;left:0;background:#FCFBF9;font-weight:700;">Total (all clients)</td>${totalCells}
        </tr></tfoot>
      </table>
    </div>
  `;
}

/* ============================= MY DASHBOARD ============================= */
async function renderMyDashboard(){
  // person may have been removed from their roster since this device last remembered them

      return `<tr class="taskrow" data-edit-task="${t.id}" data-edit-client="${t.clientId}">

        <td data-stop="1"><select class="inline-edit" data-inline-status="${t.id}|${t.clientId}">${STATUS_OPTIONS.map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></td>

    const tableHeadNoClient = `<thead><tr><th>Task Type</th><th>Stylist</th><th>Status</th><th>Starting Target</th><th>Remaining</th><th>Est. Hrs</th><th>Comments</th></tr></thead>`;

  const pct = me.capacity>0 ? Math.round((todayHours/me.capacity)*100) : 0;
  const barClass = pct>=100 ? 'cap-over' : pct>=85 ? 'cap-near' : 'cap-open';

  const rowHtml = (t)=>{

  const recentAnnouncements = [...state.announcements].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,5);

  const holidayCalendar = me.country==='US' ? state.holidaysUS : me.country==='Macedonia' ? state.holidaysMacedonia : null;

    ? `<div class="hint">Set your country in Settings to see your holiday calendar here.</div>`

          ? `<ul style="margin:0;padding-left:18px;">${upcoming.map(h=>`<li>${h.date} — ${escapeHtml(h.label)}</li>`).join('')}</ul>`

  const bulletinHtml = `

  return `

      <div>

    <div class="card" style="padding:18px 20px;margin-bottom:22px;">
      <h3 style="font-size:16px;margin-bottom:10px;">Today</h3>
      ${todayTasks.length ? `<table>${tableHead}<tbody>${todayTasks.map(rowHtml).join('')}</tbody></table>` : `<div class="empty" style="padding:20px;">Nothing assigned to you today.</div>`}
    </div>

    <div class="card" style="padding:18px 20px;">
      <h3 style="font-size:16px;margin-bottom:4px;">Rest of this week</h3>
      <div class="view-sub">${weekEnd}</div>
      ${upcomingHtml}

/* ============================= PTO CALENDAR ============================= */
async function renderPTOCalendar(){
  await ensureClientTasksLoaded(INTERNAL_ID);
  const today = fmtDate(new Date());
  if(!state.meetingDate) state.meetingDate = today;

  let ptoEntries = state.taskCache[INTERNAL_ID]
    .filter(t=>t.taskType==='PTO' && t.dueDate>=today)
    .sort((a,b)=> a.dueDate.localeCompare(b.dueDate) || stylistName(a.assignedStylist).localeCompare(stylistName(b.assignedStylist)));

  if(state.ptoCalendarStylist) ptoEntries = ptoEntries.filter(t=>t.assignedStylist===state.ptoCalendarStylist);

  const stylistOptions = `<option value="">All stylists</option>` + [...state.stylists].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${s.id}" ${state.ptoCalendarStylist===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('');

  let bodyHtml;
  if(ptoEntries.length===0){
    bodyHtml = `<div class="empty"><h3>No upcoming PTO${state.ptoCalendarStylist?' for this stylist':''}</h3><p>Submit PTO using the form above.</p></div>`;
  } else {
    const byMonth = {};
    ptoEntries.forEach(t=>{
      const mk = t.dueDate.slice(0,7);
      (byMonth[mk] = byMonth[mk] || []).push(t);
    });
    const monthKeys = Object.keys(byMonth).sort();
    bodyHtml = monthKeys.map((mk,idx)=>{
      const [y,m] = mk.split('-').map(Number);
      const rows = byMonth[mk].map(t=>`
        <tr>
          <td>${t.dueDate}</td><td>${t.dayOfWeek||dayOfWeekFromDate(t.dueDate)}</td>
          <td>${escapeHtml(stylistName(t.assignedStylist))}</td>
          <td>${t.ptoHalfDay ? '<span class="chip tag-chip">Half Day</span>' : 'Full Day'}</td>
          <td style="width:90px;"><button class="btn ghost" data-remove-pto="${t.id}">Remove</button></td>
        </tr>`).join('');
      return `<details class="month-accordion" ${idx===0?'open':''}>
        <summary>${MONTH_NAMES[m-1]} ${y}<span>${byMonth[mk].length} entr${byMonth[mk].length===1?'y':'ies'}</span></summary>
        <table><thead><tr><th>Date</th><th>Day</th><th>Stylist</th><th>Type</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      </details>`;
    }).join('');
  }

  return `
    <div class="view-header">
      <div>
        <div class="view-title">PTO and Meetings</div>
        <div class="view-sub">Submit PTO or request meeting time below, and see everyone's upcoming time off from today forward.</div>
      </div>
    </div>

    <div class="card" style="padding:20px 22px;margin-bottom:22px;border-color:var(--plum-light);">
      <h3 style="font-size:16px;margin-bottom:2px;">Submit PTO</h3>
      <div class="view-sub" style="margin-bottom:14px;">Pick your name and dates below. Submitting automatically moves your other tasks to another trained stylist with room — no need to tell anyone separately.</div>
      <div class="grid3" style="margin-bottom:12px;max-width:600px;">
        <div class="field"><span class="field-label">Your name</span><select id="pto-stylist"><option value="">Select…</option>${[...state.stylists].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${s.id}" ${state.ptoStylist===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select></div>
        <div class="field"><span class="field-label">From</span><input type="date" id="pto-from" value="${state.ptoFrom}"></div>
        <div class="field"><span class="field-label">To</span><input type="date" id="pto-to" value="${state.ptoTo}"></div>
      </div>
      <div class="field" style="max-width:300px;margin-bottom:14px;">
        <span class="field-label">Day Type</span>
        <select id="pto-half-day">
          <option value="">Full Day</option>
          <option value="half">Half Day <span class="hint">(half your daily capacity freed up, not all of it)</span></option>
        </select>
      </div>
      <button class="btn" data-action="submit-pto" ${state.ptoSubmitting?'disabled':''}>${state.ptoSubmitting?'Submitting…':'Submit PTO'}</button>
      ${ptoResultBannerHtml(state.ptoResult)}
    </div>

    <div class="card" style="padding:20px 22px;margin-bottom:22px;border-color:var(--plum-light);">
      <h3 style="font-size:16px;margin-bottom:2px;">Request Meeting Time</h3>
